<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chapter 2. 마취 계획 — 베타 1.1</title>
  <link rel="stylesheet" href="beta11.css" />
  <script src="beta11-settings.js"></script>
  <script src="beta11-ch1-data.js"></script>
</head>
<body>
  <div class="app-shell chapter-shell">
    <header class="top-bar">
      <div class="top-left">
        <div class="top-title">Chapter 2. 마취 계획</div>
      </div>
      <div id="chapter-top-actions" class="top-actions"></div>
    </header>

    <main class="ch1-page-body">
      <div class="ch1-split" id="ch2-split">
        <!-- 좌측(데스크탑) / 상단(모바일): 모니터링창 -->
        <section class="ch1-monitor" id="ch2-monitor" aria-label="마취 계획 모니터링창">
          <!-- 고정 영역: 이름, 품종, 나이, 체중, 성별(중성화 유무), ASA grade (예후) / 주호소 -->
          <div class="ch1-sig-pinned">
            <div class="ch1-sig-head" id="ch2-sig-head"></div>
            <div class="ch1-cc-line" id="ch2-cc-line"></div>
          </div>

          <div class="ch1-monitor-scroll" id="ch2-monitor-scroll" style="cursor:grab;">
            <!-- 1. 마취 전 검사 결과 -->
            <div class="mon-sec" id="ch2-sec-preop">
              <div class="mon-sec-title">
                <span>1. 마취 전 검사 결과</span>
                <div style="display:flex; align-items:center; gap:5px; flex-shrink:0;">
                  <button type="button" class="b-btn mon-toggle-btn" id="ch2-preop-detail-btn">상세</button>
                  <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch2-sec-preop">접기</button>
                </div>
              </div>
              <div class="mon-sec-body" id="ch2-preop-body"></div>
            </div>

            <!-- 2. 처치 계획 -->
            <div class="mon-sec" id="ch2-sec-plan">
              <div class="mon-sec-title">
                <span>2. 처치 계획</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch2-sec-plan">접기</button>
              </div>
              <div class="mon-sec-body" id="ch2-plan-body"></div>
            </div>

            <!-- 3. 보호자 안내 -->
            <div class="mon-sec" id="ch2-sec-consent">
              <div class="mon-sec-title">
                <span>3. 보호자 안내</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch2-sec-consent">접기</button>
              </div>
              <div class="mon-sec-body">
                <div class="sig-hx-list" id="ch2-consent-list"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 우측(데스크탑) / 하단(모바일): 조작창 -->
        <section class="ch1-control" id="ch2-control" aria-label="마취 계획 조작창">
          <div class="ch1-ctrl-handle" id="ch2-ctrl-handle" role="button" tabindex="0" aria-label="조작창 접기 및 펼치기">
            <div class="ch1-ctrl-handle-bar"></div>
          </div>

          <div class="ch1-ctrl-tabs" role="tablist">
            <button type="button" class="b-btn ch1-tab-btn active" data-pane="premed">전처치</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="indmaint">유도·유지제</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="notify">보호자 안내</button>
          </div>

          <div class="ch1-ctrl-body" id="ch2-ctrl-body">
            <!-- 1. 전처치 -->
            <div class="ch1-pane" data-content="premed">
              <div>
                <div class="ch2-cat-head">
                  <div class="eval-sec-lbl">안정화</div>
                  <button type="button" class="b-btn ch2-q-btn" data-cat-help="stab" aria-label="안정화 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-multi-cat="stab" data-val="수화">수화</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="stab" data-val="산소화">산소화</button>
                </div>
              </div>

              <div>
                <div class="ch2-cat-head">
                  <div class="eval-sec-lbl">항생제</div>
                  <button type="button" class="b-btn ch2-q-btn" data-cat-help="abx" aria-label="항생제 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-multi-cat="abx" data-val="Cefazolin">Cefazolin</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="abx" data-val="Ampicillin-Sulbactam">Ampicillin-Sulbactam</button>
                  <button type="button" class="b-btn prog-btn span-2" data-multi-cat="abx" data-val="Metronidazole">Metronidazole</button>
                </div>
              </div>

              <div>
                <div class="ch2-cat-head">
                  <div class="eval-sec-lbl">기타 주사제</div>
                  <button type="button" class="b-btn ch2-q-btn" data-cat-help="inj" aria-label="기타 주사제 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-multi-cat="inj" data-val="Esomeprazole">Esomeprazole</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="inj" data-val="Maropitant">Maropitant</button>
                  <button type="button" class="b-btn prog-btn span-2" data-multi-cat="inj" data-val="Anticholinergics">Anticholinergics</button>
                </div>
              </div>

              <div>
                <div class="ch2-cat-head">
                  <div class="eval-sec-lbl">진정제</div>
                  <button type="button" class="b-btn ch2-q-btn" data-cat-help="sed" aria-label="진정제 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-multi-cat="sed" data-val="α2-agonist">α2-agonist</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="sed" data-val="Acepromazine">Acepromazine</button>
                  <button type="button" class="b-btn prog-btn span-2" data-multi-cat="sed" data-val="Benzodiazepines">Benzodiazepines</button>
                </div>
              </div>

              <div>
                <div class="ch2-cat-head">
                  <div class="eval-sec-lbl">진통제/진통수액</div>
                  <button type="button" class="b-btn ch2-q-btn" data-cat-help="analg" aria-label="진통제/진통수액 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-multi-cat="analg" data-val="Butorphanol">Butorphanol</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="analg" data-val="Fentanyl">Fentanyl</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="analg" data-val="Fentanyl CRI">Fentanyl CRI</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="analg" data-val="FLK CRI">FLK CRI</button>
                </div>
              </div>
            </div>

            <!-- 2. 유도, 유지제 -->
            <div class="ch1-pane pane-hidden" data-content="indmaint">
              <div>
                <div class="ch2-cat-head">
                  <div class="eval-sec-lbl">유도제</div>
                  <button type="button" class="b-btn ch2-q-btn" data-cat-help="ind" aria-label="유도제 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-single-cat="ind" data-val="Alfaxalone">Alfaxalone</button>
                  <button type="button" class="b-btn prog-btn" data-single-cat="ind" data-val="Propofol">Propofol</button>
                  <button type="button" class="b-btn prog-btn span-2" data-single-cat="ind" data-val="Etomidate">Etomidate</button>
                </div>
              </div>

              <div>
                <div class="ch2-cat-head">
                  <div class="eval-sec-lbl">유지제</div>
                  <button type="button" class="b-btn ch2-q-btn" data-cat-help="maint" aria-label="유지제 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-single-cat="maint" data-val="Isoflurane">Isoflurane</button>
                  <button type="button" class="b-btn prog-btn" data-single-cat="maint" data-val="Sevoflurane">Sevoflurane</button>
                </div>
              </div>

              <div>
                <div class="ch2-cat-head">
                  <div class="eval-sec-lbl">수액</div>
                  <button type="button" class="b-btn ch2-q-btn" data-cat-help="fluid" aria-label="수액 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-multi-cat="fluid" data-val="0.9% NS">0.9% NS</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="fluid" data-val="LRS(H/S)">LRS(H/S)</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="fluid" data-val="Plasmalyte">Plasmalyte</button>
                  <button type="button" class="b-btn prog-btn" data-multi-cat="fluid" data-val="수혈">수혈</button>
                </div>
              </div>
            </div>

            <!-- 3. 보호자 안내 & 계획 확정 -->
            <div class="ch1-pane pane-hidden" data-content="notify">
              <div class="ch1-chat-log" id="ch2-chat-log"></div>
              <form class="ch1-chat-form" id="ch2-chat-form" autocomplete="off">
                <input id="ch2-chat-input" type="text" class="b-input" placeholder="안내사항을 입력하세요." />
                <button id="ch2-chat-send" type="submit" class="b-btn b-btn-sm" style="flex-shrink:0;">전송</button>
              </form>
              <button type="button" class="b-btn" id="ch2-eval-submit" style="width:100%; height:42px; border-radius:14px; flex-shrink:0;">계획 확정</button>
            </div>

            <!-- 50% 투명도 빨간 사각형 도장 -->
            <div id="ch2-stamp-overlay" class="ch1-stamp-overlay hidden" aria-live="polite">
              <div class="ch1-stamp-asa" id="ch2-stamp-asa"></div>
              <div class="ch1-stamp-prog" id="ch2-stamp-prog"></div>
              <div class="ch1-stamp-grade" id="ch2-stamp-grade"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 실패 팝업 (F 등급 또는 보호자 신뢰 붕괴 시 — 배경 클릭/ESC로 닫히지 않음) -->
  <div id="ch2-fail-modal" class="modal-backdrop no-dismiss hidden" role="dialog" aria-modal="true" aria-labelledby="ch2-fail-title" style="backdrop-filter:blur(6px); z-index:105;">
    <div class="modal-card" style="text-align:center;">
      <h2 id="ch2-fail-title" class="font-maru" style="font-size:20px; font-weight:700; color:#dc2626; margin-bottom:8px;">진료 중단</h2>
      <p id="ch2-fail-desc" class="muted" style="font-size:15px; font-weight:600; line-height:1.5; margin-bottom:16px;"></p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button id="ch2-fail-review" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">해설 보기</button>
        <button id="ch2-fail-restart" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">재시작</button>
        <button id="ch2-fail-main" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">메인화면</button>
      </div>
    </div>
  </div>

  <!-- 범주별 약물/처치 도움말 팝업 -->
  <div id="ch2-cat-help-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ch2-cat-help-title" style="backdrop-filter:blur(6px); z-index:116;">
    <div class="modal-card" style="max-width:440px; max-height:84dvh; display:flex; flex-direction:column;">
      <h2 id="ch2-cat-help-title" class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">도움말</h2>
      <div id="ch2-cat-help-body" class="ch2-help-list" style="flex:1 1 auto; overflow-y:auto; padding-right:2px;"></div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch2-cat-help-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <!-- Chapter 1 마취 전 검사 결과 상세 팝업 -->
  <div id="ch2-preop-detail-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ch2-detail-title" style="backdrop-filter:blur(6px); z-index:115;">
    <div class="modal-card" style="max-width:460px; max-height:85dvh; display:flex; flex-direction:column;">
      <h2 id="ch2-detail-title" class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">마취 전 검사 상세 결과</h2>
      <div class="step-tabs" role="tablist" style="margin-bottom:10px; flex-shrink:0;">
        <button type="button" class="step-tab active" data-dt-tab="pe">신체검사</button>
        <button type="button" class="step-tab" data-dt-tab="lab">혈액검사</button>
        <button type="button" class="step-tab" data-dt-tab="img">영상검사</button>
      </div>
      <div style="flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:200px; padding-right:2px;">
        <div id="ch2-dt-pe" data-dt-pane="pe"></div>
        <div id="ch2-dt-lab" data-dt-pane="lab" class="pane-hidden"></div>
        <div id="ch2-dt-img" data-dt-pane="img" class="pane-hidden"></div>
      </div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch2-detail-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <!-- 해설 보기 팝업 -->
  <div id="ch2-review-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ch2-review-title" style="backdrop-filter:blur(6px); z-index:120;">
    <div class="modal-card" style="max-width:420px; max-height:84dvh; display:flex; flex-direction:column;">
      <h2 id="ch2-review-title" class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">해설 보기</h2>
      <div class="step-tabs" role="tablist" style="margin-bottom:10px; flex-shrink:0;">
        <button type="button" class="step-tab active" data-rv-tab="wrong">오답노트</button>
        <button type="button" class="step-tab" data-rv-tab="ai">AI 로그 분석</button>
        <button type="button" class="step-tab" data-rv-tab="soap">SOAP 분석</button>
      </div>
      <div style="flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:180px;">
        <div id="ch2-rv-wrong" data-rv-pane="wrong"></div>
        <div id="ch2-rv-ai" data-rv-pane="ai" class="pane-hidden"></div>
        <div id="ch2-rv-soap" data-rv-pane="soap" class="pane-hidden"></div>
      </div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch2-review-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const Data = window.Beta11Ch1Data;
      const Settings = window.Beta11Settings;
      if (!Data || !Settings) return;

      const splitEl = document.getElementById('ch2-split');
      const monitorScrollEl = document.getElementById('ch2-monitor-scroll');
      const sigHeadEl = document.getElementById('ch2-sig-head');
      const ccLineEl = document.getElementById('ch2-cc-line');
      const preopBodyEl = document.getElementById('ch2-preop-body');
      const planBodyEl = document.getElementById('ch2-plan-body');
      const consentListEl = document.getElementById('ch2-consent-list');
      const ctrlHandleEl = document.getElementById('ch2-ctrl-handle');
      const chatLogEl = document.getElementById('ch2-chat-log');
      const chatFormEl = document.getElementById('ch2-chat-form');
      const chatInputEl = document.getElementById('ch2-chat-input');
      const chatSendBtn = document.getElementById('ch2-chat-send');
      const evalSubmitBtn = document.getElementById('ch2-eval-submit');
      const stampOverlayEl = document.getElementById('ch2-stamp-overlay');
      const stampAsaEl = document.getElementById('ch2-stamp-asa');
      const stampProgEl = document.getElementById('ch2-stamp-prog');
      const stampGradeEl = document.getElementById('ch2-stamp-grade');

      const catHelpModalEl = document.getElementById('ch2-cat-help-modal');
      const catHelpTitleEl = document.getElementById('ch2-cat-help-title');
      const catHelpBodyEl = document.getElementById('ch2-cat-help-body');

      const detailModalEl = document.getElementById('ch2-preop-detail-modal');
      const dtPeEl = document.getElementById('ch2-dt-pe');
      const dtLabEl = document.getElementById('ch2-dt-lab');
      const dtImgEl = document.getElementById('ch2-dt-img');

      const reviewModalEl = document.getElementById('ch2-review-modal');
      const rvWrongEl = document.getElementById('ch2-rv-wrong');
      const rvAiEl = document.getElementById('ch2-rv-ai');
      const rvSoapEl = document.getElementById('ch2-rv-soap');

      // 범주별 도움말 (물음표 버튼)
      const CAT_HELP = {
        stab: {
          title: '안정화 도움말',
          items: [
            { name: '수화', desc: '마취 도입 시 혈관확장으로 생기는 급격한 저혈압을 견딜 수 있도록 탈수·저혈량과 전해질 불균형을 미리 교정해 순환 예비력을 확보하기 위해서입니다.' },
            { name: '산소화', desc: '폐 속 질소를 100% 산소로 치환(탈질소화)해 두어, 마취 유도 직후의 무호흡과 기관 삽관 시간 동안 저산소혈증이 오기까지의 안전 여유 시간을 최대한 늘리기 위해서입니다.' }
          ]
        },
        abx: {
          title: '항생제 도움말',
          items: [
            { name: 'Cefazolin', desc: '피부 상재균(그람양성 포도상구균·연쇄상구균)과 일부 그람음성균을 안전하게 커버하고 조직·골 침투력이 우수해, 정형외과·일반 연부조직 등 대부분 수술의 1차 예방적 항생제로 쓰입니다.' },
            {
              name: 'Ampicillin-Sulbactam',
              desc: 'β-lactamase 생성균과 혐기성균까지 폭넓게 커버하면서 IV 투여로 즉시 혈중 농도를 맞출 수 있고, 구강·위장관·간담도·오염 창상, 임신 및 제왕절개 수술에 쓰입니다.',
              note: '*Amoxicillin-Clavulanate는 마취 중 과민반응·저혈압 등 부작용 발생률(약 36%)이 높고 용해 후 안정성도 짧음'
            },
            { name: 'Metronidazole', desc: '혐기성균 전용 살균력이 뛰어나, 대장·장 절개·복막염 등 혐기성균 오염 위험이 높은 수술에서 Cefazolin과 병용해 부족한 혐기성 커버력을 보완하기 위해 쓰입니다.' }
          ]
        },
        inj: {
          title: '기타 주사제 도움말',
          items: [
            { name: 'Esomeprazole (PPI IV)', desc: '마취 중 위식도역류(GER) 고위험군(단두종·BOAS·위장관 수술 등)에서 위산 분비를 강력히 억제해 역류액의 pH를 높여 역류성 식도염과 식도 협착을 예방하기 위해 쓰입니다.' },
            { name: 'Maropitant (NK-1 길항제)', desc: '오피오이드·알파-2 작용제 유발 구토·오심과 흡인성 폐렴을 예방하고, 내장통 완화 및 흡입마취제 요구량(MAC) 절감 보조 효과를 얻기 위해 쓰입니다.' },
            {
              name: 'Anticholinergics (Atropine / Glycopyrrolate)',

      function escapeHtml(s) {

      }

      /* Monitoring Window Drag-to-Scroll (Desktop Mouse & Mobile Touch) */
      let monDrag = false, monStartY = 0, monStartScroll = 0;
      monitorScrollEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        if (e.target.closest('button, a, input, select, textarea')) return;
        monDrag = true;
        monStartY = e.clientY;
        monStartScroll = monitorScrollEl.scrollTop;
        monitorScrollEl.style.cursor = 'grabbing';
        monitorScrollEl.style.userSelect = 'none';
      });
      window.addEventListener('pointermove', (e) => {
        if (!monDrag) return;
        monitorScrollEl.scrollTop = monStartScroll - (e.clientY - monStartY);
      });
      const endMonDrag = () => {
        if (!monDrag) return;
        monDrag = false;
        monitorScrollEl.style.cursor = 'grab';
        monitorScrollEl.style.userSelect = '';
      };
      window.addEventListener('pointerup', endMonDrag);
      window.addEventListener('pointercancel', endMonDrag);

      /* Box Collapse / Expand */
      function setMonCollapsed(secId, collapsed) {
        const sec = document.getElementById(secId);
        if (!sec) return;
        sec.classList.toggle('is-collapsed', Boolean(collapsed));
        const btn = sec.querySelector('[data-mon-toggle]');
        if (btn) btn.textContent = collapsed ? '열기' : '접기';
      }
      document.querySelectorAll('[data-mon-toggle]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const secId = btn.dataset.monToggle;
          const sec = document.getElementById(secId);
          if (!sec) return;
          Settings.playTone(500, 0.04, 0.025);
          setMonCollapsed(secId, !sec.classList.contains('is-collapsed'));
        });
      });

        const cbcRows = [

          ['MCV', 'MCV', cb.MCV, 'fL'], ['MCH', 'MCH', cb.MCH, 'pg'], ['MCHC', 'MCHC', cb.MCHC, 'g/dL'],
          ['RDW', 'RDW', cb.RDW, '%'], ['RETIC', 'RETIC', cb.RETIC, 'K/µL'], ['Retic-HGB', 'ReticHGB', cb.ReticHGB, 'pg'],
          ['WBC', 'WBC', cb.WBC, 'K/µL'], ['Neu', 'Neu', `${cb.Neu} (${cb.neuP}%)`, ''], ['Lym', 'Lym', `${cb.Lym} (${cb.lymP}%)`, ''],
          ['Mono', 'Mono', `${cb.Mono} (${cb.monoP}%)`, ''], ['Eos', 'Eos', `${cb.Eos} (${cb.eosP}%)`, ''],
          ['Baso', 'Baso', `${cb.Baso} (${cb.basoP}%)`, ''], ['PLT', 'PLT', cb.PLT, 'K/µL'],
          ['MPV', 'MPV', cb.MPV, 'fL'], ['PCT', 'PCT', cb.PCT, '%']
        ];
        const chemGeneral = [
          ['ALP', 'ALP', ch.ALP, 'U/L'], ['ALT', 'ALT', ch.ALT, 'U/L'], ['AST', 'AST', ch.AST, 'U/L'],
          ['GGT', 'GGT', ch.GGT, 'U/L'], ['BUN', 'BUN', ch.BUN, 'mg/dL'], ['Crea', 'Crea', ch.Crea, 'mg/dL'],
          ['Phos', 'Phos', ch.Phos, 'mg/dL'], ['Ca', 'Ca', ch.Ca, 'mg/dL'], ['TG', 'TG', ch.TG, 'mg/dL'],
          ['Tchol', 'Tchol', ch.Tchol, 'mg/dL'], ['Glu', 'Glu', ch.Glu, 'mg/dL'], ['TP', 'TP', ch.TP, 'g/dL'],
          ['ALB', 'ALB', ch.ALB, 'g/dL'], ['Glob', 'Glob', ch.Glob, 'g/dL'], ['Mg', 'Mg', ch.Mg, 'mg/dL']
        ];
        const chemSpecial = isCat
          ? [['SAA', 'SAA', ch.SAA, 'µg/mL'], ['fPL', 'fPL', ch.fPL, 'µg/L'], ['proBNP', 'proBNP', ch.proBNP, 'pmol/L'], ['T4', 'T4', ch.T4, 'µg/dL'], ['Cortisol', 'Cortisol', ch.Cortisol, 'µg/dL'], ['SDMA', 'SDMA', ch.SDMA, 'µg/dL']]
          : [['CRP', 'CRP', ch.CRP, 'mg/L'], ['cPL', 'cPL', ch.cPL, 'µg/L'], ['proBNP', 'proBNP', ch.proBNP, 'pmol/L'], ['T4', 'T4', ch.T4, 'µg/dL'], ['Cortisol', 'Cortisol', ch.Cortisol, 'µg/dL'], ['SDMA', 'SDMA', ch.SDMA, 'µg/dL']];

        dtLabEl.innerHTML = `
          <div class="lab-group-lbl">정맥혈액가스 (VBG) — 측정 8종</div>
          ${renderLabTable(vbgMeasured, P)}
          <div class="lab-group-lbl">정맥혈액가스 (VBG) — 계산 13종</div>
          ${renderLabTable(vbgCalc, P)}
          <div class="lab-group-lbl">일반혈액검사 (CBC) — 18종</div>
          ${renderLabTable(cbcRows, P)}
          <div class="lab-group-lbl">혈액화학 (일반 15종)</div>
          ${renderLabTable(chemGeneral, P)}
          <div class="lab-group-lbl">혈액화학 (특수 6종)</div>
          ${renderLabTable(chemSpecial, P)}
        `;

        const im = c.imaging || {};
        const th = im.thoracic || {};
        const rows = [
          `<div class="img-row"><strong>흉부 X-ray</strong><br/>VHS: ${escapeHtml(th.vhs || '-')} · VLAS: ${escapeHtml(th.vlas || '-')}<br/>기관직경: ${escapeHtml(th.trachea || '-')}<br/>폐야: ${escapeHtml(th.lung || '-')}${th.extra ? '<br/>추가 소견: ' + escapeHtml(th.extra) : ''}</div>`
        ];
        if (im.abdominal) rows.push(`<div class="img-row"><strong>복부 X-ray</strong><br/>${escapeHtml(im.abdominal)}</div>`);
        if (im.ultrasound) rows.push(`<div class="img-row"><strong>초음파 검사</strong><br/>${escapeHtml(im.ultrasound)}</div>`);
        dtImgEl.innerHTML = `<div class="img-list">${rows.join('')}</div>`;
      }

      /* Box 1 Summary: PE (prose), Lab (abnormal only), Imaging (VHS, Trachea, Lung / abnormal findings only) */
      function renderPreopSummary(c, P) {
        const p = c.pe;
        const isCat = c.species === 'cat';
        const abnBT = p.bt < 37.5 || p.bt > 39.2;
        const abnBP = p.bpMap < 65 || p.bpSys > 155 || p.bpSys < 95;
        const abnHR = isCat ? (p.hr < 130 || p.hr > 210) : (p.hr < 65 || p.hr > 145);
        const abnRR = p.rr > 36;
        const abnCRT = p.crt > 2.0;
        const abnMMC = /yellow|pale|cyan|dark|muddy|dry/i.test(p.mmc);
        const auscHeart = p.auscHeart || '심잡음 없음 (정상 심음)';
        const auscLung = p.auscLung || '정상 폐포음';
        const auscBowel = p.auscBowel || '정상 복명음';
        const abnHeart = /Grade|분마음|부정맥|서맥|빈맥/i.test(auscHeart);
        const abnLung = /수포음|천명음|거친|감약|Crackle/i.test(auscLung);
        const abnBowel = /감소|소실|압통|팽만|항진/i.test(auscBowel);
        const peSpan = (txt, abn) => abn ? `<span style="color:#b91c1c; font-weight:700;">${escapeHtml(txt)}</span>` : `<span>${escapeHtml(txt)}</span>`;

        const abnLabs = [];
        const addIfAbn = (label, key, val, unit = '') => {
          const num = Number(val);
          if (!Number.isFinite(num)) return;
          const fl = P.flagOf(key, num);
          if (!fl) return;
          const cls = fl === 'H' ? 'lab-high' : 'lab-low';
          abnLabs.push(`<span class="${cls}" style="font-weight:600;">${escapeHtml(label)} ${val}${unit ? ' ' + unit : ''}(${fl})</span>`);
        };
        const m = P.vbgM, vc = P.vbgC, cb = P.cbc, ch = P.chem;
        [['pH', 'pH', m.pH.toFixed(2), ''], ['pCO₂', 'pCO2', m.pCO2, 'mmHg'], ['Na⁺', 'Na', m.Na, ''], ['K⁺', 'K', m.K.toFixed(1), ''], ['Cl⁻', 'Cl', m.Cl, ''], ['iCa', 'iCa', m.iCa.toFixed(2), ''], ['Hct', 'Hct', m.Hct, '%']].forEach((r) => addIfAbn(...r));
        [['cHCO₃⁻', 'cHCO3', vc.cHCO3, ''], ['BE(ecf)', 'BEecf', vc.BEecf, ''], ['AG(K)', 'AGK', vc.AGK, '']].forEach((r) => addIfAbn(...r));
        [['RBC', 'RBC', cb.RBC, ''], ['HGB', 'HGB', cb.HGB, ''], ['HCT', 'HCT', cb.HCT, '%'], ['WBC', 'WBC', cb.WBC, ''], ['Neu', 'Neu', cb.Neu, ''], ['Lym', 'Lym', cb.Lym, ''], ['PLT', 'PLT', cb.PLT, '']].forEach((r) => addIfAbn(...r));
        const chemKeys = ['ALP', 'ALT', 'AST', 'GGT', 'BUN', 'Crea', 'Phos', 'Ca', 'TG', 'Tchol', 'Glu', 'TP', 'ALB', 'Glob', 'Mg', ...(isCat ? ['SAA', 'fPL'] : ['CRP', 'cPL']), 'proBNP', 'T4', 'Cortisol', 'SDMA'];
        chemKeys.forEach((k) => { if (ch[k] !== undefined) addIfAbn(k, k, ch[k], ''); });

        const im = c.imaging || {};
        const th = im.thoracic || {};
        const isNormalText = (txt) => {
          const s = String(txt || '').trim();
          if (!s) return true;
          return /^(?:(?:흉강|복강|복부|흉부|초음파)\s*내?\s*)?(?:특이\s*소견|이상\s*소견|특이사항|이상)\s*없음[\s.]*$|^정상(?:\s*소견)?[\s.]*$/i.test(s);
        };
        const specialFindings = [];
        if (th.extra && !isNormalText(th.extra)) specialFindings.push(th.extra);
        if (im.abdominal && !isNormalText(im.abdominal)) specialFindings.push(`복부 X-ray: ${im.abdominal}`);
        if (im.ultrasound && !isNormalText(im.ultrasound)) specialFindings.push(`초음파: ${im.ultrasound}`);

        preopBodyEl.innerHTML = `
          <div class="sig-hx-list" style="gap:8px;">
            <div>
              <div style="font-weight:700; color:var(--brown); margin-bottom:3px;">• 신체검사</div>
              <div style="line-height:1.6;">
                BT ${peSpan(p.bt.toFixed(1) + ' °C', abnBT)} · BP #${p.cuff} ${peSpan(`${p.bpSys}/${p.bpDia}(${p.bpMap}) mmHg`, abnBP)} · HR ${peSpan(p.hr + ' /min', abnHR)} · RR ${peSpan(p.rr + ' /min', abnRR)} · CRT ${peSpan(p.crt + ' s', abnCRT)} · MMC ${peSpan(p.mmc, abnMMC)}
                <div style="margin-top:2px;">청진: 심잡음(${peSpan(auscHeart, abnHeart)}) · 폐음(${peSpan(auscLung, abnLung)}) · 복명음(${peSpan(auscBowel, abnBowel)})</div>
              </div>
            </div>
            <div>
              <div style="font-weight:700; color:var(--brown); margin-bottom:3px;">• 혈액검사 (이상 수치)</div>
              <div style="line-height:1.55;">${abnLabs.length ? abnLabs.join(', ') : '<span class="muted">이상 수치 없음</span>'}</div>
            </div>
            <div>
              <div style="font-weight:700; color:var(--brown); margin-bottom:3px;">• 영상검사</div>
              <div style="line-height:1.55;">
                VHS: <strong>${escapeHtml(th.vhs || '-')}</strong> · 기관직경: ${escapeHtml(th.trachea || '-')} · 폐야: ${escapeHtml(th.lung || '-')}
                ${specialFindings.length ? `<div style="margin-top:3px; color:#b91c1c;">특이소견: ${specialFindings.map(escapeHtml).join(' / ')}</div>` : ''}
              </div>
            </div>
          </div>
        `;
      }

      /* Mobile Control Drawer Drag (Desktop disabled) */
      function setCollapsed(c) {
        if (window.innerWidth >= 960) { splitEl.classList.remove('ctrl-collapsed'); return; }
        splitEl.classList.toggle('ctrl-collapsed', Boolean(c));
      }
      let hY = 0, hDrag = false, hMoved = false;
      ctrlHandleEl.addEventListener('pointerdown', (e) => {
        if (window.innerWidth >= 960) return;
        hDrag = true; hMoved = false; hY = e.clientY;
        if (ctrlHandleEl.setPointerCapture) ctrlHandleEl.setPointerCapture(e.pointerId);
      });
      ctrlHandleEl.addEventListener('pointermove', (e) => {
        if (!hDrag) return;
        const dy = e.clientY - hY;
        if (Math.abs(dy) > 20) { hMoved = true; setCollapsed(dy > 0); }
      });
      const endH = () => { if (!hDrag) return; hDrag = false; if (!hMoved) setCollapsed(!splitEl.classList.contains('ctrl-collapsed')); };
      ctrlHandleEl.addEventListener('pointerup', endH);
      ctrlHandleEl.addEventListener('pointercancel', endH);
      window.addEventListener('resize', () => { if (window.innerWidth >= 960) splitEl.classList.remove('ctrl-collapsed'); });

      function activateTab(p) {
        setCollapsed(false);
        document.querySelectorAll('.ch1-tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.pane === p));
        document.querySelectorAll('[data-content]').forEach((el) => el.classList.toggle('pane-hidden', el.dataset.content !== p));
      }
      document.querySelectorAll('.ch1-tab-btn').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); activateTab(b.dataset.pane); }));

      /* Evaluate Plan (Hidden Clinical Scoring Rules) */
      function evaluatePlan(c) {
        const stab = Array.from(planState.stab);
        const abx = Array.from(planState.abx);
        const inj = Array.from(planState.inj);
        const sed = Array.from(planState.sed);
        const analg = Array.from(planState.analg);
        const ind = planState.ind;
        const maint = planState.maint;
        const fluid = Array.from(planState.fluid);

        const warnings = [];
        const synergies = [];
        let penalty = 0;

        // 필수 기본 항목
        if (!stab.length) { warnings.push('대기 중 안정화(수화 또는 산소화)가 선택되지 않았습니다.'); penalty += 6; }
        if (!analg.length) { warnings.push('진통제/진통수액이 선택되지 않았습니다.'); penalty += 10; }
        if (!ind) { warnings.push('유도제가 선택되지 않았습니다.'); penalty += 18; }
        if (!maint) { warnings.push('유지제(Isoflurane 또는 Sevoflurane)가 선택되지 않았습니다.'); penalty += 15; }
        if (!fluid.length) { warnings.push('수액 처치 계획이 선택되지 않았습니다.'); penalty += 8; }

        // 항생제 병용 규칙: Cefazolin+Metronidazole 허용 / Cefa+Ampi, Ampi+Metro 감점
        const hasCefa = abx.includes('Cefazolin');
        const hasAmpi = abx.includes('Ampicillin-Sulbactam');
        const hasMetro = abx.includes('Metronidazole');
        if (hasCefa && hasAmpi) {
          warnings.push('항생제 중복 병용: Cefazolin과 Ampicillin-Sulbactam은 스펙트럼이 중복되어 병용을 피합니다.');
          penalty += 8;
        }
        if (hasAmpi && hasMetro) {
          warnings.push('항생제 중복 병용: Ampicillin-Sulbactam은 혐기성균을 포함하므로 Metronidazole과의 중복 병용은 불필요합니다.');
          penalty += 8;
        }
        if (hasCefa && hasMetro && !hasAmpi) {
          synergies.push('Cefazolin + Metronidazole 병용: 그람양성·음성 및 혐기성균을 균형 있게 커버합니다.');
        }

        // 진정제 복수 선택 감점 (UI 비노출)
        if (sed.length >= 2) {
          warnings.push('진정제 중복 선택: 진정제 복수 투여로 과진정 및 심혈관·호흡 억제 위험이 커집니다.');
          penalty += 10;
        }

        // 진통제 강도 및 Butorphanol + Full μ-opioid 병용 감점 (UI 비노출)
        const hasButorph = analg.includes('Butorphanol');
        const hasFullMu = analg.some((d) => ['Fentanyl', 'Fentanyl CRI', 'FLK CRI'].includes(d));
        if (hasButorph && hasFullMu) {
          warnings.push('진통제 길항 주의: Butorphanol과 Full μ-오피오이드(Fentanyl / CRI)를 동시 사용하면 진통 효과가 상쇄됩니다.');
          penalty += 10;
        }
        if (c.species === 'cat' && analg.includes('FLK CRI')) {
          warnings.push('고양이 금기: FLK CRI는 Lidocaine 심혈관 독성으로 개 전용이며 고양이에서는 사용하지 않습니다.');
          penalty += 15;
        }
        if (analg.some((d) => /CRI/.test(d)) && !(c.species === 'cat' && analg.includes('FLK CRI'))) {
          synergies.push('진통수액 CRI 적용: 일정한 혈중 진통 농도 유지로 MAC 절감 및 수술 중 저혈압을 줄입니다.');
        }
        if (sed.length === 1 && hasFullMu && !hasButorph) {
          synergies.push('진정제 + Full μ-진통제 조합: 균형 마취 및 흡입마취제 MAC 절감 시너지가 우수합니다.');
        }

        // 기타 주사제 + 진정제 상호작용
        if (sed.includes('α2-agonist') && inj.includes('Anticholinergics')) {
          warnings.push('병용 금기 주의: α2-agonist 유발 서맥에는 Anticholinergics 루틴 병용을 피합니다(심한 고혈압·심근 산소요구량 증가).');
          penalty += 8;
        }

        // 환자 중증도·기저질환별 안전성
        const isCritical = c.trueAsa >= 4 || c.pe.bpMap < 70;
        const isHeart = /MMVD|HCM|심잡음|심비대/i.test((c.pe.auscHeart || '') + ' ' + (c.ownerClue || ''));
        if (isCritical && sed.includes('Acepromazine')) {
          warnings.push('중증·저혈압 금기: ASA IV~V 또는 저혈압 환자에서 Acepromazine은 역전 불가능한 저혈압을 악화시킵니다.');
          penalty += 15;
        }
        if ((isCritical || isHeart) && sed.includes('α2-agonist')) {
          warnings.push('심질환·중증 주의: α2-agonist는 심박출량 감소와 혈관수축 부담이 커 심질환·중증 환자에서 피합니다.');
          penalty += 12;
        }
        if (ind === 'Etomidate' && !sed.length && !analg.length) {
          warnings.push('Etomidate 단독 주의: 구역·근간대경련 예방을 위해 반드시 진정 전처치와 병용해야 합니다.');
          penalty += 6;
        }
        if (isCritical && (ind === 'Etomidate' || ind === 'Alfaxalone')) {
          synergies.push('혈역학적 안정 유도제 선택: 중증 환자에서 유도 시 혈압 저하를 최소화합니다.');
        }
        if (currentLabPanel && currentLabPanel.vbgM && currentLabPanel.vbgM.K >= 5.5 && fluid.length && !fluid.includes('0.9% NS')) {
          warnings.push('고칼륨혈증 수액 주의: 고칼륨혈증 환자에서는 칼륨이 없는 0.9% NS가 우선 권장됩니다.');
          penalty += 8;
        }
        if (fluid.includes('LRS(H/S)') && fluid.includes('수혈')) {
          warnings.push('수혈 라인 주의: LRS(H/S)는 칼슘을 포함하므로 수혈 라인과 동시 주입을 피해야 합니다(Plasmalyte 또는 0.9% NS 권장).');
          penalty += 6;
        }

        return { stab, abx, inj, sed, analg, ind, maint, fluid, warnings, synergies, penalty };
      }

      /* Render Box 2: 2. 처치 계획 (5 consolidated rows) */
      function renderPlanSummary() {
        if (!currentCase) return;
        const ev = evaluatePlan(currentCase);
        const fmt = (arr) => (arr && arr.length ? escapeHtml(arr.join(', ')) : '<span class="muted">미선택</span>');
        const allInjectables = [...ev.abx, ...ev.inj, ...ev.sed, ...ev.analg];
        planBodyEl.innerHTML = `
          <div class="sig-hx-list">
            <div class="sig-hx-row"><span class="sig-hx-k">대기 중 안정화:</span><span>${fmt(ev.stab)}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">주사제:</span><span>${fmt(allInjectables)}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">유도제:</span><span>${ev.ind ? escapeHtml(ev.ind) : '<span class="muted">미선택</span>'}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">유지제:</span><span>${ev.maint ? escapeHtml(ev.maint) : '<span class="muted">미선택</span>'}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">수액:</span><span>${fmt(ev.fluid)}</span></div>
          </div>
        `;
      }

      // Single-select categories (안정화, 유도제, 유지제, 수액)
      document.querySelectorAll('[data-single-cat]').forEach((b) => {
        b.addEventListener('click', () => {
          if (evaluated) return;
          const cat = b.dataset.singleCat;
          const val = b.dataset.val;
          planState[cat] = planState[cat] === val ? null : val;
          document.querySelectorAll(`[data-single-cat="${cat}"]`).forEach((el) => {
            el.classList.toggle('active', el.dataset.val === planState[cat]);
          });
          Settings.playTone(540, 0.04, 0.025);
          renderPlanSummary();
        });
      });

      // Multi-select categories (항생제, 기타 주사제, 진정제, 진통제/진통수액)
      document.querySelectorAll('[data-multi-cat]').forEach((b) => {
        b.addEventListener('click', () => {
          if (evaluated) return;
          const cat = b.dataset.multiCat;
          const val = b.dataset.val;
          const set = planState[cat];
          if (!set) return;
          if (set.has(val)) set.delete(val); else set.add(val);
          b.classList.toggle('active', set.has(val));
          Settings.playTone(540, 0.04, 0.025);
          renderPlanSummary();
        });
      });

      /* Render Box 3: 3. 보호자 안내 (5 items) */
      function renderConsentList() {
        consentListEl.innerHTML = CONSENT_ITEMS.map((item) => {
          const done = revealedConsents.has(item.key);
          return `<div class="sig-hx-row"><span class="sig-hx-k">${item.label}:</span><span class="sig-hx-v" style="${done ? 'font-weight:600;' : 'color:var(--muted);'}">${done ? '안내 완료' : '미안내'}</span></div>`;
        }).join('');
      }

      function setControlsLocked(locked) {
        const flag = Boolean(locked);
        chatInputEl.disabled = flag;
        chatSendBtn.disabled = flag;
        chatInputEl.placeholder = flag ? '평가가 완료되어 안내가 종료되었습니다' : '안내사항을 입력하세요.';
        document.querySelectorAll('[data-single-cat], [data-multi-cat]').forEach((b) => { b.disabled = flag; });
      }

      function moodPenalty(mood, aborted) {
        if (aborted || mood <= 0) return 100;
        if (mood >= 70) return 0;
        if (mood >= 60) return 5;
        if (mood >= 50) return 7;
        if (mood >= 40) return 9;
        if (mood >= 30) return 11;
        return 15;
      }

      function openFailModal(score, grade) {
        failTitleEl.textContent = '진료 중단';
        failDescEl.textContent = `${score}점 · ${grade} 등급`;
        failModalEl.classList.remove('hidden');
        Settings.playTone(220, 0.16, 0.05);
      }

      function buildWrongNoteHtml(rep) {
        const ev = rep.ev;
        const trustPen = Number(rep.trustPen || 0);
        const trustText = rep.ownerAborted
          ? `<span style="color:#b91c1c; font-weight:600;">보호자 진료 중단 (-100점)</span>`
          : trustPen > 0
            ? `<span style="color:#b91c1c; font-weight:600;">보호자 기분 악화 (-${trustPen}점)</span>`
            : '없음 (양호)';
        return `
          <div class="b-card-soft" style="padding:12px; display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-family:var(--font-display); font-size:15px;">마취 계획 평가</strong>
              <strong style="font-family:var(--font-display); font-size:17px; color:#dc2626;">${rep.score}점 (${rep.grade})</strong>
            </div>
            <div class="modal-row"><span class="muted">대기 중 안정화</span><strong>${ev.stab.join(', ') || '미선택'}</strong></div>
            <div class="modal-row"><span class="muted">주사제</span><strong>${[...ev.abx, ...ev.inj, ...ev.sed, ...ev.analg].join(', ') || '미선택'}</strong></div>
            <div class="modal-row"><span class="muted">유도제 / 유지제</span><strong>${ev.ind || '미선택'} / ${ev.maint || '미선택'}</strong></div>
            <div class="modal-row"><span class="muted">수액</span><strong>${ev.fluid.join(', ') || '미선택'}</strong></div>
            <div class="modal-row"><span class="muted">보호자 안내</span><strong>${revealedConsents.size} / ${CONSENT_ITEMS.length} 완료</strong></div>
            <div class="modal-row"><span class="muted">신뢰 붕괴</span><span>${trustText}</span></div>
          </div>
          <div class="b-card" style="padding:12px; margin-top:8px; line-height:1.55;">
            <div class="b-label"><span>오답노트</span></div>
            ${rep.ownerAborted ? '<p style="color:#b91c1c;">• 보호자와의 신뢰가 붕괴되어 진료가 즉시 중단되었습니다.</p>' : ''}
            ${ev.warnings.length ? ev.warnings.map((w) => `<p style="color:#b91c1c;">• ${escapeHtml(w)}</p>`).join('') : (!rep.ownerAborted ? '<p>• 약물 금기 및 누락 없이 안전한 마취 계획을 구성했습니다.</p>' : '')}
            ${ev.synergies.map((s) => `<p style="margin-top:4px;">• ${escapeHtml(s)}</p>`).join('')}
          </div>
        `;
      }

      function triggerImmediateTrustFailure() {
        if (!currentCase || evaluated) return;
        evaluated = true;
        setControlsLocked(true);
        ownerAborted = true;
        ownerMood = 0;

        const ev = evaluatePlan(currentCase);
        lastReport = {
          caseObj: currentCase,
          ev,
          score: 0,
          grade: 'F',
          missedConsents: CONSENT_ITEMS.length - revealedConsents.size,
          trustPen: 100,
          ownerAborted: true
        };
        aiText = null;
        soapText = null;
        rvWrongEl.innerHTML = buildWrongNoteHtml(lastReport);

        evalSubmitBtn.textContent = '해설 보기';
        evalSubmitBtn.disabled = false;

        if (currentStageId !== 'tutorial') {
          Settings.saveStageResult(2, currentStageId, { grade: 'F', score: 0 });
        }
        if (chapterCtrl) chapterCtrl.refreshStages();

        openFailModal(0, 'F');
      }

      // 실패 팝업 버튼 (배경 클릭/ESC로 닫히지 않음; 해설 닫기 시에도 실패 팝업 유지)
      document.getElementById('ch2-fail-review').addEventListener('click', () => {
        Settings.playTone(540, 0.05, 0.03);
        setReviewTab('wrong');
        reviewModalEl.classList.remove('hidden');
      });
      document.getElementById('ch2-fail-restart').addEventListener('click', () => {
        Settings.playTone(520, 0.05, 0.03);
        reviewModalEl.classList.add('hidden');
        failModalEl.classList.add('hidden');
        loadStage(currentStageId, { preserveCase: true });
      });
      document.getElementById('ch2-fail-main').addEventListener('click', () => {
        Settings.playTone(480, 0.05, 0.03);
        reviewModalEl.classList.add('hidden');
        failModalEl.classList.add('hidden');
        Settings.navigateTo('index.html', { push: true });
      });

      function revealConsents(vetText) {
        const low = String(vetText || '').toLowerCase();
        const hits = [];
        CONSENT_ITEMS.forEach((item) => {
          if (!revealedConsents.has(item.key) && item.test(low, currentCase)) {
            revealedConsents.add(item.key);
            hits.push(item);
          }
        });
        if (!hits.length) return [];
        setMonCollapsed('ch2-sec-consent', false);
        renderConsentList();
        Settings.playTone(640, 0.05, 0.025);
        return hits;
      }

      function appendBubble(sender, text, blueHighlight = false) {
        const row = document.createElement('div');
        row.className = `chat-row ${sender}`;
        const b = document.createElement('div');
        b.className = 'chat-bubble';
        b.innerHTML = blueHighlight ? `<span class="chat-sig-blue">${escapeHtml(text)}</span>` : escapeHtml(text);
        row.appendChild(b);
        chatLogEl.appendChild(row);
        chatLogEl.scrollTop = chatLogEl.scrollHeight;
      }

      chatFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (evaluated || chatBusy || !currentCase) return;
        const msg = chatInputEl.value.trim();
        if (!msg) return;
        chatInputEl.value = '';
        const newHits = revealConsents(msg);
        appendBubble('vet', msg, newHits.length > 0);
        chatHistory.push({ sender: 'vet', text: msg });
        chatBusy = true;
        chatSendBtn.disabled = true;

        const isProfane = /씨발|시발|병신|미친|개새|지랄|꺼져|닥쳐|죽어|좆|fuck|shit|bitch|새끼|멍청이|쓰레기|무식|짜증나게/i.test(msg);
        const isRudeOrDismissive = /^(네|응|음|ㅋㅋ+|ㅎㅎ+|몰라|몰라요|알아서|귀찮|시끄|대충|아몰랑|글쎄|뭐래)[\s.?!]*$/i.test(msg) || /귀찮|대충|알아서\s*하|상관없|됐어요|그만\s*물어|입\s*닫/.test(msg);
        const prevVetMsgs = chatHistory.filter((m) => m.sender === 'vet').slice(0, -1).map((m) => m.text.trim());
        const isRepeated = prevVetMsgs.includes(msg);

        let reply = '';
        let aiAborted = false;

        if (isProfane) {
          aiAborted = true;
          reply = '지금 보호자에게 무슨 막말을 하시는 거예요? 이런 병원에 우리 아이 절대 못 맡깁니다. 당장 나갈게요!';
        } else {
          try {
            const resp = await fetch('/api/ai', {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
              body: JSON.stringify({
                task: 'roleplay',
                role: 'owner_preop',
                species: currentCase.species === 'cat' ? '고양이' : '개',
                caseName: `${currentCase.name} (${currentCase.breed})`,
                asa: `ASA ${currentCase.trueAsa}${currentCase.trueEmergency ? '-E' : ''}`,
                caseDesc: `${currentCase.chiefComplaint} | 마취 계획: 안정화(${Array.from(planState.stab).join(',') || '미선택'}), 항생제(${Array.from(planState.abx).join(',')}), 기타주사제(${Array.from(planState.inj).join(',')}), 진정제(${Array.from(planState.sed).join(',')}), 진통제(${Array.from(planState.analg).join(',')}), 유도제(${planState.ind || '미선택'}), 유지제(${planState.maint || '미선택'}), 수액(${Array.from(planState.fluid).join(',') || '미선택'})`,
                clue: currentCase.ownerClue || '',
                ownerPersonality: currentCase.ownerPersonality || 'neutral',
                knowledgeLevel: currentCase.ownerLevel || 2,
                chatHistory: chatHistory.slice(-10),
                question: msg
              })
            });
            if (resp.ok) {
              const d = await resp.json();
              if (d && d.text) reply = String(d.text).trim();
            }
          } catch {}

          if (!reply) {
            if (isRudeOrDismissive) {
              reply = '선생님, 지금 너무 성의 없게 설명하시는 거 아니에요? 아이 맡기기 불안해지네요.';
            } else {
              const missing = CONSENT_ITEMS.filter((it) => !revealedConsents.has(it.key));
              if (!missing.length) {
                reply = '마취 계획부터 수술 시간, 연락, 입원 안내까지 꼼꼼하게 설명해 주셔서 감사합니다 선생님. 동의하겠습니다. 잘 부탁드려요.';
              } else {
                reply = `네 선생님, 설명 감사합니다. 혹시 ${missing[0].label} 부분도 안내해 주실 수 있을까요?`;
              }
            }
          }
          if (/^\[ABORT\]/i.test(reply)) aiAborted = true;
        }

        const clean = reply.replace(/^\[ABORT\]\s*/i, '');
        appendBubble('owner', clean, false);
        chatHistory.push({ sender: 'owner', text: clean });

        if (aiAborted) {
          ownerAborted = true;
          ownerMood = 0;
        } else {
          if (isRudeOrDismissive) ownerMood -= 22;
          else if (isRepeated) ownerMood -= 12;
          else if (/짜증|불안해지|불신|성의\s*없|무례|답답|기분\s*나쁘|못\s*믿|나가겠/i.test(clean)) ownerMood -= 15;
          else if (newHits.length > 0) ownerMood += 4;
          ownerMood = Math.max(0, Math.min(100, ownerMood));
        }

        chatBusy = false;
        if (ownerAborted || ownerMood <= 0) {
          triggerImmediateTrustFailure();
          return;
        }
        if (!evaluated) {
          chatSendBtn.disabled = false;
          chatInputEl.focus();
        }
      });

      /* Review Modal (오답노트 / AI 로그 분석 / SOAP 분석) */
      function setReviewTab(k) {
        document.querySelectorAll('[data-rv-tab]').forEach((b) => b.classList.toggle('active', b.dataset.rvTab === k));
        document.querySelectorAll('[data-rv-pane]').forEach((p) => p.classList.toggle('pane-hidden', p.dataset.rvPane !== k));
        if (k === 'ai' && !aiText) runAiDebrief();
        if (k === 'soap' && !soapText) runSoap();
      }
      document.querySelectorAll('[data-rv-tab]').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); setReviewTab(b.dataset.rvTab); }));
      document.getElementById('ch2-review-close').addEventListener('click', () => reviewModalEl.classList.add('hidden'));
      reviewModalEl.addEventListener('click', (e) => { if (e.target === reviewModalEl) reviewModalEl.classList.add('hidden'); });

      function buildAiPayload(task) {
        const c = lastReport.caseObj;
        const ev = lastReport.ev;
        return {
          task,
          phase: 'chapter2',
          chapterLabel: 'Chapter 2 마취 계획',
          species: c.species === 'cat' ? '고양이' : '개',
          scenario: `${c.name} (${c.breed}, ${c.age}, ${c.weight}kg, ${c.sex}) - ${c.chiefComplaint}`,
          chatSummary: chatHistory.map((m) => `${m.sender === 'vet' ? '수의사' : '보호자'}: ${m.text}`).slice(-8).join(' | '),
          examSummary: `안정화: ${ev.stab.join(',') || '없음'} / 항생제: ${ev.abx.join(',') || '없음'} / 기타주사제: ${ev.inj.join(',') || '없음'} / 진정제: ${ev.sed.join(',') || '없음'} / 진통제: ${ev.analg.join(',') || '없음'} / 유도제: ${ev.ind || '없음'} / 유지제: ${ev.maint || '없음'} / 수액: ${ev.fluid.join(',') || '없음'} / 신뢰 붕괴 감점: -${lastReport.trustPen || 0}점`,
          studentEval: `점수 ${lastReport.score}점 (${lastReport.grade}), 보호자 안내 ${revealedConsents.size}/${CONSENT_ITEMS.length}`,
          trueEval: `ASA ${c.trueAsa}${c.trueEmergency ? 'E' : ''} (${c.truePrognosis}) 맞춤 안전 프로토콜`
        };
      }

      async function runAiDebrief() {
        rvAiEl.innerHTML = '<div class="b-card-soft" style="padding:14px; text-align:center;">AI 로그 분석 중...</div>';
        let t = '';
        try {
          const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(buildAiPayload('debrief')) });
          if (r.ok) { const d = await r.json(); t = (d.analysis || d.text || '').trim(); }
        } catch {}
        if (!t) {
          const ev = lastReport.ev;
          const allInj = [...ev.abx, ...ev.inj, ...ev.sed, ...ev.analg];
          t = `1) 선택한 마취 계획: 안정화(${ev.stab.join(', ') || '미선택'}), 주사제(${allInj.join(', ') || '미선택'}), 유도제(${ev.ind || '미선택'}), 유지제(${ev.maint || '미선택'}), 수액(${ev.fluid.join(', ') || '미선택'}).\n2) 주의·개선 포인트: ${ev.warnings.length ? ev.warnings.join(' / ') : '약물 중복·금기 없이 균형 잡힌 계획입니다.'}\n3) 보호자 안내: ${revealedConsents.size}/${CONSENT_ITEMS.length} 항목 완료.`;
        }
        aiText = t;
        rvAiEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(t)}</div>`;
      }

      async function runSoap() {
        rvSoapEl.innerHTML = '<div class="b-card-soft" style="padding:14px; text-align:center;">AI SOAP 분석 생성 중...</div>';
        let t = '';
        try {
          const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(buildAiPayload('soap_record')) });
          if (r.ok) { const d = await r.json(); t = (d.text || d.analysis || '').trim(); }
        } catch {}
        if (!t) {
          const c = lastReport.caseObj;
          const ev = lastReport.ev;
          const allInj = [...ev.abx, ...ev.inj, ...ev.sed, ...ev.analg];
          t = `S: ${c.name} (${c.breed}, ${c.age}, ${c.weight}kg, ${c.sex}) — ${c.chiefComplaint}\nO: ASA ${c.trueAsa}${c.trueEmergency ? 'E' : ''} (${c.truePrognosis}), 청진 ${c.pe.auscHeart}\nA: 마취 전 위험 평가 및 맞춤 약물 계획 수립 (${lastReport.score}점, ${lastReport.grade})\nP: 안정화(${ev.stab.join(', ') || '-'}), 주사제(${allInj.join(', ') || '-'}), 유도(${ev.ind || '-'}), 유지(${ev.maint || '-'}), 수액(${ev.fluid.join(', ') || '-'})`;
        }
        soapText = t;
        rvSoapEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(t)}</div>`;
      }

      function scoreToGrade(s) {
        return s >= 95 ? 'S' : s >= 90 ? 'A' : s >= 80 ? 'B' : s >= 70 ? 'C' : s >= 50 ? 'D' : 'F';
      }

      evalSubmitBtn.addEventListener('click', () => {
        if (!currentCase) return;
        if (evaluated) {
          Settings.playTone(540, 0.05, 0.03);
          setReviewTab('wrong');
          reviewModalEl.classList.remove('hidden');
          return;
        }
        evaluated = true;
        setControlsLocked(true);
        const ev = evaluatePlan(currentCase);
        const missedConsents = CONSENT_ITEMS.length - revealedConsents.size;
        const trustPen = moodPenalty(ownerMood, ownerAborted);
        const score = Math.max(0, Math.min(100, 100 - ev.penalty - missedConsents * 4 - trustPen));
        const grade = scoreToGrade(score);

        lastReport = { caseObj: currentCase, ev, score, grade, missedConsents, trustPen, ownerAborted };
        aiText = null;
        soapText = null;

        rvWrongEl.innerHTML = buildWrongNoteHtml(lastReport);

        evalSubmitBtn.textContent = '해설 보기';
        stampAsaEl.textContent = `ASA ${currentCase.trueAsa}${currentCase.trueEmergency ? 'E' : ''}`;
        stampProgEl.textContent = 'PLAN OK';
        stampGradeEl.textContent = currentStageId === 'tutorial' ? '완료' : grade;
        stampOverlayEl.classList.remove('hidden');

        Settings.saveStageResult(2, currentStageId, { grade, score });
        if (chapterCtrl) chapterCtrl.refreshStages();

        if (currentStageId !== 'tutorial' && grade === 'F') {
          openFailModal(score, grade);
        } else {
          Settings.playTone(760, 0.12, 0.05);
          Settings.triggerStageGlow();
        }
      });

      async function loadStage(stageId, opts = {}) {
        clearTimers();
        const prevCase = currentCase;
        currentStageId = stageId;
        planState = {
          stab: new Set(),
          abx: new Set(),
          inj: new Set(),
          sed: new Set(),
          analg: new Set(),
          ind: null,
          maint: null,
          fluid: new Set()
        };
        revealedConsents = new Set();
        chatHistory = [];
        chatBusy = false;
        evaluated = false;
        ownerMood = 85;
        ownerAborted = false;
        lastReport = null;
        aiText = null;
        soapText = null;

        setControlsLocked(false);
        failModalEl.classList.add('hidden');
        catHelpModalEl.classList.add('hidden');
        detailModalEl.classList.add('hidden');
        reviewModalEl.classList.add('hidden');
        stampOverlayEl.classList.add('hidden');
        evalSubmitBtn.textContent = '계획 확정';
        document.querySelectorAll('[data-single-cat], [data-multi-cat]').forEach((b) => b.classList.remove('active'));
        ['ch2-sec-preop', 'ch2-sec-plan', 'ch2-sec-consent'].forEach((id) => setMonCollapsed(id, false));
        renderConsentList();
        chatLogEl.innerHTML = '';
        activateTab('premed');

        if (stageId === 'practice_dog' || stageId === 'practice_cat') {
          if (opts && opts.preserveCase && prevCase) {
            currentCase = prevCase;
          } else {
            sigHeadEl.innerHTML = '<span>환자 생성 중...</span>';
            ccLineEl.innerHTML = '';
            currentCase = await Data.generatePracticeCase(stageId === 'practice_cat' ? 'cat' : 'dog');
          }
        } else {
          currentCase = Data.getFixedCase(stageId);
        }

        sigHeadEl.innerHTML = `<span>${escapeHtml(currentCase.name)}</span><span class="ch1-sig-meta">${escapeHtml(currentCase.breed)} · ${escapeHtml(currentCase.age)} · ${currentCase.weight} kg · ${escapeHtml(currentCase.sex)} · ASA ${currentCase.trueAsa}${currentCase.trueEmergency ? 'E' : ''} (${escapeHtml(currentCase.truePrognosis)})</span>`;
        ccLineEl.innerHTML = `<strong>주호소:</strong> ${escapeHtml(currentCase.chiefComplaint)}`;

        currentLabPanel = Data.buildLabPanel(currentCase);
        renderPreopSummary(currentCase, currentLabPanel);
        renderFullPreopDetail(currentCase, currentLabPanel);
        renderPlanSummary();

        const greet = `선생님, ${currentCase.name} 마취 계획이랑 수술 예정·소요 시간, 연락 및 입원 안내 부탁드려요.`;
        appendBubble('owner', greet, false);
        chatHistory.push({ sender: 'owner', text: greet });
      }

      const chapterCtrl = Settings.initChapterCommon({
        chapterNum: 2,
        chapterTitle: '마취 계획',
        initialStageId: 'tutorial',
        helpSlides: [
          { mark: '1', label: '마취 전 검사 결과 확인', desc: '좌측 모니터링창에서 신체검사·혈액 이상 수치·영상 핵심 소견을 확인하고, 상세 버튼으로 전체 검사 결과를 열람합니다.' },
          { mark: '2', label: '전처치 · 유도·유지제 선택', desc: '환자 상태에 맞춰 전처치(안정화·항생제·기타 주사제·진정제·진통제)와 유도제·유지제·수액을 선택합니다.' },
          { mark: '3', label: '보호자 안내 및 계획 확정', desc: '마취 계획, 수술 예정·소요 시간, 수술 전후 연락, 입원 안내를 마친 뒤 계획을 확정합니다.' }
