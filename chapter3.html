<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chapter 3. 마취 도입 — 베타 1.1</title>
  <link rel="stylesheet" href="beta11.css" />
  <script src="beta11-settings.js"></script>
  <script src="beta11-ch1-data.js"></script>
</head>
<body>
  <div class="app-shell chapter-shell">
    <header class="top-bar">
      <div class="top-left">
        <div class="top-title">Chapter 3. 마취 도입</div>
      </div>
      <div id="chapter-top-actions" class="top-actions"></div>
    </header>

    <main class="ch1-page-body">
      <div class="ch1-split" id="ch3-split">
        <!-- 좌측(데스크탑) / 상단(모바일): 모니터링창 -->
        <section class="ch1-monitor" id="ch3-monitor" aria-label="도입 모니터링창">
          <div class="ch1-sig-pinned">
            <div class="ch1-sig-head" id="ch3-sig-head"></div>
            <div class="ch1-cc-line" id="ch3-status-line"></div>
          </div>

          <div class="ch1-monitor-scroll" id="ch3-monitor-scroll" style="cursor:grab;">
            <div class="mon-sec" id="ch3-sec-vitals">
              <div class="mon-sec-title">
                <span>1. 생체 모니터링</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch3-sec-vitals">접기</button>
              </div>
              <div class="mon-sec-body">
                <div class="monitor-mock" style="padding:10px;">
                  <div class="monitor-row" style="grid-template-columns:repeat(3,1fr);">
                    <div class="m-cell"><span class="mk">HR</span><span class="mv" id="ch3-v-hr">--</span></div>
                    <div class="m-cell"><span class="mk">RR</span><span class="mv" id="ch3-v-rr">--</span></div>
                    <div class="m-cell"><span class="mk">SpO₂</span><span class="mv" id="ch3-v-spo2">--%</span></div>
                  </div>
                  <div class="monitor-row" style="grid-template-columns:repeat(3,1fr);">
                    <div class="m-cell"><span class="mk">SBP/MAP/DBP</span><span class="mv" id="ch3-v-bp" style="font-size:12.5px;">--/--/--</span></div>
                    <div class="m-cell">
                      <span class="mk">ETCO₂</span>
                      <span class="mv" id="ch3-v-etco2" style="font-size:13px;">--</span>
                      <span id="ch3-v-etco2-wave" style="font-size:10.5px; color:#cbd5e1; margin-top:2px;">파형 없음</span>
                    </div>
                    <div class="m-cell"><span class="mk">마취 심도</span><span class="mv" id="ch3-v-depth" style="font-size:12.5px;">각성</span></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="mon-sec" id="ch3-sec-chk">
              <div class="mon-sec-title">
                <span>2. 도입 체크리스트</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch3-sec-chk">접기</button>
              </div>
              <div class="mon-sec-body" id="ch3-chk-body"></div>
            </div>

            <div class="mon-sec" id="ch3-sec-log">
              <div class="mon-sec-title">
                <span>3. 처치 로그</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch3-sec-log">접기</button>
              </div>
              <div class="mon-sec-body">
                <div class="sig-hx-list" id="ch3-log-list"><div class="mon-empty">도입 대기 중</div></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 우측(데스크탑) / 하단(모바일): 조작창 -->
        <section class="ch1-control" id="ch3-control" aria-label="마취 도입 조작창">
          <div class="ch1-ctrl-handle" id="ch3-ctrl-handle" role="button" tabindex="0" aria-label="조작창 접기 및 펼치기">
            <div class="ch1-ctrl-handle-bar"></div>
          </div>

          <div class="ch1-ctrl-tabs" role="tablist">
            <button type="button" class="b-btn ch1-tab-btn active" data-pane="premed">전처치</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="induct">도입 · 삽관</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="trans">유지 전환</button>
          </div>

          <div class="ch1-ctrl-body">
            <!-- 1. 전처치 -->
            <div class="ch1-pane" data-content="premed">
              <div>
                <div class="eval-sec-lbl">전처치 약물 선택</div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-p3="Midazolam">Midazolam</button>
                  <button type="button" class="b-btn prog-btn" data-p3="Dexmedetomidine">Dexmedetomidine</button>
                  <button type="button" class="b-btn prog-btn" data-p3="Methadone">Methadone</button>
                  <button type="button" class="b-btn prog-btn" data-p3="Butorphanol">Butorphanol</button>
                </div>
              </div>
              <div class="exam-btn-list">
                <button type="button" class="b-btn exam-main-btn" id="ch3-btn-apply-premed">전처치 일괄 투여</button>
                <button type="button" class="b-btn exam-main-btn" id="ch3-btn-preo2">전산소화 (Pre-O₂ 3분)</button>
              </div>
            </div>

            <!-- 2. 도입 · 삽관 -->
            <div class="ch1-pane pane-hidden" data-content="induct">
              <div>
                <div class="eval-sec-lbl">유도제 선택 및 적정</div>
                <div class="prog-grid" style="margin-bottom:8px;">
                  <button type="button" class="b-btn prog-btn" data-i3="Propofol">Propofol</button>
                  <button type="button" class="b-btn prog-btn" data-i3="Alfaxalone">Alfaxalone</button>
                  <button type="button" class="b-btn prog-btn" data-i3="Etomidate">Etomidate</button>
                  <button type="button" class="b-btn prog-btn" data-i3="Ketamine+Midazolam">Ketamine+Midazolam</button>
                </div>
                <button type="button" class="b-btn exam-main-btn" id="ch3-btn-titrate">1/4 용량 적정 투여 (0/4)</button>
              </div>

              <div>
                <div class="eval-sec-lbl">기관튜브 (ETT) 규격 및 삽관</div>
                <div class="asa-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:8px;">
                  <button type="button" class="b-btn asa-btn" data-ett="3.5">3.5</button>
                  <button type="button" class="b-btn asa-btn" data-ett="4.5">4.5</button>
                  <button type="button" class="b-btn asa-btn" data-ett="6.0">6.0</button>
                  <button type="button" class="b-btn asa-btn" data-ett="9.0">9.0</button>
                </div>
                <button type="button" class="b-btn exam-main-btn" id="ch3-btn-intubate">기관삽관 및 커프 팽창</button>
              </div>
            </div>

            <!-- 3. 유지 전환 -->
            <div class="ch1-pane pane-hidden" data-content="trans">
              <div class="exam-btn-list">
                <button type="button" class="b-btn exam-main-btn" data-tr="o2">O₂ 유량 설정 및 호흡회로 연결</button>
                <button type="button" class="b-btn exam-main-btn" data-tr="iso">기화기 (Isoflurane) 개방</button>
                <button type="button" class="b-btn exam-main-btn" data-tr="apl">APL 밸브 완전 개방 확인</button>
                <button type="button" class="b-btn exam-main-btn" data-tr="mon">다중 생체 모니터 부착 완료</button>
              </div>
              <div style="margin-top:auto; padding-top:6px;">
                <button type="button" class="b-btn" id="ch3-eval-submit" style="width:100%; height:44px; border-radius:14px;">도입 완료</button>
              </div>
            </div>

            <!-- 50% 투명도 빨간 사각형 도장 -->
            <div id="ch3-stamp-overlay" class="ch1-stamp-overlay hidden" aria-live="polite">
              <div class="ch1-stamp-asa" id="ch3-stamp-asa"></div>
              <div class="ch1-stamp-prog" id="ch3-stamp-prog"></div>
              <div class="ch1-stamp-grade" id="ch3-stamp-grade"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 해설 보기 팝업 -->
  <div id="ch3-review-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" style="backdrop-filter:blur(6px);">
    <div class="modal-card" style="max-width:420px; max-height:84dvh; display:flex; flex-direction:column;">
      <h2 class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">해설 보기</h2>
      <div class="step-tabs" role="tablist" style="margin-bottom:10px; flex-shrink:0;">
        <button type="button" class="step-tab active" data-rv-tab="wrong">오답노트</button>
        <button type="button" class="step-tab" data-rv-tab="ai">AI 로그 분석</button>
        <button type="button" class="step-tab" data-rv-tab="soap">SOAP 분석</button>
      </div>
      <div style="flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:180px;">
        <div id="ch3-rv-wrong" data-rv-pane="wrong"></div>
        <div id="ch3-rv-ai" data-rv-pane="ai" class="pane-hidden"></div>
        <div id="ch3-rv-soap" data-rv-pane="soap" class="pane-hidden"></div>
      </div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch3-review-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const Data = window.Beta11Ch1Data;
      const Settings = window.Beta11Settings;
      if (!Data || !Settings) return;

      const splitEl = document.getElementById('ch3-split');
      const sigHeadEl = document.getElementById('ch3-sig-head');
      const statusLineEl = document.getElementById('ch3-status-line');
      const chkBodyEl = document.getElementById('ch3-chk-body');
      const logListEl = document.getElementById('ch3-log-list');
      const ctrlHandleEl = document.getElementById('ch3-ctrl-handle');
      const btnPremed = document.getElementById('ch3-btn-apply-premed');
      const btnPreO2 = document.getElementById('ch3-btn-preo2');
      const btnTitrate = document.getElementById('ch3-btn-titrate');
      const btnIntubate = document.getElementById('ch3-btn-intubate');
      const evalSubmitBtn = document.getElementById('ch3-eval-submit');
      const stampOverlayEl = document.getElementById('ch3-stamp-overlay');
      const reviewModalEl = document.getElementById('ch3-review-modal');
      const rvWrongEl = document.getElementById('ch3-rv-wrong');
      const rvAiEl = document.getElementById('ch3-rv-ai');
      const rvSoapEl = document.getElementById('ch3-rv-soap');

      let currentStageId = 'tutorial';
      let currentCase = null;
      let vitals = { hr: 110, rr: 24, spo2: 96, sbp: 122, map: 91, dbp: 76, etco2: null, etco2Wave: '파형 없음', depth: '각성' };
      let premedPicks = new Set();
      let indPick = null;
      let ettPick = null;
      let state = { premedDone: false, preO2Done: false, titrateCount: 0, intubated: false, trans: new Set(), mistakes: [] };
      let logs = [];
      let evaluated = false;
      let lastReport = null;
      let aiText = null;
      let soapText = null;

      window.__b11Cleanup = null;
      function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

      /* Monitoring Window Drag-to-Scroll */
      const monitorScrollEl = document.getElementById('ch3-monitor-scroll');
      let monDrag = false, monStartY = 0, monStartScroll = 0;
      monitorScrollEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'mouse') return;
        if (e.target.closest('button, a, input, select, textarea')) return;
        monDrag = true;
        monStartY = e.clientY;
        monStartScroll = monitorScrollEl.scrollTop;
        monitorScrollEl.style.cursor = 'grabbing';
        monitorScrollEl.style.userSelect = 'none';
      });
      window.addEventListener('pointermove', (e) => {
        if (!monDrag) return;
        monitorScrollEl.scrollTop = monStartScroll - (e.clientY - monStartY);
      });
      const endMonDrag = () => {
        if (!monDrag) return;
        monDrag = false;
        monitorScrollEl.style.cursor = 'grab';
        monitorScrollEl.style.userSelect = '';
      };
      window.addEventListener('pointerup', endMonDrag);
      window.addEventListener('pointercancel', endMonDrag);

      function setMonCollapsed(id, c) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.classList.toggle('is-collapsed', Boolean(c));
        const b = sec.querySelector('.mon-toggle-btn');
        if (b) b.textContent = c ? '열기' : '접기';
      }
      document.querySelectorAll('[data-mon-toggle]').forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const sec = document.getElementById(b.dataset.monToggle);
        if (!sec) return;
        Settings.playTone(500, 0.04, 0.025);
        setMonCollapsed(b.dataset.monToggle, !sec.classList.contains('is-collapsed'));
      }));

      function setCollapsed(c) {
        if (window.innerWidth >= 960) { splitEl.classList.remove('ctrl-collapsed'); return; }
        splitEl.classList.toggle('ctrl-collapsed', Boolean(c));
      }
      let hY = 0, hDrag = false, hMoved = false;
      ctrlHandleEl.addEventListener('pointerdown', (e) => { if (window.innerWidth >= 960) return; hDrag = true; hMoved = false; hY = e.clientY; if (ctrlHandleEl.setPointerCapture) ctrlHandleEl.setPointerCapture(e.pointerId); });
      ctrlHandleEl.addEventListener('pointermove', (e) => { if (!hDrag) return; const dy = e.clientY - hY; if (Math.abs(dy) > 20) { hMoved = true; setCollapsed(dy > 0); } });
      const endH = () => { if (!hDrag) return; hDrag = false; if (!hMoved) setCollapsed(!splitEl.classList.contains('ctrl-collapsed')); };
      ctrlHandleEl.addEventListener('pointerup', endH);
      ctrlHandleEl.addEventListener('pointercancel', endH);
      window.addEventListener('resize', () => { if (window.innerWidth >= 960) splitEl.classList.remove('ctrl-collapsed'); });

      function activateTab(p) {
        setCollapsed(false);
        document.querySelectorAll('.ch1-tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.pane === p));
        document.querySelectorAll('[data-content]').forEach((el) => el.classList.toggle('pane-hidden', el.dataset.content !== p));
      }
      document.querySelectorAll('.ch1-tab-btn').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); activateTab(b.dataset.pane); }));

      function addLog(msg) {
        logs.push(msg);
        const empty = logListEl.querySelector('.mon-empty');
        if (empty) empty.remove();
        const row = document.createElement('div');
        row.className = 'sig-hx-row';
        row.textContent = `• ${msg}`;
        logListEl.appendChild(row);
      }

      function expectedEtt(c) {
        const w = Number(c.weight || 5);
        if (c.species === 'cat' || w < 4.5) return '3.5';
        if (w < 8) return '4.5';
        if (w < 18) return '6.0';
        return '9.0';
      }

      function renderMonitor() {
        document.getElementById('ch3-v-hr').textContent = Math.round(vitals.hr);
        document.getElementById('ch3-v-rr').textContent = Math.round(vitals.rr);
        document.getElementById('ch3-v-spo2').textContent = `${Math.round(vitals.spo2)}%`;
        document.getElementById('ch3-v-bp').textContent = `${Math.round(vitals.sbp)}/${Math.round(vitals.map)}/${Math.round(vitals.dbp)}`;
        document.getElementById('ch3-v-etco2').textContent = vitals.etco2 != null ? `${vitals.etco2} mmHg` : '--';
        const waveEl = document.getElementById('ch3-v-etco2-wave');
        if (waveEl) {
          waveEl.textContent = vitals.etco2Wave || '파형 없음';
          waveEl.style.color = vitals.etco2Wave === '정상 파형' ? '#86efac' : vitals.etco2Wave === '이상 파형' ? '#fca5a5' : '#cbd5e1';
        }
        document.getElementById('ch3-v-depth').textContent = vitals.depth;

        const stText = state.trans.size >= 4 ? '유지 전환 완료' : state.intubated ? '삽관 완료 (유지 전환 대기)' : state.premedDone ? '전처치 완료 (도입 대기)' : '전처치 대기';
        statusLineEl.innerHTML = `<strong>진행 상태:</strong> ${stText}`;

        chkBodyEl.innerHTML = `
          <div class="sig-hx-list">
            <div class="sig-hx-row"><span class="sig-hx-k">전처치:</span><span>${state.premedDone ? Array.from(premedPicks).join(', ') : '미실시'}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">전산소화:</span><span>${state.preO2Done ? '완료 (SpO₂ 99%)' : '미실시'}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">유도 적정:</span><span>${indPick ? `${indPick} (${state.titrateCount}/4)` : '미실시'}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">기관삽관:</span><span>${state.intubated ? `ETT #${ettPick} 삽관 · ${vitals.etco2Wave}` : '미실시'}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">유지 전환:</span><span>${state.trans.size} / 4 항목 완료</span></div>
          </div>
        `;
      }

      document.querySelectorAll('[data-p3]').forEach((b) => b.addEventListener('click', () => {
        if (evaluated || state.premedDone) return;
        const k = b.dataset.p3;
        if (premedPicks.has(k)) premedPicks.delete(k); else premedPicks.add(k);
        b.classList.toggle('active', premedPicks.has(k));
        Settings.playTone(540, 0.04, 0.025);
      }));

      btnPremed.addEventListener('click', () => {
        if (evaluated || state.premedDone || !premedPicks.size) return;
        state.premedDone = true;
        btnPremed.classList.add('exam-done');
        btnPremed.disabled = true;
        vitals.hr = Math.max(55, vitals.hr - (premedPicks.has('Dexmedetomidine') ? 26 : 12));
        vitals.rr = Math.max(12, vitals.rr - 6);
        vitals.depth = '경도 진정';
        if (currentCase.trueAsa >= 4 && premedPicks.has('Dexmedetomidine')) {
          state.mistakes.push('중증/응급 환자에서 Dexmedetomidine 전처치로 혈역학 부담 증가');
        }
        addLog(`전처치 투여: ${Array.from(premedPicks).join(', ')}`);
        Settings.playTone(620, 0.06, 0.03);
        renderMonitor();
      });

      btnPreO2.addEventListener('click', () => {
        if (evaluated || state.preO2Done) return;
        state.preO2Done = true;
        btnPreO2.classList.add('exam-done');
        btnPreO2.disabled = true;
        vitals.spo2 = 99;
        addLog('100% O₂ 전산소화 3분 실시 (SpO₂ 99% 확보)');
        Settings.playTone(640, 0.06, 0.03);
        renderMonitor();
      });

      document.querySelectorAll('[data-i3]').forEach((b) => b.addEventListener('click', () => {
        if (evaluated || state.intubated) return;
        indPick = b.dataset.i3;
        document.querySelectorAll('[data-i3]').forEach((el) => el.classList.toggle('active', el === b));
        Settings.playTone(540, 0.04, 0.025);
      }));

      btnTitrate.addEventListener('click', () => {
        if (evaluated || state.intubated || !indPick) return;
        state.titrateCount = Math.min(4, state.titrateCount + 1);
        btnTitrate.textContent = `1/4 용량 적정 투여 (${state.titrateCount}/4)`;
        const bpDrop = indPick === 'Etomidate' ? 2 : 6;
        vitals.sbp = Math.max(70, vitals.sbp - Math.round(bpDrop * 1.3));
        vitals.map = Math.max(52, vitals.map - bpDrop);
        vitals.dbp = Math.max(38, vitals.dbp - Math.round(bpDrop * 0.8));
        vitals.rr = Math.max(6, vitals.rr - 4);
        vitals.depth = state.titrateCount >= 3 ? '삽관 가능' : '중등도 진정';
        if (state.titrateCount === 4) {
          vitals.rr = 4;
          if (!state.preO2Done) vitals.spo2 = Math.max(88, vitals.spo2 - 7);
          state.mistakes.push('유도제 과다 적정(4/4)으로 일시적 무호흡·저혈압 유발');
          addLog(`${indPick} 4/4 과투여 — 일시적 무호흡 주의`);
        } else {
          addLog(`${indPick} ${state.titrateCount}/4 적정 투여 (${vitals.depth})`);
        }
        Settings.playTone(580, 0.05, 0.03);
        renderMonitor();
      });

      document.querySelectorAll('[data-ett]').forEach((b) => b.addEventListener('click', () => {
        if (evaluated || state.intubated) return;
        ettPick = b.dataset.ett;
        document.querySelectorAll('[data-ett]').forEach((el) => el.classList.toggle('active', el === b));
        Settings.playTone(540, 0.04, 0.025);
      }));

      btnIntubate.addEventListener('click', () => {
        if (evaluated || state.intubated || !ettPick) return;
        if (state.titrateCount < 2) {
          state.mistakes.push('유도 깊이 부족 상태에서 조기 삽관 시도');
          addLog('유도 깊이 부족 — 구역반사 발생, 추가 적정 필요');
          Settings.playTone(320, 0.08, 0.03);
          return;
        }
        state.intubated = true;
        btnIntubate.classList.add('exam-done');
        btnIntubate.disabled = true;
        btnTitrate.classList.add('exam-done');
        btnTitrate.disabled = true;
        const recEtt = expectedEtt(currentCase);
        const ettMismatch = ettPick !== recEtt;
        if (ettMismatch) {
          state.mistakes.push(`ETT 규격 오차 (선택 #${ettPick} / 권장 #${recEtt})`);
          vitals.etco2 = 48;
          vitals.etco2Wave = '이상 파형';
        } else if (vitals.rr <= 4) {
          vitals.etco2 = 52;
          vitals.etco2Wave = '이상 파형';
        } else {
          vitals.etco2 = 39;
          vitals.etco2Wave = '정상 파형';
        }
        vitals.depth = '수술 적정 도입';
        addLog(`ETT #${ettPick} 기관삽관 완료 · 커프 팽창 · ETCO₂ ${vitals.etco2} mmHg (${vitals.etco2Wave})`);
        Settings.playTone(700, 0.07, 0.035);
        renderMonitor();
      });

      document.querySelectorAll('[data-tr]').forEach((b) => b.addEventListener('click', () => {
        if (evaluated) return;
        const k = b.dataset.tr;
        if (state.trans.has(k)) return;
        state.trans.add(k);
        b.classList.add('exam-done');
        b.disabled = true;
        addLog(`유지 전환 체크: ${b.textContent.trim()}`);
        Settings.playTone(620, 0.05, 0.03);
        renderMonitor();
      }));

      function setReviewTab(k) {
        document.querySelectorAll('[data-rv-tab]').forEach((b) => b.classList.toggle('active', b.dataset.rvTab === k));
        document.querySelectorAll('[data-rv-pane]').forEach((p) => p.classList.toggle('pane-hidden', p.dataset.rvPane !== k));
        if (k === 'ai' && !aiText) runAiDebrief();
        if (k === 'soap' && !soapText) runSoap();
      }
      document.querySelectorAll('[data-rv-tab]').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); setReviewTab(b.dataset.rvTab); }));
      document.getElementById('ch3-review-close').addEventListener('click', () => reviewModalEl.classList.add('hidden'));
      reviewModalEl.addEventListener('click', (e) => { if (e.target === reviewModalEl) reviewModalEl.classList.add('hidden'); });

      function buildAiPayload(task) {
        const c = lastReport.caseObj;
        return {
          task, phase: 'chapter3', chapterLabel: 'Chapter 3 마취 도입',
          species: c.species === 'cat' ? '고양이' : '개',
          scenario: `${c.name} (${c.breed}, ${c.weight}kg) - ${c.chiefComplaint}`,
          chatSummary: logs.join(' | '),
          examSummary: `HR ${Math.round(vitals.hr)}, SpO2 ${Math.round(vitals.spo2)}%, MAP ${Math.round(vitals.map)}, ETCO2 ${vitals.etco2 ?? '-'}`,
          studentEval: `점수 ${lastReport.score}점 (${lastReport.grade}), ETT #${ettPick || '-'}`,
          trueEval: `권장 ETT #${expectedEtt(c)}, 전처치·전산소화·적정유도·삽관·유지전환 완료`
        };
      }
      async function runAiDebrief() {
        rvAiEl.innerHTML = '<div class="b-card-soft" style="padding:14px; text-align:center;">AI 로그 분석 중...</div>';
        let t = '';
        try { const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(buildAiPayload('debrief')) }); if (r.ok) { const d = await r.json(); t = (d.analysis || d.text || '').trim(); } } catch {}
        if (!t) t = `[오프라인 도입 로그 분석]\n1) 수행 요약: 전처치(${state.premedDone ? '완료' : '누락'}), 전산소화(${state.preO2Done ? '완료' : '누락'}), 삽관(${state.intubated ? 'ETT #' + ettPick : '미완료'}), 유지전환(${state.trans.size}/4).\n2) 보완 포인트: ${state.mistakes.length ? state.mistakes.join(' / ') : '안정적인 도입 및 기도 확보를 수행했습니다.'}`;
        aiText = t;
        rvAiEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(t)}</div>`;
      }
      async function runSoap() {
        rvSoapEl.innerHTML = '<div class="b-card-soft" style="padding:14px; text-align:center;">AI SOAP 분석 생성 중...</div>';
        let t = '';
        try { const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(buildAiPayload('soap_record')) }); if (r.ok) { const d = await r.json(); t = (d.text || d.analysis || '').trim(); } } catch {}
        if (!t) {
          const c = lastReport.caseObj;
          t = `S: ${c.name} (${c.breed}, ${c.weight}kg) 마취 도입\nO: 최종 바이탈 HR ${Math.round(vitals.hr)}, SpO₂ ${Math.round(vitals.spo2)}%, MAP ${Math.round(vitals.map)}, ETCO₂ ${vitals.etco2 ?? '-'}\nA: 마취 도입 평가 ${lastReport.score}점 (${lastReport.grade})\nP: APL 밸브 개방 및 호흡회로 유지 상태로 Chapter 4 마취 유지 진입`;
        }
        soapText = t;
        rvSoapEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(t)}</div>`;
      }

      evalSubmitBtn.addEventListener('click', () => {
        if (!currentCase) return;
        if (evaluated) { Settings.playTone(540, 0.05, 0.03); setReviewTab('wrong'); reviewModalEl.classList.remove('hidden'); return; }
        evaluated = true;

        let score = 100;
        if (!state.premedDone) score -= 15;
        if (!state.preO2Done) score -= 12;
        if (!state.intubated) score -= 25;
        score -= (4 - state.trans.size) * 8;
        score -= state.mistakes.length * 8;
        score = Math.max(0, Math.min(100, Math.round(score)));
        const grade = score >= 95 ? 'S' : score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 50 ? 'D' : 'F';

        lastReport = { caseObj: currentCase, score, grade };
        aiText = null; soapText = null;
        rvWrongEl.innerHTML = `
          <div class="b-card-soft" style="padding:12px; display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-family:var(--font-display); font-size:15px;">마취 도입 평가</strong>
              <strong style="font-family:var(--font-display); font-size:17px; color:#dc2626;">${score}점 (${grade})</strong>
            </div>
            <div class="modal-row"><span class="muted">전처치 / 전산소화</span><strong>${state.premedDone ? '완료' : '누락'} / ${state.preO2Done ? '완료' : '누락'}</strong></div>
            <div class="modal-row"><span class="muted">기관삽관 (권장 #${expectedEtt(currentCase)})</span><strong>${state.intubated ? 'ETT #' + ettPick : '미실시'}</strong></div>
            <div class="modal-row"><span class="muted">유지 전환 체크</span><strong>${state.trans.size} / 4</strong></div>
          </div>
          <div class="b-card" style="padding:12px; margin-top:8px; line-height:1.55;">
            <div class="b-label"><span>오답노트</span></div>
            ${state.mistakes.length ? state.mistakes.map((m) => `<p style="color:#b91c1c;">• ${escapeHtml(m)}</p>`).join('') : '<p>• 감점 사항 없이 안전하게 마취 도입과 유지 전환을 완료했습니다.</p>'}
          </div>
        `;

        evalSubmitBtn.textContent = '해설 보기';
        document.getElementById('ch3-stamp-asa').textContent = `ETT #${ettPick || '-'}`;
        document.getElementById('ch3-stamp-prog').textContent = 'INDUCTION';
        document.getElementById('ch3-stamp-grade').textContent = currentStageId === 'tutorial' ? '완료' : grade;
        stampOverlayEl.classList.remove('hidden');
        Settings.playStampSound();

        Settings.saveStageResult(3, currentStageId, { grade, score });
        if (chapterCtrl) chapterCtrl.refreshStages();
        Settings.triggerStageGlow();
      });

      async function loadStage(stageId, opts = {}) {
        const prevCase = currentCase;
        currentStageId = stageId;
        premedPicks = new Set();
        indPick = null;
        ettPick = null;
        state = { premedDone: false, preO2Done: false, titrateCount: 0, intubated: false, trans: new Set(), mistakes: [] };
        logs = [];
        evaluated = false;
        lastReport = null;
        aiText = null; soapText = null;

        reviewModalEl.classList.add('hidden');
        stampOverlayEl.classList.add('hidden');
        evalSubmitBtn.textContent = '도입 완료';
        btnTitrate.textContent = '1/4 용량 적정 투여 (0/4)';
        document.querySelectorAll('[data-p3], [data-i3], [data-ett]').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.exam-main-btn').forEach((b) => { b.classList.remove('exam-done'); b.disabled = false; });
        ['ch3-sec-vitals', 'ch3-sec-chk', 'ch3-sec-log'].forEach((id) => setMonCollapsed(id, false));
        logListEl.innerHTML = '<div class="mon-empty">도입 대기 중</div>';
        activateTab('premed');

        if (stageId === 'practice_dog' || stageId === 'practice_cat') {
          if (opts && opts.preserveCase && prevCase) {
            currentCase = prevCase;
          } else {
            sigHeadEl.innerHTML = '<span>환자 생성 중...</span>';
            currentCase = await Data.generatePracticeCase(stageId === 'practice_cat' ? 'cat' : 'dog');
          }
        } else {
          currentCase = Data.getFixedCase(stageId);
        }

        vitals = {
          hr: currentCase.pe.hr,
          rr: currentCase.pe.rr,
          spo2: currentCase.trueAsa >= 5 ? 92 : 97,
          sbp: currentCase.pe.bpSys,
          map: currentCase.pe.bpMap,
          dbp: currentCase.pe.bpDia,
          etco2: null,
          etco2Wave: '파형 없음',
          depth: '각성'
        };
        const spKr = currentCase.species === 'cat' ? '고양이' : '개';
        sigHeadEl.innerHTML = `<span>${currentCase.name}</span><span class="ch1-sig-meta">${spKr} · ${currentCase.breed} · ${currentCase.age} · ${currentCase.weight} kg</span>`;
        renderMonitor();
      }

      const chapterCtrl = Settings.initChapterCommon({
        chapterNum: 3,
        chapterTitle: '마취 도입',
        initialStageId: 'tutorial',
        helpSlides: [
          { mark: '1', label: '전처치 및 전산소화', desc: '적절한 전처치 투여 후 3분 전산소화로 산소 예비량을 확보합니다.' },
          { mark: '2', label: '유도제 적정 및 삽관', desc: '1/4씩 적정하여 무호흡을 방지하고 체중에 맞는 ETT로 삽관합니다.' },
          { mark: '3', label: '유지 전환 체크', desc: 'O₂, 기화기, APL 밸브 개방, 모니터 부착 완료 후 도입을 마칩니다.' }
        ],
        tutorialSteps: [
          { title: '1. 도입 모니터링창', sel: '#ch3-monitor', onEnter: () => activateTab('premed'), text: '실시간 생체 모니터(HR·SpO₂·MAP·RR·ETCO₂)와 도입 체크리스트·처치 로그를 확인합니다.' },
          { title: '2. 전처치 · 전산소화', sel: '#ch3-control', onEnter: () => activateTab('premed'), text: '전처치 약물을 선택해 일괄 투여하고, 전산소화(Pre-O₂)로 산소 예비량을 확보합니다.' },
          { title: '3. 도입 · 기관삽관', sel: '#ch3-control', onEnter: () => activateTab('induct'), text: '유도제를 1/4씩 적정 투여한 뒤 체중에 맞는 ETT 규격을 선택해 삽관합니다.' },
          { title: '4. 유지 전환 및 시작', sel: '#ch3-control', onEnter: () => activateTab('trans'), text: 'O₂·기화기·APL 밸브 개방·모니터 부착을 완료하고 도입 완료를 누릅니다. 이제 튜토리얼 케이스를 시작합니다.' }
        ],
        onTutorialFinish: () => activateTab('premed'),
        onSelectStage: (stageId, opts) => loadStage(stageId, opts)
      });

      loadStage('tutorial');
    })();
  </script>
</body>
</html>
