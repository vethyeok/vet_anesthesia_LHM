<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chapter 4. 마취 유지 — 베타 1.1</title>
  <link rel="stylesheet" href="beta11.css?v=20261127a" />
  <script src="beta11-settings.js"></script>
  <script src="beta11-ch1-data.js"></script>
</head>
<body>
  <div class="app-shell chapter-shell">
    <header class="top-bar">
      <div class="top-left">
        <div class="top-title">Chapter 4. 마취 유지</div>
      </div>
      <div id="chapter-top-actions" class="top-actions"></div>
    </header>

    <main class="ch1-page-body">
      <div class="ch1-split" id="ch4-split">
        <!-- 좌측(데스크탑) / 상단(모바일): 모니터링창 -->
        <section class="ch1-monitor" id="ch4-monitor" aria-label="마취 유지 모니터링창">
          <div class="ch1-sig-pinned">
            <div class="ch1-sig-head" id="ch4-sig-head"></div>
            <div style="margin-top:6px;">
              <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--brown-soft); margin-bottom:4px;">
                <span id="ch4-phase-lbl">수술 준비 · 0%</span>
                <span id="ch4-clock-lbl">00:00</span>
              </div>
              <div class="prog-track"><div class="prog-fill" id="ch4-prog-fill" style="width:0%;"></div></div>
            </div>
          </div>

          <div class="ch1-monitor-scroll">
            <div class="mon-sec" id="ch4-sec-vitals">
              <div class="mon-sec-title">
                <span>1. 실시간 생체 모니터</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch4-sec-vitals">접기</button>
              </div>
              <div class="mon-sec-body">
                <div class="monitor-mock" style="padding:10px;">
                  <div class="monitor-row">
                    <div class="m-cell"><span class="mk">HR</span><span class="mv" id="ch4-v-hr">--</span></div>
                    <div class="m-cell"><span class="mk">SpO₂</span><span class="mv" id="ch4-v-spo2">--%</span></div>
                    <div class="m-cell"><span class="mk">ETCO₂</span><span class="mv" id="ch4-v-etco2">--</span></div>
                    <div class="m-cell"><span class="mk">MAP</span><span class="mv" id="ch4-v-map">--</span></div>
                  </div>
                  <div class="monitor-row" style="grid-template-columns:repeat(3,1fr);">
                    <div class="m-cell"><span class="mk">BT</span><span class="mv" id="ch4-v-bt" style="font-size:14px;">--.-°</span></div>
                    <div class="m-cell"><span class="mk">Iso %</span><span class="mv" id="ch4-v-iso" style="font-size:14px;">1.5%</span></div>
                    <div class="m-cell"><span class="mk">환기</span><span class="mv" id="ch4-v-vent" style="font-size:13px;">자발</span></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="mon-sec" id="ch4-sec-state">
              <div class="mon-sec-title">
                <span>2. 현재 처치 설정</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch4-sec-state">접기</button>
              </div>
              <div class="mon-sec-body" id="ch4-state-body"></div>
            </div>

            <div class="mon-sec" id="ch4-sec-log">
              <div class="mon-sec-title">
                <span>3. 수술 스토리 로그</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch4-sec-log">접기</button>
              </div>
              <div class="mon-sec-body">
                <div class="sig-hx-list" id="ch4-log-list"><div class="mon-empty">수술 시작 대기</div></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 우측(데스크탑) / 하단(모바일): 조작창 -->
        <section class="ch1-control" id="ch4-control" aria-label="마취 유지 조작창">
          <div class="ch1-ctrl-handle" id="ch4-ctrl-handle" role="button" tabindex="0" aria-label="조작창 접기 및 펼치기">
            <div class="ch1-ctrl-handle-bar"></div>
          </div>

          <div class="ch1-ctrl-tabs" role="tablist">
            <button type="button" class="b-btn ch1-tab-btn active" data-pane="vent">환기 · 수액</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="drug">약물 · CRI</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="finish">유지 종료</button>
          </div>

          <div class="ch1-ctrl-body">
            <!-- 1. 환기 · 수액 -->
            <div class="ch1-pane" data-content="vent">
              <div class="prog-grid">
                <button type="button" class="b-btn prog-btn" id="ch4-iso-down">Iso -0.5%</button>
                <button type="button" class="b-btn prog-btn" id="ch4-iso-up">Iso +0.5%</button>
                <button type="button" class="b-btn prog-btn" id="ch4-btn-vent">IPPV 기계환기</button>
                <button type="button" class="b-btn prog-btn" id="ch4-btn-warm">능동 가온</button>
                <button type="button" class="b-btn prog-btn span-2" id="ch4-btn-bolus">결정질 수액 볼루스 (10 mL/kg)</button>
                <button type="button" class="b-btn prog-btn span-2" id="ch4-btn-pause">일시정지</button>
              </div>
            </div>

            <!-- 2. 약물 · CRI -->
            <div class="ch1-pane pane-hidden" data-content="drug">
              <div class="prog-grid">
                <button type="button" class="b-btn prog-btn" data-drug4="atropine">Atropine (서맥)</button>
                <button type="button" class="b-btn prog-btn" data-drug4="ephedrine">Ephedrine (저혈압)</button>
                <button type="button" class="b-btn prog-btn" data-drug4="fentanyl">Fentanyl (통증)</button>
                <button type="button" class="b-btn prog-btn" data-drug4="norepi">Norepinephrine CRI</button>
                <button type="button" class="b-btn prog-btn" data-drug4="lidocaine">Lidocaine (부정맥)</button>
                <button type="button" class="b-btn prog-btn" data-drug4="caglu">Ca Gluconate (고K⁺)</button>
              </div>
            </div>

            <!-- 3. 유지 종료 -->
            <div class="ch1-pane pane-hidden" data-content="finish">
              <div id="ch4-summary-box" class="b-card-soft" style="padding:12px;"></div>
              <div style="margin-top:auto; padding-top:6px;">
                <button type="button" class="b-btn" id="ch4-eval-submit" style="width:100%; height:44px; border-radius:14px;">마취 유지 완료</button>
              </div>
            </div>

            <!-- 50% 투명도 빨간 사각형 도장 -->
            <div id="ch4-stamp-overlay" class="ch1-stamp-overlay hidden" aria-live="polite">
              <div class="ch1-stamp-asa" id="ch4-stamp-asa"></div>
              <div class="ch1-stamp-prog" id="ch4-stamp-prog"></div>
              <div class="ch1-stamp-grade" id="ch4-stamp-grade"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 해설 보기 팝업 -->
  <div id="ch4-review-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" style="backdrop-filter:blur(6px);">
    <div class="modal-card" style="max-width:420px; max-height:84dvh; display:flex; flex-direction:column;">
      <h2 class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">해설 보기</h2>
      <div class="step-tabs" role="tablist" style="margin-bottom:10px; flex-shrink:0;">
        <button type="button" class="step-tab active" data-rv-tab="wrong">오답노트</button>
        <button type="button" class="step-tab" data-rv-tab="ai">AI 로그 분석</button>
        <button type="button" class="step-tab" data-rv-tab="soap">SOAP 분석</button>
      </div>
      <div style="flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:180px;">
        <div id="ch4-rv-wrong" data-rv-pane="wrong"></div>
        <div id="ch4-rv-ai" data-rv-pane="ai" class="pane-hidden"></div>
        <div id="ch4-rv-soap" data-rv-pane="soap" class="pane-hidden"></div>
      </div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch4-review-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const Data = window.Beta11Ch1Data;
      const Settings = window.Beta11Settings;
      if (!Data || !Settings) return;

      const splitEl = document.getElementById('ch4-split');
      const sigHeadEl = document.getElementById('ch4-sig-head');
      const phaseLblEl = document.getElementById('ch4-phase-lbl');
      const clockLblEl = document.getElementById('ch4-clock-lbl');
      const progFillEl = document.getElementById('ch4-prog-fill');
      const stateBodyEl = document.getElementById('ch4-state-body');
      const logListEl = document.getElementById('ch4-log-list');
      const summaryBoxEl = document.getElementById('ch4-summary-box');
      const ctrlHandleEl = document.getElementById('ch4-ctrl-handle');
      const evalSubmitBtn = document.getElementById('ch4-eval-submit');
      const stampOverlayEl = document.getElementById('ch4-stamp-overlay');
      const reviewModalEl = document.getElementById('ch4-review-modal');
      const rvWrongEl = document.getElementById('ch4-rv-wrong');
      const rvAiEl = document.getElementById('ch4-rv-ai');
      const rvSoapEl = document.getElementById('ch4-rv-soap');

      let currentStageId = 'tutorial';
      let currentCase = null;
      let tickTimer = null;
      let sim = null;
      let logs = [];
      let evaluated = false;
      let lastReport = null;
      let aiText = null;
      let soapText = null;

      function stopSim() {
        if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
      }
      window.__b11Cleanup = stopSim;

      function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
      const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      function setMonCollapsed(id, c) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.classList.toggle('is-collapsed', Boolean(c));
        const b = sec.querySelector('.mon-toggle-btn');
        if (b) b.textContent = c ? '열기' : '접기';
      }
      document.querySelectorAll('[data-mon-toggle]').forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const sec = document.getElementById(b.dataset.monToggle);
        if (!sec) return;
        Settings.playTone(500, 0.04, 0.025);
        setMonCollapsed(b.dataset.monToggle, !sec.classList.contains('is-collapsed'));
      }));

      function setCollapsed(c) {
        if (window.innerWidth >= 960) { splitEl.classList.remove('ctrl-collapsed'); return; }
        splitEl.classList.toggle('ctrl-collapsed', Boolean(c));
      }
      let hY = 0, hDrag = false, hMoved = false;
      ctrlHandleEl.addEventListener('pointerdown', (e) => { if (window.innerWidth >= 960) return; hDrag = true; hMoved = false; hY = e.clientY; if (ctrlHandleEl.setPointerCapture) ctrlHandleEl.setPointerCapture(e.pointerId); });
      ctrlHandleEl.addEventListener('pointermove', (e) => { if (!hDrag) return; const dy = e.clientY - hY; if (Math.abs(dy) > 20) { hMoved = true; setCollapsed(dy > 0); } });
      const endH = () => { if (!hDrag) return; hDrag = false; if (!hMoved) setCollapsed(!splitEl.classList.contains('ctrl-collapsed')); };
      ctrlHandleEl.addEventListener('pointerup', endH);
      ctrlHandleEl.addEventListener('pointercancel', endH);
      window.addEventListener('resize', () => { if (window.innerWidth >= 960) splitEl.classList.remove('ctrl-collapsed'); });

      function activateTab(p) {
        setCollapsed(false);
        document.querySelectorAll('.ch1-tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.pane === p));
        document.querySelectorAll('[data-content]').forEach((el) => el.classList.toggle('pane-hidden', el.dataset.content !== p));
      }
      document.querySelectorAll('.ch1-tab-btn').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); activateTab(b.dataset.pane); }));

      function addLog(msg) {
        const mm = String(Math.floor(sim.sec / 60)).padStart(2, '0');
        const ss = String(sim.sec % 60).padStart(2, '0');
        const line = `[${mm}:${ss}] ${msg}`;
        logs.unshift(line);
        const empty = logListEl.querySelector('.mon-empty');
        if (empty) empty.remove();
        const row = document.createElement('div');
        row.className = 'sig-hx-row';
        row.textContent = line;
        logListEl.prepend(row);
      }

      function renderUI() {
        if (!sim) return;
        const pct = Math.min(100, Math.round(sim.prog));
        const phase = pct < 25 ? '피부 절개' : pct < 65 ? '본 처치 진행' : pct < 100 ? '지혈 · 봉합' : '수술 종료';
        phaseLblEl.textContent = `${phase} · ${pct}%`;
        const mm = String(Math.floor(sim.sec / 60)).padStart(2, '0');
        const ss = String(sim.sec % 60).padStart(2, '0');
        clockLblEl.textContent = `${mm}:${ss}`;
        progFillEl.style.width = `${pct}%`;

        const hrEl = document.getElementById('ch4-v-hr');
        const mapEl = document.getElementById('ch4-v-map');
        const spo2El = document.getElementById('ch4-v-spo2');
        const etEl = document.getElementById('ch4-v-etco2');
        const btEl = document.getElementById('ch4-v-bt');
        hrEl.textContent = Math.round(sim.hr);
        spo2El.textContent = `${Math.round(sim.spo2)}%`;
        etEl.textContent = Math.round(sim.etco2);
        mapEl.textContent = Math.round(sim.map);
        btEl.textContent = `${sim.bt.toFixed(1)}°`;
        document.getElementById('ch4-v-iso').textContent = `${sim.iso.toFixed(1)}%`;
        document.getElementById('ch4-v-vent').textContent = sim.ippv ? 'IPPV' : '자발';

        mapEl.style.color = sim.map < 65 ? '#fca5a5' : '#ffffff';
        spo2El.style.color = sim.spo2 < 94 ? '#fca5a5' : '#ffffff';
        etEl.style.color = sim.etco2 > 52 ? '#fde68a' : '#ffffff';

        stateBodyEl.innerHTML = `
          <div class="sig-hx-list">
            <div class="sig-hx-row"><span class="sig-hx-k">기화기 / 환기:</span><span>Iso ${sim.iso.toFixed(1)}% · ${sim.ippv ? 'IPPV 기계환기' : '자발 호흡'}</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">능동 가온 / 볼루스:</span><span>${sim.warm ? 'ON' : 'OFF'} · 수액 볼루스 ${sim.bolusCount}회</span></div>
            <div class="sig-hx-row"><span class="sig-hx-k">활성 CRI:</span><span>${sim.norepi ? 'Norepinephrine CRI 가동 중' : '없음'}</span></div>
          </div>
        `;

        const stabPct = sim.totalTicks ? Math.round((sim.stableTicks / sim.totalTicks) * 100) : 100;
        summaryBoxEl.innerHTML = `
          <div class="modal-row"><span class="muted">수술 진행률</span><strong>${pct}%</strong></div>
          <div class="modal-row"><span class="muted">혈역학·호흡 안정률</span><strong>${stabPct}%</strong></div>
          <div class="modal-row"><span class="muted">발생 이벤트 / 처치</span><strong>${sim.events}건 / ${sim.actions}회</strong></div>
        `;
      }

      function stepSim() {
        if (!sim || sim.paused || evaluated) return;
        sim.sec += 1;
        sim.prog = Math.min(100, sim.prog + 2.5);
        sim.totalTicks += 1;

        // Story events at key progress checkpoints
        if (sim.prog >= 25 && !sim.ev1) {
          sim.ev1 = true; sim.events += 1;
          sim.map -= (currentCase.trueAsa >= 3 ? 16 : 10);
          sim.etco2 += 9;
          addLog('돌발 이벤트: 마취 심화 및 저혈압·고탄산혈증 경향 발생');
        }
        if (sim.prog >= 58 && !sim.ev2) {
          sim.ev2 = true; sim.events += 1;
          sim.hr += 24; sim.map += 8;
          addLog('돌발 이벤트: 수술적 통증 자극 — 빈맥 반응 (진통 필요)');
        }
        if (sim.prog >= 85 && !sim.ev3) {
          sim.ev3 = true; sim.events += 1;
          addLog('수술 막바지: 지혈 및 피부 봉합 단계 진입');
        }

        // Physiology drift
        const isoTargetMap = (currentCase.pe.bpMap || 88) - (sim.iso - 1.2) * 18 + (sim.norepi ? 18 : 0) + sim.bolusBoost;
        sim.map = cl(sim.map + (isoTargetMap - sim.map) * 0.18, 42, 135);
        sim.bolusBoost = Math.max(0, sim.bolusBoost - 0.5);

        const targetEtco2 = sim.ippv ? 39 : (40 + sim.iso * 6);
        sim.etco2 = cl(sim.etco2 + (targetEtco2 - sim.etco2) * 0.16, 26, 72);
        sim.spo2 = cl(sim.ippv ? 99 : (sim.etco2 > 55 ? sim.spo2 - 0.5 : 98), 86, 100);
        sim.bt = cl(sim.bt + (sim.warm ? 0.02 : -0.03), 35.0, 39.5);

        const isStable = sim.map >= 65 && sim.spo2 >= 94 && sim.etco2 <= 50 && sim.bt >= 36.2;
        if (isStable) sim.stableTicks += 1;

        renderUI();
      }

      document.getElementById('ch4-iso-down').addEventListener('click', () => {
        if (!sim || evaluated) return;
        sim.iso = cl(Math.round((sim.iso - 0.5) * 10) / 10, 0.5, 3.0);
        sim.actions += 1;
        addLog(`기화기 Iso 감량 → ${sim.iso.toFixed(1)}%`);
        Settings.playTone(520, 0.04, 0.025);
        renderUI();
      });
      document.getElementById('ch4-iso-up').addEventListener('click', () => {
        if (!sim || evaluated) return;
        sim.iso = cl(Math.round((sim.iso + 0.5) * 10) / 10, 0.5, 3.0);
        sim.actions += 1;
        addLog(`기화기 Iso 증량 → ${sim.iso.toFixed(1)}%`);
        Settings.playTone(560, 0.04, 0.025);
        renderUI();
      });
      document.getElementById('ch4-btn-vent').addEventListener('click', (e) => {
        if (!sim || evaluated) return;
        sim.ippv = !sim.ippv;
        sim.actions += 1;
        e.currentTarget.classList.toggle('active', sim.ippv);
        addLog(sim.ippv ? 'IPPV 기계환기 전환 (ETCO₂ 교정)' : '자발 호흡 전환');
        Settings.playTone(580, 0.05, 0.03);
        renderUI();
      });
      document.getElementById('ch4-btn-warm').addEventListener('click', (e) => {
        if (!sim || evaluated) return;
        sim.warm = !sim.warm;
        sim.actions += 1;
        e.currentTarget.classList.toggle('active', sim.warm);
        addLog(sim.warm ? '능동 가온(Warm air) 시작' : '능동 가온 중지');
        Settings.playTone(560, 0.05, 0.03);
        renderUI();
      });
      document.getElementById('ch4-btn-bolus').addEventListener('click', () => {
        if (!sim || evaluated) return;
        sim.bolusCount += 1;
        sim.bolusBoost = Math.min(20, sim.bolusBoost + 10);
        sim.map = cl(sim.map + 8, 45, 130);
        sim.actions += 1;
        addLog('결정질 수액 볼루스 (10 mL/kg) 투여 — 혈압 보강');
        Settings.playTone(620, 0.05, 0.03);
        renderUI();
      });
      document.getElementById('ch4-btn-pause').addEventListener('click', (e) => {
        if (!sim || evaluated) return;
        sim.paused = !sim.paused;
        e.currentTarget.classList.toggle('active', sim.paused);
        e.currentTarget.textContent = sim.paused ? '재개' : '일시정지';
        Settings.playTone(500, 0.04, 0.025);
      });

      document.querySelectorAll('[data-drug4]').forEach((b) => b.addEventListener('click', () => {
        if (!sim || evaluated) return;
        const d = b.dataset.drug4;
        sim.actions += 1;
        if (d === 'atropine') { sim.hr = cl(sim.hr + 28, 50, 210); addLog('Atropine IV 투여 — 심박수 상승'); }
        else if (d === 'ephedrine') { sim.map = cl(sim.map + 14, 45, 135); sim.hr = cl(sim.hr + 8, 50, 210); addLog('Ephedrine IV 투여 — MAP 상승'); }
        else if (d === 'fentanyl') { sim.hr = cl(sim.hr - 20, 55, 200); sim.map = cl(sim.map - 4, 50, 130); addLog('Fentanyl 볼루스 IV — 수술 통증 진통'); }
        else if (d === 'norepi') { sim.norepi = !sim.norepi; b.classList.toggle('active', sim.norepi); addLog(sim.norepi ? 'Norepinephrine CRI 시작' : 'Norepinephrine CRI 중단'); }
        else if (d === 'lidocaine') { sim.hr = cl(sim.hr - 10, 60, 200); addLog('Lidocaine IV 투여 — 심실성 부정맥 안정화'); }
        else if (d === 'caglu') { sim.hr = cl(sim.hr + 6, 60, 200); addLog('Calcium Gluconate 서서히 IV — 심근막 안정화'); }
        Settings.playTone(640, 0.05, 0.03);
        renderUI();
      }));

      function setReviewTab(k) {
        document.querySelectorAll('[data-rv-tab]').forEach((b) => b.classList.toggle('active', b.dataset.rvTab === k));
        document.querySelectorAll('[data-rv-pane]').forEach((p) => p.classList.toggle('pane-hidden', p.dataset.rvPane !== k));
        if (k === 'ai' && !aiText) runAiDebrief();
        if (k === 'soap' && !soapText) runSoap();
      }
      document.querySelectorAll('[data-rv-tab]').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); setReviewTab(b.dataset.rvTab); }));
      document.getElementById('ch4-review-close').addEventListener('click', () => reviewModalEl.classList.add('hidden'));
      reviewModalEl.addEventListener('click', (e) => { if (e.target === reviewModalEl) reviewModalEl.classList.add('hidden'); });

      function buildAiPayload(task) {
        const c = lastReport.caseObj;
        return {
          task, phase: 'chapter4', chapterLabel: 'Chapter 4 마취 유지',
          species: c.species === 'cat' ? '고양이' : '개',
          scenario: `${c.name} (${c.breed}, ${c.weight}kg) - ${c.chiefComplaint}`,
          chatSummary: logs.slice(0, 10).join(' | '),
          examSummary: `진행률 ${Math.round(sim.prog)}%, 안정률 ${lastReport.stabPct}%, 최종 HR ${Math.round(sim.hr)}, MAP ${Math.round(sim.map)}, ETCO2 ${Math.round(sim.etco2)}, BT ${sim.bt.toFixed(1)}`,
          studentEval: `점수 ${lastReport.score}점 (${lastReport.grade})`,
          trueEval: '수술 진행 100%, MAP ≥ 65, SpO2 ≥ 94, ETCO2 ≤ 50, BT ≥ 36.5 유지'
        };
      }
      async function runAiDebrief() {
        rvAiEl.innerHTML = '<div class="b-card-soft" style="padding:14px; text-align:center;">AI 로그 분석 중...</div>';
        let t = '';
        try { const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(buildAiPayload('debrief')) }); if (r.ok) { const d = await r.json(); t = (d.analysis || d.text || '').trim(); } } catch {}
        if (!t) t = `[오프라인 마취 유지 분석]\n1) 수술 진행률 ${Math.round(sim.prog)}%, 생체 안정 유지율 ${lastReport.stabPct}%.\n2) 총 ${sim.actions}회 조작(수액 볼루스 ${sim.bolusCount}회, IPPV ${sim.ippv ? '사용' : '미사용'}, 가온 ${sim.warm ? '사용' : '미사용'}).\n3) 보완 사항: 저혈압·고탄산혈증 이벤트 발생 시 Iso 감량, IPPV, 진통·승압 처치를 신속히 연계하세요.`;
        aiText = t;
        rvAiEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(t)}</div>`;
      }
      async function runSoap() {
        rvSoapEl.innerHTML = '<div class="b-card-soft" style="padding:14px; text-align:center;">AI SOAP 분석 생성 중...</div>';
        let t = '';
        try { const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(buildAiPayload('soap_record')) }); if (r.ok) { const d = await r.json(); t = (d.text || d.analysis || '').trim(); } } catch {}
        if (!t) {
          const c = lastReport.caseObj;
          t = `S: ${c.name} (${c.breed}, ${c.weight}kg) 마취 유지 모니터링\nO: 최종 HR ${Math.round(sim.hr)}, SpO₂ ${Math.round(sim.spo2)}%, ETCO₂ ${Math.round(sim.etco2)}, MAP ${Math.round(sim.map)}, BT ${sim.bt.toFixed(1)}°C\nA: 마취 유지 안정률 ${lastReport.stabPct}%, 최종 ${lastReport.score}점 (${lastReport.grade})\nP: 수술 종료 확인 후 Chapter 5 마취 회복 단계로 이행`;
        }
        soapText = t;
        rvSoapEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(t)}</div>`;
      }

      evalSubmitBtn.addEventListener('click', () => {
        if (!currentCase || !sim) return;
        if (evaluated) { Settings.playTone(540, 0.05, 0.03); setReviewTab('wrong'); reviewModalEl.classList.remove('hidden'); return; }
        evaluated = true;
        stopSim();

        const stabPct = sim.totalTicks ? Math.round((sim.stableTicks / sim.totalTicks) * 100) : 100;
        let score = Math.round(stabPct * 0.7 + (sim.prog >= 50 ? 20 : 10) + (sim.actions > 0 ? 10 : 0));
        score = cl(score, 0, 100);
        const grade = score >= 95 ? 'S' : score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 50 ? 'D' : 'F';

        lastReport = { caseObj: currentCase, score, grade, stabPct };
        aiText = null; soapText = null;
        rvWrongEl.innerHTML = `
          <div class="b-card-soft" style="padding:12px; display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-family:var(--font-display); font-size:15px;">마취 유지 평가</strong>
              <strong style="font-family:var(--font-display); font-size:17px; color:#dc2626;">${score}점 (${grade})</strong>
            </div>
            <div class="modal-row"><span class="muted">수술 진행률</span><strong>${Math.round(sim.prog)}%</strong></div>
            <div class="modal-row"><span class="muted">바이탈 안정 유지율</span><strong>${stabPct}%</strong></div>
            <div class="modal-row"><span class="muted">최종 MAP / ETCO₂ / BT</span><strong>${Math.round(sim.map)} / ${Math.round(sim.etco2)} / ${sim.bt.toFixed(1)}°C</strong></div>
          </div>
          <div class="b-card" style="padding:12px; margin-top:8px; line-height:1.55;">
            <div class="b-label"><span>오답노트</span></div>
            <p>• ${sim.map < 65 ? '종료 시 저혈압(MAP < 65)이 남아 있었습니다. Iso 감량 및 승압/수액 보강이 필요합니다.' : '혈압(MAP)을 안정 범위로 유지했습니다.'}</p>
            <p style="margin-top:4px;">• ${sim.etco2 > 50 ? '고탄산혈증(ETCO₂ > 50)이 관찰되었습니다. IPPV 기계환기 전환을 권장합니다.' : '환기 및 ETCO₂가 안정적으로 관리되었습니다.'}</p>
          </div>
        `;

        evalSubmitBtn.textContent = '해설 보기';
        document.getElementById('ch4-stamp-asa').textContent = `MAP ${Math.round(sim.map)}`;
        document.getElementById('ch4-stamp-prog').textContent = 'MAINTAIN';
        document.getElementById('ch4-stamp-grade').textContent = currentStageId === 'tutorial' ? '완료' : grade;
        stampOverlayEl.classList.remove('hidden');
        Settings.playStampSound();

        Settings.saveStageResult(4, currentStageId, { grade, score });
        if (chapterCtrl) chapterCtrl.refreshStages();
        Settings.triggerStageGlow();
      });

      async function loadStage(stageId, opts = {}) {
        stopSim();
        const prevCase = currentCase;
        currentStageId = stageId;
        logs = [];
        evaluated = false;
        lastReport = null;
        aiText = null; soapText = null;

        reviewModalEl.classList.add('hidden');
        stampOverlayEl.classList.add('hidden');
        evalSubmitBtn.textContent = '마취 유지 완료';
        document.querySelectorAll('#ch4-btn-vent, #ch4-btn-warm, #ch4-btn-pause, [data-drug4]').forEach((b) => b.classList.remove('active'));
        document.getElementById('ch4-btn-pause').textContent = '일시정지';
        ['ch4-sec-vitals', 'ch4-sec-state', 'ch4-sec-log'].forEach((id) => setMonCollapsed(id, false));
        logListEl.innerHTML = '<div class="mon-empty">수술 시작 대기</div>';
        activateTab('vent');

        if (stageId === 'practice_dog' || stageId === 'practice_cat') {
          if (opts && opts.preserveCase && prevCase) {
            currentCase = prevCase;
          } else {
            sigHeadEl.innerHTML = '<span>환자 생성 중...</span>';
            currentCase = await Data.generatePracticeCase(stageId === 'practice_cat' ? 'cat' : 'dog');
          }
        } else {
          currentCase = Data.getFixedCase(stageId);
        }

        const spKr = currentCase.species === 'cat' ? '고양이' : '개';
        sigHeadEl.innerHTML = `<span>${currentCase.name}</span><span class="ch1-sig-meta">${spKr} · ${currentCase.breed} · ${currentCase.age} · ${currentCase.weight} kg</span>`;
        sim = {
          sec: 0, prog: 0, paused: false,
          hr: currentCase.pe.hr, spo2: 98, etco2: 41, map: Math.max(66, currentCase.pe.bpMap - 6), bt: currentCase.pe.bt,
          iso: 1.5, ippv: false, warm: false, norepi: false, bolusCount: 0, bolusBoost: 0,
          events: 0, actions: 0, stableTicks: 0, totalTicks: 0, ev1: false, ev2: false, ev3: false
        };
        addLog('마취 유지 시작 — 피부 절개 준비');
        renderUI();
        tickTimer = setInterval(stepSim, 1000);
      }

      const chapterCtrl = Settings.initChapterCommon({
        chapterNum: 4,
        chapterTitle: '마취 유지',
        initialStageId: 'tutorial',
        helpSlides: [
          { mark: '1', label: '수술 진행률 및 생체 모니터', desc: 'HR·SpO₂·ETCO₂·MAP·BT와 수술 진행률을 실시간으로 모니터링합니다.' },
          { mark: '2', label: '환기 · 기화기 · 수액 조절', desc: '저혈압·고탄산혈증·저체온에 맞춰 Iso·IPPV·볼루스·가온을 조절합니다.' },
          { mark: '3', label: '응급 약물 & CRI 대응', desc: '통증성 빈맥, 서맥, 저혈압에 적절한 볼루스 및 CRI를 적용합니다.' }
        ],
        tutorialSteps: [
          { title: '1. 실시간 유지 모니터', sel: '#ch4-monitor', onEnter: () => activateTab('vent'), text: '수술 진행률 바와 실시간 바이탈(HR·SpO₂·ETCO₂·MAP·BT), 수술 스토리 로그를 모니터링합니다.' },
          { title: '2. 환기 · 수액 조절', sel: '#ch4-control', onEnter: () => activateTab('vent'), text: '저혈압·고탄산혈증·저체온에 맞춰 Iso 농도, IPPV 기계환기, 수액 볼루스, 능동 가온을 조절합니다.' },
          { title: '3. 약물 · CRI 대응', sel: '#ch4-control', onEnter: () => activateTab('drug'), text: '돌발 서맥·저혈압·통증성 빈맥·부정맥 발생 시 적절한 응급 약물 및 CRI를 투여합니다.' },
          { title: '4. 유지 종료 및 시작', sel: '#ch4-control', onEnter: () => activateTab('finish'), text: '바이탈을 안정적으로 유지한 뒤 마취 유지 완료를 누릅니다. 이제 튜토리얼 케이스를 시작합니다.' }
        ],
        onTutorialFinish: () => activateTab('vent'),
        onSelectStage: (stageId, opts) => loadStage(stageId, opts)
      });

      loadStage('tutorial');
    })();
  </script>
</body>
</html>
