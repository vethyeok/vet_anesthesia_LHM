<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chapter 4. 마취 유지 — 베타 1.1</title>
  <link rel="stylesheet" href="beta11.css" />
  <script src="beta11-settings.js"></script>
</head>
<body>
  <div class="app-shell chapter-shell">
    <header class="top-bar">
      <div class="top-left">
        <div class="top-title">Chapter 4. 마취 유지</div>
      </div>
      <div id="chapter-top-actions" class="top-actions"></div>
    </header>

    <main class="page-body">
      <div class="chapter-split">
        <!-- 좌측(데스크탑): 수술 진행률 + 모니터링 창 -->
        <div class="chapter-col">
          <section class="b-card-soft" id="ch4-progress" style="padding:10px 14px;">
            <div class="b-label" style="margin-bottom:5px;">
              <span>수술 진행률 (스토리 모드)</span>
              <span>절개 · 00%</span>
            </div>
            <div class="prog-track">
              <div class="prog-fill" style="width:32%;"></div>
            </div>
            <div class="muted" style="font-size:11px; margin-top:6px;">
              스토리 로그: 수술 준비 및 피부 절개 단계가 표시될 영역 (돌발 이벤트 시 진행률 연동)
            </div>
          </section>

          <section class="monitor-mock" id="ch4-monitor">
            <div style="display:flex; justify-content:space-between; font-size:10.5px; opacity:0.75;">
              <span>ECG · SpO₂ · ETCO₂ 파형 영역</span>
              <span>00:00 (2×)</span>
            </div>
            <div style="height:56px; border:1px dashed rgba(255,255,255,0.22); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:11px; opacity:0.7;">
              실시간 파형 캔버스 영역
            </div>
            <div class="monitor-row">
              <div class="m-cell"><span class="mk">HR</span><span class="mv">--</span></div>
              <div class="m-cell"><span class="mk">SpO₂</span><span class="mv">--%</span></div>
              <div class="m-cell"><span class="mk">ETCO₂</span><span class="mv">--</span></div>
              <div class="m-cell"><span class="mk">MAP</span><span class="mv">--</span></div>
            </div>
          </section>
        </div>

        <!-- 우측(데스크탑): 조작창 -->
        <div class="chapter-col">
          <div class="step-tabs" role="tablist">
            <button type="button" class="step-tab active" data-pane="p1">환기 · 수액</button>
            <button type="button" class="step-tab" data-pane="p2">CRI · 약물</button>
            <button type="button" class="step-tab" data-pane="p3">스토리 로그</button>
          </div>

          <section class="b-card" data-content="p1">
            <div class="b-label"><span>환기 · 기화기 · 수액 조작 영역</span></div>
            <div class="wire-grid-2">
              <button type="button" class="b-btn b-btn-sm">기화기 (Iso)</button>
              <button type="button" class="b-btn b-btn-sm">O₂ · 환기 모드</button>
              <button type="button" class="b-btn b-btn-sm">수액 속도 · 볼루스</button>
              <button type="button" class="b-btn b-btn-sm">능동 가온 · APL</button>
            </div>
          </section>

          <section class="b-card pane-hidden" data-content="p2">
            <div class="b-label"><span>CRI 펌프 &amp; 응급·특수 약물 영역</span></div>
            <div class="wire-grid-2">
              <button type="button" class="b-btn b-btn-sm">기본 응급 약물</button>
              <button type="button" class="b-btn b-btn-sm">혈액 · 대사 약물</button>
              <button type="button" class="b-btn b-btn-sm">진통 · 진정 볼루스</button>
              <button type="button" class="b-btn b-btn-sm">CRI · 역전 약물</button>
            </div>
          </section>

          <section class="b-card pane-hidden" data-content="p3">
            <div class="b-label"><span>수술 타임라인 &amp; 처치 로그</span></div>
            <div class="wire-box">
              <span class="wire-tag">실시간 스토리 이벤트 로그 영역</span>
              <p class="muted">수술 경과, 돌발 출혈/통증/부정맥 이벤트 및 처치 기록이 시간순으로 쌓입니다.</p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script>
    Beta11Settings.initChapterCommon({
      chapterNum: 4,
      chapterTitle: '마취 유지',
      helpSlides: [
        { mark: '1', label: '모니터 파형 및 수치 판독', desc: 'ECG·SpO₂·ETCO₂·MAP 추이와 수술 진행률 바를 함께 모니터링합니다.' },
        { mark: '2', label: '환기 · 기화기 · 수액 조절', desc: '저혈압·고탄산혈증 발생 시 Iso 감량, 환기 조절, 수액 보충 순으로 대응합니다.' },
        { mark: '3', label: 'CRI & 응급·특수 약물 대응', desc: '돌발 출혈·부정맥·통증·전해질 이상에 맞춰 적절한 CRI와 약물을 투여합니다.' }
      ],
      tutorialSteps: [
        { sel: '#ch4-monitor', text: '실시간 파형과 활력징후 수치를 모니터링하며 이상 징후를 감별합니다.' },
        { sel: '#ch4-progress', text: '수술 진행률 바와 스토리 로그를 통해 현재 수술 단계를 확인합니다.' },
        { sel: '.step-tabs', text: '우측(모바일 하단) 조작창에서 환기·수액·CRI·약물을 조절합니다.' }
      ]
    });
    document.querySelectorAll('.step-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.step-tab').forEach((t) => t.classList.toggle('active', t === tab));
        document.querySelectorAll('[data-content]').forEach((p) => p.classList.toggle('pane-hidden', p.dataset.content !== tab.dataset.pane));
      });
    });
  </script>
</body>
</html>
