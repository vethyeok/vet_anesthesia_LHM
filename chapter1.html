<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chapter 1. 마취 전 검사 — 베타 1.1</title>
  <link rel="stylesheet" href="beta11.css" />
  <script src="beta11-settings.js"></script>
  <script src="beta11-ch1-data.js"></script>
</head>
<body>
  <div class="app-shell chapter-shell">
    <header class="top-bar">
      <div class="top-left">
        <div class="top-title">Chapter 1. 마취 전 검사</div>
      </div>
      <div id="chapter-top-actions" class="top-actions"></div>
    </header>

    <main class="ch1-page-body">
      <div class="ch1-split" id="ch1-split">
        <!-- 좌측(데스크탑) / 상단(모바일): 모니터링창 -->
        <section class="ch1-monitor" id="ch1-monitor" aria-label="환자 모니터링창">
          <div class="ch1-sig-pinned" id="ch1-sig-pinned">
            <div class="ch1-sig-head" id="ch1-sig-head"></div>
            <div class="ch1-cc-line">
              <strong>주호소:</strong> <span id="ch1-cc-val" class="mon-empty">문진 후 확인</span>
            </div>
          </div>

          <div class="ch1-monitor-scroll" id="ch1-monitor-scroll">
            <div class="mon-sec" id="mon-sec-hx">
              <div class="mon-sec-title">
                <span>1. Signalment · 이전 병력</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="mon-sec-hx">접기</button>
              </div>
              <div class="mon-sec-body">
                <div class="sig-hx-list" id="ch1-hx-list">
                  <div class="mon-empty">문진 후 확인</div>
                </div>
              </div>
            </div>

            <div class="mon-sec" id="mon-sec-pe">
              <div class="mon-sec-title">
                <span>2. 신체검사</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="mon-sec-pe">접기</button>
              </div>
              <div class="mon-sec-body">
                <div id="ch1-pe-body"><div class="mon-empty">검사 전</div></div>
              </div>
            </div>

            <div class="mon-sec" id="mon-sec-lab">
              <div class="mon-sec-title">
                <span>3. 혈액검사</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="mon-sec-lab">접기</button>
              </div>
              <div class="mon-sec-body">
                <div id="ch1-lab-body"><div class="mon-empty">검사 전</div></div>
              </div>
            </div>

            <div class="mon-sec" id="mon-sec-img">
              <div class="mon-sec-title">
                <span>4. 영상검사</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="mon-sec-img">접기</button>
              </div>
              <div class="mon-sec-body">
                <div id="ch1-img-body"><div class="mon-empty">검사 전</div></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 우측(데스크탑) / 하단(모바일): 조작창 -->
        <section class="ch1-control" id="ch1-control" aria-label="조작창">
          <div class="ch1-ctrl-handle" id="ch1-ctrl-handle" role="button" tabindex="0" aria-label="조작창 접기 및 펼치기">
            <div class="ch1-ctrl-handle-bar"></div>
          </div>

          <div class="ch1-ctrl-tabs" role="tablist">
            <button type="button" class="b-btn ch1-tab-btn active" data-pane="chat">보호자 문진</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="exam">마취 전 검사</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="eval">예후 평가</button>
          </div>

          <div class="ch1-ctrl-body" id="ch1-ctrl-body">
            <!-- 1. 보호자 문진 -->
            <div class="ch1-pane" data-content="chat">
              <div class="ch1-chat-log" id="ch1-chat-log"></div>
              <form class="ch1-chat-form" id="ch1-chat-form" autocomplete="off">
                <input id="ch1-chat-input" type="text" class="b-input" placeholder="질문을 입력하세요" />
                <button id="ch1-chat-send" type="submit" class="b-btn b-btn-sm" style="flex-shrink:0;">전송</button>
              </form>
            </div>

            <!-- 2. 마취 전 검사 -->
            <div class="ch1-pane pane-hidden" data-content="exam">
              <div class="exam-btn-list" id="ch1-exam-list">
                <div class="exam-item" data-exam="pe">
                  <button type="button" class="b-btn exam-main-btn" data-exam-btn="pe" data-orig-label="신체검사">
                    <span class="exam-fill"></span>
                    <span class="exam-lbl">신체검사</span>
                  </button>
                </div>
                <div class="exam-item" data-exam="lab">
                  <button type="button" class="b-btn exam-main-btn" data-exam-btn="lab" data-orig-label="혈액검사">
                    <span class="exam-fill"></span>
                    <span class="exam-lbl">혈액검사</span>
                  </button>
                </div>
                <div class="exam-item" data-exam="img">
                  <button type="button" class="b-btn exam-main-btn" data-exam-btn="img" data-orig-label="영상검사">
                    <span class="exam-fill"></span>
                    <span class="exam-lbl">영상검사</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- 3. 예후 평가 -->
            <div class="ch1-pane pane-hidden" data-content="eval">
              <div>
                <div class="eval-sec-lbl">ASA Grade</div>
                <div class="asa-grid" id="ch1-asa-grid">
                  <button type="button" class="b-btn asa-btn" data-asa="1">1</button>
                  <button type="button" class="b-btn asa-btn" data-asa="2">2</button>
                  <button type="button" class="b-btn asa-btn" data-asa="3">3</button>
                  <button type="button" class="b-btn asa-btn" data-asa="4">4</button>
                  <button type="button" class="b-btn asa-btn" data-asa="5">5</button>
                  <button type="button" class="b-btn asa-btn" id="ch1-asa-e" data-asa-e="1">E</button>
                </div>
              </div>

              <div>
                <div class="eval-sec-lbl">예후 평가</div>
                <div class="prog-grid" id="ch1-prog-grid">
                  <button type="button" class="b-btn prog-btn" data-prog="Good">양호(Good)</button>
                  <button type="button" class="b-btn prog-btn" data-prog="Fair">보통(Fair)</button>
                  <button type="button" class="b-btn prog-btn" data-prog="Guarded">주의(Guarded)</button>
                  <button type="button" class="b-btn prog-btn" data-prog="Poor">불량(Poor)</button>
                  <button type="button" class="b-btn prog-btn span-2" data-prog="Grave">위독(Grave)</button>
                </div>
              </div>

              <div style="margin-top:auto; padding-top:6px;">
                <button type="button" class="b-btn" id="ch1-eval-submit" style="width:100%; height:44px; border-radius:14px;">평가 확정</button>
              </div>
            </div>

            <!-- 평가 확정 시 50% 투명도 빨간 사각형 도장 애니메이션 -->
            <div id="ch1-stamp-overlay" class="ch1-stamp-overlay hidden" aria-live="polite">
              <div class="ch1-stamp-asa" id="ch1-stamp-asa"></div>
              <div class="ch1-stamp-prog" id="ch1-stamp-prog"></div>
              <div class="ch1-stamp-grade" id="ch1-stamp-grade"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 실패 팝업 (F 등급 또는 보호자 신뢰 붕괴 시 — 배경 클릭/ESC로 닫히지 않음) -->
  <div id="ch1-fail-modal" class="modal-backdrop no-dismiss hidden" role="dialog" aria-modal="true" aria-labelledby="ch1-fail-title" style="backdrop-filter:blur(6px); z-index:105;">
    <div class="modal-card" style="text-align:center;">
      <h2 id="ch1-fail-title" class="font-maru" style="font-size:20px; font-weight:700; color:#dc2626; margin-bottom:8px;">진료 중단</h2>
      <p id="ch1-fail-desc" class="muted" style="font-size:15px; font-weight:600; line-height:1.5; margin-bottom:16px;"></p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button id="ch1-fail-review" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">해설 보기</button>
        <button id="ch1-fail-restart" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">재시작</button>
        <button id="ch1-fail-main" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">메인화면</button>
      </div>
    </div>
  </div>

  <!-- 해설 보기 팝업 (오답노트 · AI 로그 분석 · SOAP 분석) -->
  <div id="ch1-review-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ch1-review-title" style="backdrop-filter:blur(6px); z-index:120;">
    <div class="modal-card" style="max-width:420px; max-height:84dvh; display:flex; flex-direction:column;">
      <h2 id="ch1-review-title" class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">해설 보기</h2>
      <div class="step-tabs" id="ch1-review-tabs" role="tablist" style="margin-bottom:10px; flex-shrink:0;">
        <button type="button" class="step-tab active" data-rv-tab="wrong">오답노트</button>
        <button type="button" class="step-tab" data-rv-tab="ai">AI 로그 분석</button>
        <button type="button" class="step-tab" data-rv-tab="soap">SOAP 분석</button>
      </div>
      <div id="ch1-review-body" style="flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:180px; padding-right:2px;">
        <div id="ch1-rv-wrong" data-rv-pane="wrong"></div>
        <div id="ch1-rv-ai" data-rv-pane="ai" class="pane-hidden"></div>
        <div id="ch1-rv-soap" data-rv-pane="soap" class="pane-hidden"></div>
      </div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch1-review-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const Data = window.Beta11Ch1Data;
      const Settings = window.Beta11Settings;
      if (!Data || !Settings) return;

      const PROG_ORDER = ['Good', 'Fair', 'Guarded', 'Poor', 'Grave'];

      const splitEl = document.getElementById('ch1-split');
      const monitorScrollEl = document.getElementById('ch1-monitor-scroll');
      const sigHeadEl = document.getElementById('ch1-sig-head');
      const ccValEl = document.getElementById('ch1-cc-val');
      const hxListEl = document.getElementById('ch1-hx-list');
      const peBodyEl = document.getElementById('ch1-pe-body');
      const labBodyEl = document.getElementById('ch1-lab-body');
      const imgBodyEl = document.getElementById('ch1-img-body');
      const ctrlHandleEl = document.getElementById('ch1-ctrl-handle');
      const chatLogEl = document.getElementById('ch1-chat-log');
      const chatFormEl = document.getElementById('ch1-chat-form');
      const chatInputEl = document.getElementById('ch1-chat-input');
      const chatSendBtn = document.getElementById('ch1-chat-send');
      const stampOverlayEl = document.getElementById('ch1-stamp-overlay');
      const stampAsaEl = document.getElementById('ch1-stamp-asa');
      const stampProgEl = document.getElementById('ch1-stamp-prog');
      const stampGradeEl = document.getElementById('ch1-stamp-grade');
      const evalSubmitBtn = document.getElementById('ch1-eval-submit');

      let currentStageId = 'tutorial';
      let currentCase = null;
      let chatHistory = [];
      let chatBusy = false;
      let revealedKeys = new Set();
      let examState = { pe: 'idle', lab: 'idle', img: 'idle' }; // idle | loading | ready | done
      let examTimers = [];
      let typingTimers = [];
      let selectedAsa = null;
      let selectedEmerg = false;
      let selectedProg = null;
      let evaluated = false;
      let postExamExplained = false;
      let examBeforeChat = false;
      let ownerMood = 85;
      let ownerAborted = false;
      let recentPracticeNames = [];

      function clearAllTimers() {
        examTimers.forEach((id) => clearTimeout(id));
        examTimers = [];
        typingTimers.forEach((id) => clearTimeout(id));
        typingTimers = [];
      }

      function setCollapsed(collapsed) {
        if (window.innerWidth >= 960) {
          splitEl.classList.remove('ctrl-collapsed');
          return;
        }
        splitEl.classList.toggle('ctrl-collapsed', Boolean(collapsed));
      }

      /* Thin Gray Bar Drag Down -> Collapse Control Body / Drag Up -> Expand (Mobile only) */
      let handleStartY = 0;
      let handleDragging = false;
      let handleMoved = false;
      ctrlHandleEl.addEventListener('pointerdown', (e) => {
        if (window.innerWidth >= 960) return;
        handleDragging = true;
        handleMoved = false;
        handleStartY = e.clientY;
        if (ctrlHandleEl.setPointerCapture) ctrlHandleEl.setPointerCapture(e.pointerId);
      });
      ctrlHandleEl.addEventListener('pointermove', (e) => {
        if (!handleDragging) return;
        const dy = e.clientY - handleStartY;
        if (Math.abs(dy) > 20) {
          handleMoved = true;
          setCollapsed(dy > 0);
        }
      });
      const endHandleDrag = () => {
        if (!handleDragging) return;
        handleDragging = false;
        if (!handleMoved) setCollapsed(!splitEl.classList.contains('ctrl-collapsed'));
      };
      ctrlHandleEl.addEventListener('pointerup', endHandleDrag);
      ctrlHandleEl.addEventListener('pointercancel', endHandleDrag);
      window.addEventListener('resize', () => {
        if (window.innerWidth >= 960) splitEl.classList.remove('ctrl-collapsed');
      });

      /* Vertical pointer-drag scrolling on Monitoring Window for desktop mouse convenience */
      let monDrag = false;
      let monStartY = 0;
      let monStartTop = 0;
      monitorScrollEl.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') return;
        monDrag = true;
        monStartY = e.clientY;
        monStartTop = monitorScrollEl.scrollTop;
      });
      window.addEventListener('pointermove', (e) => {
        if (!monDrag) return;
        monitorScrollEl.scrollTop = monStartTop - (e.clientY - monStartY);
      });
      window.addEventListener('pointerup', () => { monDrag = false; });

      /* Monitoring Section Fold / Unfold Buttons */
      function setMonCollapsed(secId, collapsed) {
        const sec = document.getElementById(secId);
        if (!sec) return;
        sec.classList.toggle('is-collapsed', Boolean(collapsed));
        const btn = sec.querySelector('.mon-toggle-btn');
        if (btn) btn.textContent = collapsed ? '열기' : '접기';
      }
      document.querySelectorAll('[data-mon-toggle]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const secId = btn.dataset.monToggle;
          const sec = document.getElementById(secId);
          if (!sec) return;
          Settings.playTone(500, 0.04, 0.025);
          setMonCollapsed(secId, !sec.classList.contains('is-collapsed'));
        });
      });

      /* Control Menu Tabs */
      function activateTab(paneName) {
        setCollapsed(false);
        document.querySelectorAll('.ch1-tab-btn').forEach((b) => {
          b.classList.toggle('active', b.dataset.pane === paneName);
        });
        document.querySelectorAll('[data-content]').forEach((p) => {
          p.classList.toggle('pane-hidden', p.dataset.content !== paneName);
        });
      }
      document.querySelectorAll('.ch1-tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          Settings.playTone(520, 0.04, 0.025);
          activateTab(btn.dataset.pane);
        });
      });

      /* Typing animation in Monitoring Window — keeps default monitor font color */
      function typeIntoElement(el, fullText) {
        el.textContent = '';
        el.classList.remove('mon-empty');
        let idx = 0;
        function step() {
          if (idx <= fullText.length) {
            el.textContent = fullText.slice(0, idx);
            idx += 1;
            const t = setTimeout(step, 22);
            typingTimers.push(t);
          }
        }
        step();
      }

      function revealSignalmentKeys(keys) {
        if (!currentCase || !keys.length) return;
        let newlyAdded = false;
        keys.forEach((k) => {
          if (revealedKeys.has(k)) return;
          revealedKeys.add(k);
          newlyAdded = true;
          if (k === 'chiefComplaint') {
            typeIntoElement(ccValEl, currentCase.chiefComplaint);
          } else {
            const h = (currentCase.history || []).find((item) => item.key === k);
            if (!h) return;
            setMonCollapsed('mon-sec-hx', false);
            const emptyNode = hxListEl.querySelector('.mon-empty');
            if (emptyNode) emptyNode.remove();
            const row = document.createElement('div');
            row.className = 'sig-hx-row';
            row.innerHTML = `<span class="sig-hx-k">${h.label}:</span> <span class="sig-hx-v"></span>`;
            hxListEl.appendChild(row);
            typeIntoElement(row.querySelector('.sig-hx-v'), h.text);
          }
        });
        if (newlyAdded) Settings.playTone(640, 0.05, 0.025);
      }

      /* Chat Helpers — Important Signalment info highlighted in Blue inside Chat Bubble */
      function escapeHtml(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatOwnerChatHtml(text, caseObj, hits) {
        const safe = escapeHtml(text);
        if (!caseObj || !hits || !hits.length) return safe;

        // Highlight sentences/clauses containing discovered Signalment facts or keywords in blue
        const phrases = [];
        if (hits.includes('chiefComplaint') && caseObj.chiefComplaint) {
          phrases.push(caseObj.chiefComplaint);
        }
        (caseObj.history || []).forEach((h) => {
          if (hits.includes(h.key)) {
            if (h.text) phrases.push(h.text);
            (h.keywords || []).forEach((kw) => { if (kw && kw.length >= 2) phrases.push(kw); });
          }
        });

        const parts = String(text).split(/([.!?]\s+)/);
        let anyHighlighted = false;
        const out = parts.map((seg) => {
          if (!seg || /^[.!?]\s+$/.test(seg)) return escapeHtml(seg);
          const low = seg.toLowerCase();
          const matched = phrases.some((ph) => low.includes(String(ph).toLowerCase()));
          if (matched) {
            anyHighlighted = true;
            return `<span class="chat-sig-blue">${escapeHtml(seg)}</span>`;
          }
          return escapeHtml(seg);
        }).join('');

        return anyHighlighted ? out : `<span class="chat-sig-blue">${safe}</span>`;
      }

      function appendBubble(sender, text, htmlOverride = null) {
        const row = document.createElement('div');
        row.className = `chat-row ${sender}`;
        const b = document.createElement('div');
        b.className = 'chat-bubble';
        if (htmlOverride != null) b.innerHTML = htmlOverride;
        else b.textContent = text;
        row.appendChild(b);
        chatLogEl.appendChild(row);
        chatLogEl.scrollTop = chatLogEl.scrollHeight;
      }

      function setChatLocked(locked) {
        chatInputEl.disabled = Boolean(locked);
        chatSendBtn.disabled = Boolean(locked);
        chatInputEl.placeholder = locked ? '평가가 완료되어 문진이 종료되었습니다' : '질문을 입력하세요';
      }

      async function handleChatSend(e) {
        e.preventDefault();
        if (evaluated || chatBusy || !currentCase) return;
        const q = chatInputEl.value.trim();
        if (!q) return;

        chatInputEl.value = '';
        appendBubble('vet', q);
        chatHistory.push({ sender: 'vet', text: q });
        chatBusy = true;
        chatSendBtn.disabled = true;

        const doneExamsCount = ['pe', 'lab', 'img'].filter((k) => examState[k] === 'done').length;
        const isStatusExplain = doneExamsCount > 0 && !evaluated && /검사|결과|상태|수치|정상|이상|신체|혈액|영상|방사선|초음파|청진|심장|신장|담낭|폐|위험|마취|예후|ASA|안정|응급|좋|나쁘|괜찮|설명|소견/i.test(q);
        if (isStatusExplain) {
          postExamExplained = true;
        }

        const labSummaryStr = doneExamsCount > 0
          ? `실시 완료 검사(${doneExamsCount}/3) — PE: BT ${currentCase.pe.bt}, BP ${currentCase.pe.bpSys}/${currentCase.pe.bpDia}(${currentCase.pe.bpMap}), HR ${currentCase.pe.hr}, 청진(${currentCase.pe.auscHeart || '정상'}) / 흉부 VHS ${currentCase.imaging && currentCase.imaging.thoracic ? currentCase.imaging.thoracic.vhs : '-'}`
          : '';

        const isProfane = /씨발|시발|병신|미친|개새|지랄|꺼져|닥쳐|죽어|좆|fuck|shit|bitch|새끼|멍청이|쓰레기|무식|짜증나게/i.test(q);
        const isRudeOrDismissive = /^(네|응|음|ㅋㅋ+|ㅎㅎ+|몰라|몰라요|알아서|귀찮|시끄|대충|아몰랑|글쎄|뭐래)[\s.?!]*$/i.test(q) || /귀찮|대충|알아서\s*하|상관없|됐어요|그만\s*물어|입\s*닫/.test(q);
        const prevVetMsgs = chatHistory.filter((m) => m.sender === 'vet').slice(0, -1).map((m) => m.text.trim());
        const isRepeated = prevVetMsgs.includes(q);

        let reply = '';
        let aiAborted = false;
        if (isProfane) {
          aiAborted = true;
          reply = '지금 보호자한테 무슨 말씀을 그렇게 하시는 거예요?! 이런 곳에는 절대 우리 아이 못 맡깁니다. 진료 취소하고 나가겠습니다!';
        } else {
          try {
            const resp = await fetch('/api/ai', {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
              body: JSON.stringify({
                task: 'roleplay',
                role: 'owner_preop',
                species: currentCase.species === 'cat' ? '고양이' : '개',
                caseName: `${currentCase.name} (${currentCase.breed}, ${currentCase.age}, ${currentCase.weight}kg)`,
                asa: `ASA ${currentCase.trueAsa}${currentCase.trueEmergency ? '-E' : ''}`,
                caseDesc: `${currentCase.chiefComplaint} / ${(currentCase.history || []).map((h) => h.label + ': ' + h.text).join(', ')}`,
                clue: currentCase.ownerClue || '',
                labSummary: labSummaryStr,
                ownerPersonality: currentCase.ownerPersonality || 'neutral',
                knowledgeLevel: currentCase.ownerLevel || 2,
                chatHistory: chatHistory.slice(-12),
                question: q
              })
            });
            if (resp.ok) {
              const data = await resp.json();
              if (data && data.text) reply = String(data.text).trim();
            }
          } catch {}

          if (!reply) {
            if (isRudeOrDismissive) {
              reply = '선생님, 지금 너무 성의 없게 말씀하시는 거 아니에요? 아이 맡기기 불안해지네요.';
            } else if (isStatusExplain) {
              reply = `검사 결과와 ${currentCase.name} 현재 상태 자세히 설명해 주셔서 감사합니다 선생님. 평가 마무리 부탁드립니다.`;
            } else {
              reply = Data.buildOfflineOwnerReply(currentCase, q);
            }
          }
          if (/^\[ABORT\]/i.test(reply)) {
            aiAborted = true;
          }
        }

        const cleanReply = reply.replace(/^\[ABORT\]\s*/i, '');
        const hits = aiAborted ? [] : Data.detectDiscoveredKeys(currentCase, cleanReply);
        const ownerHtml = formatOwnerChatHtml(cleanReply, currentCase, hits);
        appendBubble('owner', cleanReply, ownerHtml);
        chatHistory.push({ sender: 'owner', text: cleanReply });

        revealSignalmentKeys(hits);

        // Update hidden owner mood gauge (never displayed in UI)
        if (aiAborted) {
          ownerAborted = true;
          ownerMood = 0;
        } else {
          if (isRudeOrDismissive) ownerMood -= 22;
          else if (isRepeated) ownerMood -= 12;
          else if (/짜증|불안해지|불신|성의\s*없|무례|답답|기분\s*나쁘|못\s*믿|나가겠/i.test(cleanReply)) ownerMood -= 15;
          else if (hits.length > 0 || isStatusExplain) ownerMood += 4;
          ownerMood = Math.max(0, Math.min(100, ownerMood));
        }

        chatBusy = false;
        if (ownerAborted || ownerMood <= 0) {
          triggerImmediateTrustFailure();
          return;
        }
        if (!evaluated) {
          chatSendBtn.disabled = false;
          chatInputEl.focus();
        }
      }

          return `<tr><td>${label}</td><td class="lab-val ${cls}">${val}${unit ? ' ' + unit : ''}${fl ? ' ' + fl : ''}</td><td class="lab-ref">${r}</td></tr>`;

      /* Button-Integrated Buffered Loading (PE 3s, Lab 2s, Img 2s) -> '검사 완료' + Monitor Render -> Fade Out -> Darkened Original Label */
      function startExam(type) {
        if (!currentCase || examState[type] !== 'idle') return;
        if (!chatHistory.some((m) => m.sender === 'vet')) {
          examBeforeChat = true;
        }
        examState[type] = 'loading';
        Settings.playTone(540, 0.05, 0.03);

        const btn = document.querySelector(`[data-exam-btn="${type}"]`);
        const fillEl = btn.querySelector('.exam-fill');
        const lblEl = btn.querySelector('.exam-lbl');
        const origLabel = btn.dataset.origLabel || lblEl.textContent;

        btn.disabled = true;
        btn.classList.add('exam-loading');
        fillEl.style.width = '0%';
        lblEl.textContent = '검사중 0%';

        // Exact buffered schedules: PE = 3000ms (3초), Lab & Img = 2000ms (2초)
        const steps = type === 'pe'
          ? [
              [14, 240], [28, 260], [30, 520], [52, 280], [66, 260],
              [68, 540], [84, 260], [88, 360], [100, 280]
            ]
          : [
              [18, 160], [34, 180], [36, 360], [62, 200],
              [65, 420], [86, 180], [90, 280], [100, 220]
            ];
        let stepIdx = 0;

        function nextStep() {
          if (stepIdx >= steps.length) {
            examState[type] = 'done';
            lblEl.textContent = '검사 완료';
            fillEl.style.width = '100%';
            Settings.playTone(700, 0.07, 0.035);

            // Display results immediately in Monitoring window
            if (type === 'pe') {
              setMonCollapsed('mon-sec-pe', false);
              renderPE(currentCase);
              document.getElementById('mon-sec-pe').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else if (type === 'lab') {
              setMonCollapsed('mon-sec-lab', false);
              renderLab(currentCase);
              document.getElementById('mon-sec-lab').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else if (type === 'img') {
              setMonCollapsed('mon-sec-img', false);
              renderImaging(currentCase);
              document.getElementById('mon-sec-img').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // Fade out '검사 완료' & gauge, then settle into darkened disabled button with original label
            const tFade = setTimeout(() => {
              btn.classList.add('exam-fading');
              const tRestore = setTimeout(() => {
                fillEl.style.width = '0%';
                lblEl.textContent = origLabel;
                btn.classList.remove('exam-loading', 'exam-fading');
                btn.classList.add('exam-done');
                btn.disabled = true;
              }, 340);
              examTimers.push(tRestore);
            }, 550);
            examTimers.push(tFade);
            return;
          }
          const [pct, delay] = steps[stepIdx++];
          const t = setTimeout(() => {
            lblEl.textContent = `검사중 ${pct}%`;
            fillEl.style.width = `${pct}%`;
            nextStep();
          }, delay);
          examTimers.push(t);
        }
        nextStep();
      }

      document.querySelectorAll('[data-exam-btn]').forEach((btn) => {

      /* Distance Penalty: 1 step off = -5, 2 steps = -6, 3 steps = -7, 4 steps = -8 */
      function distancePenalty(diff) {
        return diff > 0 ? 4 + diff : 0;
      }

      function scoreToGrade(score) {
        if (score >= 95) return 'S';
        if (score >= 90) return 'A';
        if (score >= 80) return 'B';
        if (score >= 70) return 'C';
        if (score >= 50) return 'D';
        return 'F';
      }

      /* 신뢰 붕괴 감점: 70% 이상 0점, 60~69% -5점, 50~59% -7점, 40~49% -9점, 30~39% -11점, 29% 미만 -15점, 욕설/폭언/진료 중단 -100점 */
      function moodPenalty(mood, aborted) {
        if (aborted || mood <= 0) return 100;
        if (mood >= 70) return 0;
        if (mood >= 60) return 5;
        if (mood >= 50) return 7;
        if (mood >= 40) return 9;
        if (mood >= 30) return 11;
        return 15;
      }

      function buildOfflineWrongNoteHtml(rep) {
        const c = rep.caseObj;
        const trueAsaStr = `ASA ${c.trueAsa}${c.trueEmergency ? 'E' : ''}`;
        const chosenAsaStr = rep.chosenAsa ? `ASA ${rep.chosenAsa}${rep.chosenEmerg ? 'E' : ''}` : '미평가';
        const chosenProgStr = rep.chosenProg || '미평가';
        const asaOk = rep.chosenAsa && rep.asaDiff === 0 && Boolean(rep.chosenEmerg) === Boolean(c.trueEmergency);
        const progOk = rep.chosenProg && rep.progDiff === 0;
        const missedExams = [
          examState.pe !== 'done' ? '신체검사' : null,
          examState.lab !== 'done' ? '혈액검사' : null,
          examState.img !== 'done' ? '영상검사' : null
        ].filter(Boolean);
        const missedHx = [];
        if (!revealedKeys.has('chiefComplaint')) missedHx.push('주호소');
        (c.history || []).forEach((h) => {
          if (!revealedKeys.has(h.key)) missedHx.push(h.label);
        });
        const trustPen = Number(rep.trustPen || 0);
        const trustText = rep.ownerAborted
          ? `<span style="color:#b91c1c; font-weight:600;">보호자 진료 중단 (-100점)</span>`
          : trustPen > 0
            ? `<span style="color:#b91c1c; font-weight:600;">보호자 기분 악화 (-${trustPen}점)</span>`
            : '없음 (양호)';

        return `
          <div class="b-card-soft" style="padding:12px; display:flex; flex-direction:column; gap:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-family:var(--font-display); font-size:15px;">최종 평가 결과</strong>
              <strong style="font-family:var(--font-display); font-size:17px; color:#dc2626;">${rep.score}점 (${rep.grade})</strong>
            </div>
            <div class="modal-row"><span class="muted">ASA 판정</span><span>내 답안 <strong>${chosenAsaStr}</strong> / 정답 <strong>${trueAsaStr}</strong> ${rep.ownerAborted ? '(중단)' : (asaOk ? '(정답)' : `(-${rep.asaPen}점)`)}</span></div>
            <div class="modal-row"><span class="muted">예후 판정</span><span>내 답안 <strong>${chosenProgStr}</strong> / 정답 <strong>${c.truePrognosis}</strong> ${rep.ownerAborted ? '(중단)' : (progOk ? '(정답)' : `(-${rep.progPen}점)`)}</span></div>
            <div class="modal-row"><span class="muted">미실시 검사</span><span>${missedExams.length ? `${missedExams.join(', ')}${rep.ownerAborted ? '' : ` (-${rep.examPen}점)`}` : '없음 (모두 완료)'}</span></div>
            <div class="modal-row"><span class="muted">미확인 문진</span><span>${missedHx.length ? `${missedHx.join(', ')}${rep.ownerAborted ? '' : ` (-${rep.cluePen}점)`}` : '없음 (모두 확인)'}</span></div>
            <div class="modal-row"><span class="muted">검사 후 상태 설명</span><span>${rep.postExamExplained ? '완료' : `미실시${rep.ownerAborted ? '' : ` (-${rep.explainPen}점)`}`}</span></div>
            <div class="modal-row"><span class="muted">신뢰 붕괴</span><span>${trustText}</span></div>
            ${rep.examBeforeChat ? `<div class="modal-row"><span class="muted">진료 순서</span><span style="color:#b91c1c;">문진 전 검사 시행${rep.ownerAborted ? '' : ` (-${rep.orderPen}점)`}</span></div>` : ''}
          </div>
          <div class="b-card" style="padding:12px; margin-top:8px; line-height:1.55;">
            <div class="b-label"><span>핵심 임상 해설</span></div>
            <p><strong>${c.name}</strong> (${c.breed}, ${c.age}, ${c.weight} kg) — ${c.chiefComplaint}</p>
            <p style="margin-top:6px;">• 신체검사: BT ${c.pe.bt}°C, BP #${c.pe.cuff} ${c.pe.bpSys}/${c.pe.bpDia}(${c.pe.bpMap}), HR ${c.pe.hr}, RR ${c.pe.rr}, 심잡음(${c.pe.auscHeart || '정상'}), 폐음(${c.pe.auscLung || '정상'}), 복명음(${c.pe.auscBowel || '정상'})</p>
            <p style="margin-top:4px;">• 권장 판정: <strong>${trueAsaStr} · ${c.truePrognosis}</strong></p>
          </div>
        `;
      }

      function buildChapter1AiPayload(task) {
        const c = lastEvalReport.caseObj;
        const spKr = c.species === 'cat' ? '고양이' : '개';
        const doneExams = ['pe', 'lab', 'img'].filter((k) => examState[k] === 'done').map((k) => ({ pe: '신체검사', lab: '혈액검사', img: '영상검사' }[k]));
        const studentAsaStr = lastEvalReport.chosenAsa ? `ASA ${lastEvalReport.chosenAsa}${lastEvalReport.chosenEmerg ? 'E' : ''}` : '미평가';
        const studentProgStr = lastEvalReport.chosenProg || '미평가';
        return {
          task,
          phase: 'chapter1',
          species: spKr,
          scenario: `${c.name} (${c.breed}, ${c.age}, ${c.weight}kg, ${c.sex}) - ${c.chiefComplaint}`,
          chatSummary: chatHistory.map((m) => `${m.sender === 'vet' ? '수의사' : '보호자'}: ${m.text}`).slice(-10).join(' | '),
          examSummary: `실시 검사: ${doneExams.join(', ') || '없음'} / 검사 후 상태 설명: ${lastEvalReport.postExamExplained ? '완료' : '미실시'} / 신뢰 붕괴 감점: -${lastEvalReport.trustPen || 0}점${lastEvalReport.ownerAborted ? ' (보호자 진료 중단)' : ''} / PE: BT ${c.pe.bt}, BP ${c.pe.bpSys}/${c.pe.bpDia}(${c.pe.bpMap}), HR ${c.pe.hr}, RR ${c.pe.rr}, CRT ${c.pe.crt}, MMC ${c.pe.mmc}, 심음 ${c.pe.auscHeart || '-'}, 폐음 ${c.pe.auscLung || '-'}, 복명음 ${c.pe.auscBowel || '-'} / 흉부 X-ray: VHS ${c.imaging && c.imaging.thoracic ? c.imaging.thoracic.vhs : '-'}`,
          studentEval: `${studentAsaStr} / ${studentProgStr} (${lastEvalReport.score}점, ${lastEvalReport.grade})`,
          trueEval: `ASA ${c.trueAsa}${c.trueEmergency ? 'E' : ''} / ${c.truePrognosis}`
        };
      }

      async function runAiLogAnalysis() {
        if (!lastEvalReport) return;
        rvAiEl.innerHTML = `<div class="b-card-soft" style="padding:14px; text-align:center;">AI 로그 분석 중...</div>`;
        let text = '';
        try {
          const resp = await fetch('/api/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: JSON.stringify(buildChapter1AiPayload('debrief'))
          });
          if (resp.ok) {
            const data = await resp.json();
            text = (data && (data.analysis || data.text)) ? String(data.analysis || data.text).trim() : '';
          }
        } catch {}

        if (!text) {
          const c = lastEvalReport.caseObj;
          const chosenSummary = lastEvalReport.chosenAsa
            ? `ASA ${lastEvalReport.chosenAsa}${lastEvalReport.chosenEmerg ? 'E' : ''}·${lastEvalReport.chosenProg}`
            : '미평가 (진료 중단)';
          const trustNote = lastEvalReport.ownerAborted
            ? '보호자와의 신뢰가 붕괴되어 진료가 중단되었습니다. 공감적이고 전문적인 문진 태도가 필수입니다.'
            : (lastEvalReport.trustPen > 0 ? `보호자 기분 악화로 신뢰 붕괴 감점(-${lastEvalReport.trustPen}점)이 발생했습니다.` : '보호자와의 라포 형성은 양호했습니다.');
          text = `1) 문진 및 검사 수행: 총 ${chatHistory.filter((m) => m.sender === 'vet').length}회 문진, ${['pe', 'lab', 'img'].filter((k) => examState[k] === 'done').length}/3종 검사 완료, 검사 후 보호자 상태 설명 ${lastEvalReport.postExamExplained ? '완료' : '미실시'}.\n2) 보호자 신뢰도: ${trustNote}\n3) 판정 비교: ${chosenSummary} 대비 기준은 ASA ${c.trueAsa}${c.trueEmergency ? 'E' : ''}·${c.truePrognosis}입니다.\n4) 보완 포인트: ${c.chiefComplaint} 환자의 청진(${c.pe.auscHeart || '정상'}) 및 주요 혈액·영상 이상 소견을 보호자에게 설명하고 마취 계획에 반영하세요.`;
        }
        aiAnalysisText = text;
        rvAiEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(text)}</div>`;
      }

      async function runSoapAnalysis() {
        if (!lastEvalReport) return;
        rvSoapEl.innerHTML = `<div class="b-card-soft" style="padding:14px; text-align:center;">AI SOAP 분석 생성 중...</div>`;
        let text = '';
        try {
          const resp = await fetch('/api/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: JSON.stringify(buildChapter1AiPayload('soap_record'))
          });
          if (resp.ok) {
            const data = await resp.json();
            text = (data && (data.text || data.analysis)) ? String(data.text || data.analysis).trim() : '';
          }
        } catch {}

        if (!text) {
          const c = lastEvalReport.caseObj;
          const spKr = c.species === 'cat' ? '고양이' : '개';
          text = `S (Subjective)\n- ${c.name} (${spKr}, ${c.breed}, ${c.age}, ${c.weight}kg, ${c.sex})\n- 주호소: ${c.chiefComplaint}\n- 병력: ${(c.history || []).map((h) => h.label + ' - ' + h.text).join(' / ')}\n\nO (Objective)\n- PE: BT ${c.pe.bt}°C, BP #${c.pe.cuff} ${c.pe.bpSys}/${c.pe.bpDia}(${c.pe.bpMap}) mmHg, HR ${c.pe.hr}/min, RR ${c.pe.rr}/min, CRT ${c.pe.crt}s, MMC ${c.pe.mmc}\n- 청진: 심음(${c.pe.auscHeart || '정상'}), 폐음(${c.pe.auscLung || '정상'}), 복명음(${c.pe.auscBowel || '정상'})\n- 영상: 흉부 X-ray VHS ${c.imaging && c.imaging.thoracic ? c.imaging.thoracic.vhs : '-'}, ${c.imaging && c.imaging.thoracic ? c.imaging.thoracic.lung : '-'}\n\nA (Assessment)\n- 마취 위험도: ASA ${c.trueAsa}${c.trueEmergency ? 'E' : ''} / 예후: ${c.truePrognosis}\n\nP (Plan)\n- 확인된 기저 이상 교정 및 위험도에 맞춘 마취 전처치·유도·모니터링 플랜 수립 (Chapter 2 연계)`;
        }
        soapAnalysisText = text;
        rvSoapEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(text)}</div>`;
      }

      evalSubmitBtn.addEventListener('click', () => {
        if (!currentCase) return;
        if (evaluated) {
          Settings.playTone(540, 0.05, 0.03);
          setReviewTab('wrong');
          reviewModalEl.classList.remove('hidden');
          return;
        }
        if (!selectedAsa || !selectedProg) {
          Settings.playTone(320, 0.08, 0.03);
          return;
        }
        evaluated = true;
        setChatLocked(true);

        let score = 100;
        const examsDone = ['pe', 'lab', 'img'].filter((k) => examState[k] === 'done').length;
        const examPen = (3 - examsDone) * 10;
        score -= examPen;

        const totalClues = 1 + (currentCase.history ? currentCase.history.length : 0);
        const missedClues = Math.max(0, totalClues - revealedKeys.size);
        const cluePen = Math.min(15, missedClues * 4);
        score -= cluePen;

        const explainPen = postExamExplained ? 0 : 10;
        score -= explainPen;

        const orderPen = examBeforeChat ? 5 : 0;
        score -= orderPen;

        const asaDiff = Math.abs(selectedAsa - Number(currentCase.trueAsa || 1));
        const emergPen = Boolean(selectedEmerg) !== Boolean(currentCase.trueEmergency) ? 10 : 0;
        const asaPen = distancePenalty(asaDiff) + emergPen;
        score -= asaPen;

        const trueProgIdx = Math.max(0, PROG_ORDER.indexOf(currentCase.truePrognosis || 'Good'));
        const chosenProgIdx = Math.max(0, PROG_ORDER.indexOf(selectedProg));
        const progDiff = Math.abs(chosenProgIdx - trueProgIdx);
        const progPen = distancePenalty(progDiff);
        score -= progPen;

        const trustPen = moodPenalty(ownerMood, ownerAborted);
        score -= trustPen;

        score = Math.max(0, Math.min(100, Math.round(score)));
        const grade = scoreToGrade(score);

        lastEvalReport = {
          caseObj: currentCase,
          chosenAsa: selectedAsa,
          chosenEmerg: selectedEmerg,
          chosenProg: selectedProg,
          asaDiff,
          progDiff,
          asaPen,
          progPen,
          examPen,
          cluePen,
          explainPen,
          postExamExplained,
          orderPen,
          examBeforeChat,
          trustPen,
          ownerMood,
          ownerAborted,
          score,
          grade
        };
        aiAnalysisText = null;
        soapAnalysisText = null;
        rvWrongEl.innerHTML = buildOfflineWrongNoteHtml(lastEvalReport);

        // Change '평가 확정' button -> '해설 보기'
        evalSubmitBtn.textContent = '해설 보기';
        evalSubmitBtn.disabled = false;

        // Slam 50%-opacity Red Rectangular Stamp inside Control Window
        stampAsaEl.textContent = `ASA ${selectedAsa}${selectedEmerg ? 'E' : ''}`;
        stampProgEl.textContent = selectedProg;
        stampGradeEl.textContent = currentStageId === 'tutorial' ? '완료' : grade;
        stampOverlayEl.classList.remove('hidden');

        // Save progress (D+ unlocks next stage; F triggers failure modal)
        Settings.saveStageResult(1, currentStageId, { grade, score });
        if (chapterCtrl) chapterCtrl.refreshStages();

        if (currentStageId !== 'tutorial' && grade === 'F') {
          openFailModal(score, grade);
        } else {
          Settings.playTone(760, 0.12, 0.05);
          Settings.triggerStageGlow();
        }
      });

      /* Load a Stage (Tutorial / 10 Fixed Cases / AI Practice Dog & Cat) */
      async function loadStage(stageId) {
        clearAllTimers();
        currentStageId = stageId;
        chatHistory = [];
        chatBusy = false;
        revealedKeys = new Set();
        examState = { pe: 'idle', lab: 'idle', img: 'idle' };
        selectedAsa = null;
        selectedEmerg = false;
        selectedProg = null;
        evaluated = false;
        postExamExplained = false;
        examBeforeChat = false;
        ownerMood = 85;
        ownerAborted = false;
        lastEvalReport = null;
        aiAnalysisText = null;
        soapAnalysisText = null;

        // Reset UI
        setChatLocked(false);
        failModalEl.classList.add('hidden');
        reviewModalEl.classList.add('hidden');
        stampOverlayEl.classList.add('hidden');
        evalSubmitBtn.textContent = '평가 확정';
        evalSubmitBtn.disabled = false;
        document.querySelectorAll('[data-asa], [data-prog], #ch1-asa-e').forEach((el) => el.classList.remove('active'));
        document.querySelectorAll('[data-exam-btn]').forEach((b) => {
          b.classList.remove('exam-done', 'exam-loading', 'exam-fading');
          b.disabled = false;
          const f = b.querySelector('.exam-fill');
          const l = b.querySelector('.exam-lbl');
          if (f) f.style.width = '0%';
          if (l && b.dataset.origLabel) l.textContent = b.dataset.origLabel;
        });
        ['mon-sec-hx', 'mon-sec-pe', 'mon-sec-lab', 'mon-sec-img'].forEach((id) => setMonCollapsed(id, false));
        peBodyEl.innerHTML = '<div class="mon-empty">검사 전</div>';
        labBodyEl.innerHTML = '<div class="mon-empty">검사 전</div>';
        imgBodyEl.innerHTML = '<div class="mon-empty">검사 전</div>';
        ccValEl.textContent = '문진 후 확인';
        ccValEl.className = 'mon-empty';
        hxListEl.innerHTML = '<div class="mon-empty">문진 후 확인</div>';
        chatLogEl.innerHTML = '';
        activateTab('chat');

        if (stageId === 'practice_dog' || stageId === 'practice_cat') {
          sigHeadEl.innerHTML = '<span>환자 생성 중...</span>';
          const sp = stageId === 'practice_cat' ? 'cat' : 'dog';
          currentCase = await Data.generatePracticeCase(sp, recentPracticeNames);
          if (currentCase && currentCase.name) {
            recentPracticeNames.push(`${currentCase.breed} ${currentCase.name}`);
            if (recentPracticeNames.length > 8) recentPracticeNames.shift();
          }
        } else {
          currentCase = Data.getFixedCase(stageId);
        }

        const spKr = currentCase.species === 'cat' ? '고양이' : '개';
        sigHeadEl.innerHTML = `
          <span>${currentCase.name}</span>
          <span class="ch1-sig-meta">${spKr} · ${currentCase.breed} · ${currentCase.age} · ${currentCase.weight} kg · ${currentCase.sex}</span>
        `;
        appendBubble('owner', currentCase.ownerGreeting || `안녕하세요 선생님, ${currentCase.name} 검사 받으러 왔습니다.`);
        chatHistory.push({ sender: 'owner', text: currentCase.ownerGreeting || '' });
      }

      const chapterCtrl = Settings.initChapterCommon({
        chapterNum: 1,
        chapterTitle: '마취 전 검사',
        initialStageId: 'tutorial',
        helpSlides: [
          { mark: '1', img: 'assets/help/ch1_help_1.png', label: '보호자 문진', desc: '보호자와 대화하여 주호소와 환자의 특이사항을 확인합니다. 핵심 내용은 대화창에 파란 글씨로 나타나게 됩니다.' },
          { mark: '2', img: 'assets/help/ch1_help_2.png', label: '마취 전 검사', desc: '신체검사·혈액검사·영상검사를 진행한 뒤 검사 결과 보기를 눌러 모니터링창에서 판독합니다.' },
          { mark: '3', img: 'assets/help/ch1_help_3.png', label: 'ASA Grade 및 예후 평가', desc: '모든 정보를 종합해 ASA 등급과 예후를 결정합니다. 확정하기 전에 보호자에게 설명을 해야만 합니다. 확정하면 도장이 찍히고 다음 단계가 해금됩니다.' }
        ],
        tutorialSteps: [
          { title: '1. 모니터링창', sel: '#ch1-monitor', onEnter: () => activateTab('chat'), text: '환자의 Signalment와 검사 결과가 표시됩니다. 각 박스 우측의 접기/열기 버튼으로 정리하며 위아래로 스크롤할 수 있습니다.' },
          { title: '2. 보호자 문진', sel: '#ch1-control', onEnter: () => activateTab('chat'), text: '보호자와 대화하여 주호소와 환자의 특이사항을 확인합니다. 핵심 내용은 대화창에 파란 글씨로 나타나게 됩니다.' },
          { title: '3. 마취 전 검사', sel: '#ch1-control', onEnter: () => activateTab('exam'), text: '신체검사·혈액검사·영상검사를 진행한 뒤 검사 결과 보기를 눌러 모니터링창에서 판독합니다.' },
          { title: '4. 예후 평가 및 시작', sel: '#ch1-control', onEnter: () => activateTab('eval'), text: '검사 완료 후 다시 보호자에게 상태를 설명하고, ASA Grade와 예후를 확정하면 완료됩니다. 이제 튜토리얼 케이스를 시작합니다.' }
        ],
        onTutorialFinish: () => {
          activateTab('chat');
        },
        onSelectStage: (stageId) => {
          loadStage(stageId);
        }
      });

      loadStage('tutorial');
    })();
  </script>
</body>
