<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chapter 5. 마취 회복 — 베타 1.1</title>
  <link rel="stylesheet" href="beta11.css?v=20261127m" />
  <script src="beta11-settings.js?v=20261127n"></script>
  <script src="beta11-ch1-data.js"></script>
</head>
<body>
  <div class="app-shell chapter-shell">
    <header class="top-bar">
      <div class="top-left">
        <div class="top-title">Chapter 5. 마취 회복</div>
      </div>
      <div id="chapter-top-actions" class="top-actions"></div>
    </header>

    <main class="ch1-page-body">
      <div class="ch1-split" id="ch5-split">
        <!-- 좌측(데스크탑) / 상단(모바일): 모니터링창 -->
        <section class="ch1-monitor" id="ch5-monitor" aria-label="마취 회복 모니터링창">
          <div class="ch1-sig-pinned">
            <div class="ch1-sig-head" id="ch5-sig-head"></div>
            <div class="ch1-cc-line" id="ch5-cc-line"></div>
            <div class="ch1-cc-line" id="ch5-status-line" style="margin-top:2px;"></div>
          </div>

          <div class="ch1-monitor-scroll">
            <div class="mon-sec" id="ch5-sec-vitals">
              <div class="mon-sec-title">
                <span>1. 회복기 생체 모니터</span>
                <div style="display:flex; gap:4px; align-items:center;">
                  <button type="button" class="b-btn mon-toggle-btn" id="ch5-detail-btn">상세</button>
                  <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch5-sec-vitals">접기</button>
                </div>
              </div>
              <div class="mon-sec-body">
                <div class="monitor-mock" style="padding:10px;">
                  <div class="monitor-row">
                    <div class="m-cell">
                      <span class="mk">HR</span>
                      <span class="mv" style="white-space:nowrap;"><span id="ch5-v-hr">--</span> <span id="ch5-v-hrstatus" style="font-size:9.5px; font-weight:700; color:#86efac;">정상</span></span>
                    </div>
                    <div class="m-cell">
                      <span class="mk">RR</span>
                      <span class="mv" style="white-space:nowrap;"><span id="ch5-v-rr">--</span> <span style="font-size:9.5px; font-weight:700; color:#86efac;">자발</span></span>
                    </div>
                    <div class="m-cell">
                      <span class="mk">SpO₂</span>
                      <span class="mv" id="ch5-v-spo2">--%</span>
                    </div>
                    <div class="m-cell">
                      <span class="mk">BT (°C)</span>
                      <span class="mv" id="ch5-v-bt" style="font-size:13.5px;">--.-°C</span>
                    </div>
                  </div>
                  <div class="monitor-row" style="grid-template-columns:repeat(3,1fr);">
                    <div class="m-cell">
                      <span class="mk">EtIso (%)</span>
                      <span class="mv" id="ch5-v-etiso" style="font-size:13.5px;">1.20%</span>
                    </div>
                    <div class="m-cell">
                      <span class="mk">연하반사</span>
                      <span class="mv" id="ch5-v-swallow" style="font-size:12.5px;">소실</span>
                    </div>
                    <div class="m-cell">
                      <span class="mk">회복 상태</span>
                      <span class="mv" id="ch5-v-behav" style="font-size:12.5px;">마취 유지</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="mon-sec" id="ch5-sec-tx">
              <div class="mon-sec-title">
                <span>2. 회복 처치 및 이벤트 로그</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch5-sec-tx">접기</button>
              </div>
              <div class="mon-sec-body">
                <div class="sig-hx-list" id="ch5-tx-list"><div class="mon-empty">회복 대기 중</div></div>
              </div>
            </div>

            <div class="mon-sec" id="ch5-sec-home">
              <div class="mon-sec-title">
                <span>3. 보호자 퇴원 안내 확인</span>
                <button type="button" class="b-btn mon-toggle-btn" data-mon-toggle="ch5-sec-home">접기</button>
              </div>
              <div class="mon-sec-body">
                <div class="sig-hx-list" id="ch5-home-list"><div class="mon-empty">퇴원 안내 후 기록</div></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 우측(데스크탑) / 하단(모바일): 조작창 -->
        <section class="ch1-control" id="ch5-control" aria-label="마취 회복 조작창">
          <div class="ch1-ctrl-handle" id="ch5-ctrl-handle" role="button" tabindex="0" aria-label="조작창 접기 및 펼치기">
            <div class="ch1-ctrl-handle-bar"></div>
          </div>

          <div class="ch1-ctrl-tabs" role="tablist">
            <button type="button" class="b-btn ch1-tab-btn active" data-pane="extub">세척 · 발관</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="care">회복 처치</button>
            <button type="button" class="b-btn ch1-tab-btn" data-pane="discharge">퇴원 안내</button>
          </div>

          <div class="ch1-ctrl-body">
            <!-- 1. 세척 · 발관 -->
            <div class="ch1-pane" data-content="extub">
              <div class="ch4-sec-grp">
                <div class="ch3-lbl-row">
                  <div class="eval-sec-lbl">가스 세척 · 기도 관리</div>
                  <button type="button" class="b-btn ch3-help-q-btn" data-cat-help="extub" aria-label="세척 및 발관 도움말">?</button>
                </div>
                <div class="exam-btn-list">
                  <button type="button" class="b-btn exam-main-btn" id="ch5-btn-wash">기화기 OFF · 100% O₂ 세척</button>
                  <button type="button" class="b-btn exam-main-btn" id="ch5-btn-cuff">기관튜브 커프 공기 제거</button>
                  <button type="button" class="b-btn exam-main-btn" id="ch5-btn-extub">기관튜브 발관</button>
                  <button type="button" class="b-btn exam-main-btn" id="ch5-btn-airway">발관 후 기도 개통성 · 호흡 확인</button>
                </div>
              </div>
            </div>

            <!-- 2. 회복 처치 -->
            <div class="ch1-pane pane-hidden" data-content="care">
              <div class="ch4-sec-grp">
                <div class="ch3-lbl-row">
                  <div class="eval-sec-lbl">산소 · 보온 처치</div>
                  <button type="button" class="b-btn ch3-help-q-btn" data-cat-help="support" aria-label="산소 및 보온 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-care5="o2">Flow-by 산소</button>
                  <button type="button" class="b-btn prog-btn" data-care5="warm">능동 가온</button>
                </div>
              </div>

              <div class="ch4-sec-grp">
                <div class="ch3-lbl-row">
                  <div class="eval-sec-lbl">진통 · 진정 · 길항제</div>
                  <button type="button" class="b-btn ch3-help-q-btn" data-cat-help="drugs" aria-label="회복기 약물 도움말">?</button>
                </div>
                <div class="prog-grid">
                  <button type="button" class="b-btn prog-btn" data-care5="analg">추가 진통제</button>
                  <button type="button" class="b-btn prog-btn" data-care5="sed">저용량 진정제</button>
                  <button type="button" class="b-btn prog-btn" data-care5="atipa">Atipamezole</button>
                  <button type="button" class="b-btn prog-btn" data-care5="fluma">Flumazenil</button>
                  <button type="button" class="b-btn prog-btn span-2" data-care5="nalox">Naloxone</button>
                </div>
              </div>
            </div>

            <!-- 3. 퇴원 안내 & 회복 완료 -->
            <div class="ch1-pane pane-hidden" data-content="discharge">
              <div class="ch1-chat-log" id="ch5-chat-log"></div>
              <form class="ch1-chat-form" id="ch5-chat-form" autocomplete="off">
                <input id="ch5-chat-input" type="text" class="b-input" placeholder="안내사항을 입력하세요." />
                <button id="ch5-chat-send" type="submit" class="b-btn b-btn-sm" style="flex-shrink:0;">전송</button>
              </form>
              <button type="button" class="b-btn" id="ch5-eval-submit" style="width:100%; height:42px; border-radius:14px; flex-shrink:0;">회복 완료</button>
            </div>

            <!-- 50% 투명도 빨간 사각형 도장 -->
            <div id="ch5-stamp-overlay" class="ch1-stamp-overlay hidden" aria-live="polite">
              <div class="ch1-stamp-asa" id="ch5-stamp-asa"></div>
              <div class="ch1-stamp-prog" id="ch5-stamp-prog"></div>
              <div class="ch1-stamp-grade" id="ch5-stamp-grade"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 실패 팝업 (F 등급 시 — 배경 클릭으로 닫히지 않음) -->
  <div id="ch5-fail-modal" class="modal-backdrop no-dismiss hidden" role="dialog" aria-modal="true" aria-labelledby="ch5-fail-title" style="backdrop-filter:blur(6px); z-index:105;">
    <div class="modal-card" style="text-align:center;">
      <h2 id="ch5-fail-title" class="font-maru" style="font-size:20px; font-weight:700; color:#dc2626; margin-bottom:8px;">마취 회복 실패 (F)</h2>
      <p id="ch5-fail-desc" class="muted" style="font-size:15px; font-weight:600; line-height:1.5; margin-bottom:16px;"></p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button id="ch5-fail-review" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">해설 보기</button>
        <button id="ch5-fail-restart" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">재시작</button>
        <button id="ch5-fail-main" type="button" class="b-btn" style="width:100%; height:42px; border-radius:14px;">메인화면</button>
      </div>
    </div>
  </div>

  <!-- 해설 보기 팝업 -->
  <div id="ch5-review-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" style="backdrop-filter:blur(6px); z-index:112;">
    <div class="modal-card" style="max-width:420px; max-height:84dvh; display:flex; flex-direction:column;">
      <h2 class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">해설 보기</h2>
      <div class="step-tabs" role="tablist" style="margin-bottom:10px; flex-shrink:0;">
        <button type="button" class="step-tab active" data-rv-tab="wrong">오답노트</button>
        <button type="button" class="step-tab" data-rv-tab="ai">AI 로그 분석</button>
        <button type="button" class="step-tab" data-rv-tab="soap">SOAP 분석</button>
      </div>
      <div style="flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:10px; min-height:180px;">
        <div id="ch5-rv-wrong" data-rv-pane="wrong"></div>
        <div id="ch5-rv-ai" data-rv-pane="ai" class="pane-hidden"></div>
        <div id="ch5-rv-soap" data-rv-pane="soap" class="pane-hidden"></div>
      </div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch5-review-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <!-- 범주별 도움말 팝업 -->
  <div id="ch5-cat-help-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ch5-cat-help-title" style="backdrop-filter:blur(6px); z-index:116;">
    <div class="modal-card" style="max-width:440px; max-height:84dvh; display:flex; flex-direction:column;">
      <h2 id="ch5-cat-help-title" class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">도움말</h2>
      <div id="ch5-cat-help-body" class="ch2-help-list" style="flex:1 1 auto; overflow-y:auto; padding-right:2px;"></div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch5-cat-help-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <!-- Chapter 1 마취 전 검사 결과 상세 팝업 -->
  <div id="ch5-preop-detail-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="ch5-detail-title" style="backdrop-filter:blur(6px); z-index:115;">
    <div class="modal-card" style="max-width:460px; max-height:85dvh; display:flex; flex-direction:column;">
      <h2 id="ch5-detail-title" class="font-maru" style="font-size:19px; font-weight:600; color:var(--brown); margin-bottom:10px;">마취 전 검사 및 특이사항</h2>
      <div class="step-tabs" role="tablist" style="margin-bottom:10px; flex-shrink:0;">
        <button type="button" class="step-tab active" data-dt-tab="hx">특이사항</button>
        <button type="button" class="step-tab" data-dt-tab="pe">신체검사</button>
        <button type="button" class="step-tab" data-dt-tab="lab">혈액검사</button>
        <button type="button" class="step-tab" data-dt-tab="img">영상검사</button>
      </div>
      <div style="flex:1 1 auto; overflow-y:auto; min-height:200px; padding-right:2px;">
        <div id="ch5-dt-hx" data-dt-pane="hx"></div>
        <div id="ch5-dt-pe" data-dt-pane="pe" class="pane-hidden"></div>
        <div id="ch5-dt-lab" data-dt-pane="lab" class="pane-hidden"></div>
        <div id="ch5-dt-img" data-dt-pane="img" class="pane-hidden"></div>
      </div>
      <div class="modal-close-wrap" style="margin-top:12px; flex-shrink:0;">
        <button id="ch5-detail-close" type="button" class="b-btn modal-close-btn">닫기</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const Data = window.Beta11Ch1Data;
      const Settings = window.Beta11Settings;
      if (!Data || !Settings) return;

      const splitEl = document.getElementById('ch5-split');
      const sigHeadEl = document.getElementById('ch5-sig-head');
      const ccLineEl = document.getElementById('ch5-cc-line');
      const statusLineEl = document.getElementById('ch5-status-line');
      const txListEl = document.getElementById('ch5-tx-list');
      const homeListEl = document.getElementById('ch5-home-list');
      const ctrlHandleEl = document.getElementById('ch5-ctrl-handle');
      const btnWash = document.getElementById('ch5-btn-wash');
      const btnCuff = document.getElementById('ch5-btn-cuff');
      const btnExtub = document.getElementById('ch5-btn-extub');
      const btnAirway = document.getElementById('ch5-btn-airway');
      const chatLogEl = document.getElementById('ch5-chat-log');
      const chatFormEl = document.getElementById('ch5-chat-form');
      const chatInputEl = document.getElementById('ch5-chat-input');
      const chatSendBtn = document.getElementById('ch5-chat-send');
      const evalSubmitBtn = document.getElementById('ch5-eval-submit');
      const stampOverlayEl = document.getElementById('ch5-stamp-overlay');
      const failModalEl = document.getElementById('ch5-fail-modal');
      const failDescEl = document.getElementById('ch5-fail-desc');
      const reviewModalEl = document.getElementById('ch5-review-modal');
      const rvWrongEl = document.getElementById('ch5-rv-wrong');
      const rvAiEl = document.getElementById('ch5-rv-ai');
      const rvSoapEl = document.getElementById('ch5-rv-soap');
      const catHelpModalEl = document.getElementById('ch5-cat-help-modal');
      const catHelpTitleEl = document.getElementById('ch5-cat-help-title');
      const catHelpBodyEl = document.getElementById('ch5-cat-help-body');
      const detailModalEl = document.getElementById('ch5-preop-detail-modal');
      const dtHxEl = document.getElementById('ch5-dt-hx');
      const dtPeEl = document.getElementById('ch5-dt-pe');
      const dtLabEl = document.getElementById('ch5-dt-lab');
      const dtImgEl = document.getElementById('ch5-dt-img');

      const CAT_HELP = {
        extub: {
          title: '가스 세척 · 기도 관리',
          items: [
            { name: '기화기 OFF · 100% O₂ 세척', desc: '수술 종료 후 기화기를 끄고 100% 산소를 5분 이상 공급해 잔여 흡입마취제(EtIso)를 배출하고 확산성 저산소혈증을 예방합니다.' },
            { name: '기관튜브 커프 공기 제거', desc: '발관 직전 반드시 파일럿 풍선에서 커프 공기를 완전히 제거해야 기관 점막 열상과 후두 손상을 막을 수 있습니다.' },
            { name: '기관튜브 발관', desc: '연하반사가 2회 이상 뚜렷하게 회복되고 자발 호흡이 안정된 시점에 발관합니다. 고양이·단두종은 후두경련과 상기도 폐색에 각별히 주의합니다.' },
            { name: '발관 후 기도 개통성 · 호흡 확인', desc: '발관 직후 협착음(Stridor), 흉복부 역설 호흡, 점막 청색증 여부를 확인해 지연성 기도 폐색을 조기에 발견합니다.' }
          ]
        },
        support: {
          title: '산소 · 보온 처치',
          items: [
            { name: 'Flow-by 산소', desc: '발관 직후나 SpO₂ < 95% 환자, 단두종·노령·심폐 질환 환자에서 비침습적으로 산소를 공급해 회복기 저산소혈증을 예방합니다.' },
            { name: '능동 가온 (Warm air)', desc: '회복기 저체온(BT < 36.5°C)은 마취 각성 지연, 떨림(산소 소모 2~3배 증가), 서맥을 유발하므로 정상 체온 회복까지 가온을 유지합니다.' }
          ]
        },
        drugs: {
          title: '진통 · 진정 · 길항제',
          items: [
            { name: '추가 진통제', desc: '수술 부위 통증으로 인한 빈맥·낑낑거림·방어 반응이 있을 때 오피오이드 진통제를 보충해 편안한 각성을 유도합니다.' },
            { name: '저용량 진정제', desc: '통증은 조절되었으나 오피오이드 유발 각성 불쾌감(Dysphoria)·흥분이 심할 때 극저용량 진정제로 안전하게 진정시킵니다.' },
            { name: 'Atipamezole', desc: 'α2-agonist(Dexmedetomidine 등)로 인한 과진정·서맥·각성 지연을 특이적으로 역전합니다.' },
            { name: 'Flumazenil', desc: 'Benzodiazepines(Midazolam 등)로 인한 과진정·역설적 흥분을 역전합니다.' },
            { name: 'Naloxone', desc: 'Full μ-오피오이드에 의한 심한 호흡억제 시 사용하지만, 진통 효과까지 완전히 소실시켜 극심한 수술 통증을 유발할 수 있으므로 통증 환자에서는 주의합니다.' }
          ]
        }
      };

      const HOME_ITEMS = [
        { key: 'h_food', label: '식이 · 음수 재개', kws: ['밥', '사료', '물', '음수', '식이', '소량', '금식', '먹', '급여'] },

        const abnLung = /수포음|천명음|거친|감약|Crackle/i.test(auscLung);

        dtPeEl.innerHTML = `

            <div class="pe-cell"><span class="pe-k">MMC</span><span class="pe-v ${abnMMC ? 'is-abn' : ''}">${escapeHtml(p.mmc)}</span></div>
            <div class="pe-cell span-2">

              <div class="pe-ausc-lines">
                <div class="pe-ausc-row"><span class="pe-ausc-k">심잡음:</span><span class="pe-v ${abnHeart ? 'is-abn' : ''}" style="font-size:inherit;">${escapeHtml(auscHeart)}</span></div>
                <div class="pe-ausc-row"><span class="pe-ausc-k">폐음:</span><span class="pe-v ${abnLung ? 'is-abn' : ''}" style="font-size:inherit;">${escapeHtml(auscLung)}</span></div>
                <div class="pe-ausc-row"><span class="pe-ausc-k">복명음:</span><span class="pe-v ${abnBowel ? 'is-abn' : ''}" style="font-size:inherit;">${escapeHtml(auscBowel)}</span></div>
              </div>
            </div>
          </div>
        `;

        const m = P.vbgM, vc = P.vbgC, cb = P.cbc, ch = P.chem;
        const vbgMeasured = [['pH','pH',m.pH.toFixed(2),''],['pCO₂','pCO2',m.pCO2,'mmHg'],['pO₂ (정맥)','pO2',m.pO2,'mmHg'],['Na⁺','Na',m.Na,'mmol/L'],['K⁺','K',m.K.toFixed(1),'mmol/L'],['Cl⁻','Cl',m.Cl,'mmol/L'],['iCa','iCa',m.iCa.toFixed(2),'mmol/L'],['Hct','Hct',m.Hct,'%']];
        const vbgCalc = [['pH(T)','pHT',vc.pHT.toFixed(3),''],['pCO₂(T)','pCO2T',vc.pCO2T,'mmHg'],['pO₂(T)','pO2T',vc.pO2T,'mmHg'],['ctCO₂','ctCO2',vc.ctCO2,'mmol/L'],['cHCO₃⁻','cHCO3',vc.cHCO3,'mmol/L'],['cHCO₃⁻(std)','cHCO3std',vc.cHCO3std,'mmol/L'],['BE(ecf)','BEecf',vc.BEecf,'mmol/L'],['BE(B)','BEB',vc.BEB,'mmol/L'],['ctHb','ctHb',vc.ctHb,'g/dL'],['Ca²⁺(7.4)','iCa74',vc.iCa74.toFixed(2),'mmol/L'],['pO₂(A-a)','pO2Aa',vc.pO2Aa,'mmHg'],['sO₂','sO2',vc.sO2,'%'],['AG(K)','AGK',vc.AGK,'mmol/L']];
        const cbcRows = [['RBC','RBC',cb.RBC,'M/µL'],['HGB','HGB',cb.HGB,'g/dL'],['HCT','HCT',cb.HCT,'%'],['MCV','MCV',cb.MCV,'fL'],['MCH','MCH',cb.MCH,'pg'],['MCHC','MCHC',cb.MCHC,'g/dL'],['RDW','RDW',cb.RDW,'%'],['RETIC','RETIC',cb.RETIC,'K/µL'],['Retic-HGB','ReticHGB',cb.ReticHGB,'pg'],['WBC','WBC',cb.WBC,'K/µL'],['Neu','Neu',`${cb.Neu} (${cb.neuP}%)`,''],['Lym','Lym',`${cb.Lym} (${cb.lymP}%)`,''],['Mono','Mono',`${cb.Mono} (${cb.monoP}%)`,''],['Eos','Eos',`${cb.Eos} (${cb.eosP}%)`,''],['Baso','Baso',`${cb.Baso} (${cb.basoP}%)`,''],['PLT','PLT',cb.PLT,'K/µL'],['MPV','MPV',cb.MPV,'fL'],['PCT','PCT',cb.PCT,'%']];
        const chemGeneral = [['ALP','ALP',ch.ALP,'U/L'],['ALT','ALT',ch.ALT,'U/L'],['AST','AST',ch.AST,'U/L'],['GGT','GGT',ch.GGT,'U/L'],['BUN','BUN',ch.BUN,'mg/dL'],['Crea','Crea',ch.Crea,'mg/dL'],['Phos','Phos',ch.Phos,'mg/dL'],['Ca','Ca',ch.Ca,'mg/dL'],['TG','TG',ch.TG,'mg/dL'],['Tchol','Tchol',ch.Tchol,'mg/dL'],['Glu','Glu',ch.Glu,'mg/dL'],['TP','TP',ch.TP,'g/dL'],['ALB','ALB',ch.ALB,'g/dL'],['Glob','Glob',ch.Glob,'g/dL'],['Mg','Mg',ch.Mg,'mg/dL']];
        const chemSpecial = isCat
          ? [['SAA','SAA',ch.SAA,'µg/mL'],['fPL','fPL',ch.fPL,'µg/L'],['proBNP','proBNP',ch.proBNP,'pmol/L'],['T4','T4',ch.T4,'µg/dL'],['Cortisol','Cortisol',ch.Cortisol,'µg/dL'],['SDMA','SDMA',ch.SDMA,'µg/dL']]
          : [['CRP','CRP',ch.CRP,'mg/L'],['cPL','cPL',ch.cPL,'µg/L'],['proBNP','proBNP',ch.proBNP,'pmol/L'],['T4','T4',ch.T4,'µg/dL'],['Cortisol','Cortisol',ch.Cortisol,'µg/dL'],['SDMA','SDMA',ch.SDMA,'µg/dL']];
        dtLabEl.innerHTML = `<div class="lab-group-lbl">정맥혈액가스 (VBG) — 측정 8종</div>${renderLabTable(vbgMeasured, P)}<div class="lab-group-lbl">정맥혈액가스 (VBG) — 계산 13종</div>${renderLabTable(vbgCalc, P)}<div class="lab-group-lbl">일반혈액검사 (CBC) — 18종</div>${renderLabTable(cbcRows, P)}<div class="lab-group-lbl">혈액화학 (일반 15종)</div>${renderLabTable(chemGeneral, P)}<div class="lab-group-lbl">혈액화학 (특수 6종)</div>${renderLabTable(chemSpecial, P)}`;

        const im = c.imaging || {};
        const th = im.thoracic || {};
        const rows = [`<div class="img-row"><strong>흉부 X-ray</strong><br/>VHS: ${escapeHtml(th.vhs || '-')} · VLAS: ${escapeHtml(th.vlas || '-')}<br/>기관직경: ${escapeHtml(th.trachea || '-')}<br/>폐야: ${escapeHtml(th.lung || '-')}${th.extra ? '<br/>추가 소견: ' + escapeHtml(th.extra) : ''}</div>`];
        if (im.abdominal) rows.push(`<div class="img-row"><strong>복부 X-ray</strong><br/>${escapeHtml(im.abdominal)}</div>`);
        if (im.ultrasound) rows.push(`<div class="img-row"><strong>초음파 검사</strong><br/>${escapeHtml(im.ultrasound)}</div>`);
        dtImgEl.innerHTML = `<div class="img-list">${rows.join('')}</div>`;
      }

      function setMonCollapsed(id, c) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.classList.toggle('is-collapsed', Boolean(c));
        const b = sec.querySelector('[data-mon-toggle]');
        if (b) b.textContent = c ? '열기' : '접기';
      }
      document.querySelectorAll('[data-mon-toggle]').forEach((b) => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const sec = document.getElementById(b.dataset.monToggle);
        if (!sec) return;
        Settings.playTone(500, 0.04, 0.025);
        setMonCollapsed(b.dataset.monToggle, !sec.classList.contains('is-collapsed'));
      }));

      function setDetailTab(k) {
        document.querySelectorAll('[data-dt-tab]').forEach((b) => b.classList.toggle('active', b.dataset.dtTab === k));
        document.querySelectorAll('[data-dt-pane]').forEach((p) => p.classList.toggle('pane-hidden', p.dataset.dtPane !== k));
      }
      document.querySelectorAll('[data-dt-tab]').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); setDetailTab(b.dataset.dtTab); }));
      document.getElementById('ch5-detail-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        Settings.playTone(540, 0.05, 0.03);
        setDetailTab('pe');
        detailModalEl.classList.remove('hidden');
      });
      document.getElementById('ch5-detail-close').addEventListener('click', () => detailModalEl.classList.add('hidden'));
      detailModalEl.addEventListener('click', (e) => { if (e.target === detailModalEl) detailModalEl.classList.add('hidden'); });

      document.querySelectorAll('[data-cat-help]').forEach((b) => b.addEventListener('click', () => {
        const info = CAT_HELP[b.dataset.catHelp];
        if (!info) return;
        Settings.playTone(520, 0.04, 0.025);
        catHelpTitleEl.textContent = info.title;
        catHelpBodyEl.innerHTML = info.items.map((it) => `<div class="ch2-help-item"><strong>${escapeHtml(it.name)}</strong><p>${escapeHtml(it.desc)}</p></div>`).join('');
        catHelpModalEl.classList.remove('hidden');
      }));
      document.getElementById('ch5-cat-help-close').addEventListener('click', () => catHelpModalEl.classList.add('hidden'));
      catHelpModalEl.addEventListener('click', (e) => { if (e.target === catHelpModalEl) catHelpModalEl.classList.add('hidden'); });

      const setCollapsed = Settings.bindCtrlHandle(ctrlHandleEl, splitEl);

      function activateTab(p) {
        setCollapsed(false);
        document.querySelectorAll('.ch1-tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.pane === p));
        document.querySelectorAll('[data-content]').forEach((el) => el.classList.toggle('pane-hidden', el.dataset.content !== p));
      }
      document.querySelectorAll('.ch1-tab-btn').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); activateTab(b.dataset.pane); }));

      function addTx(msg) {
        const sec = rec ? rec.sec : 0;
        const mm = String(Math.floor(sec / 60)).padStart(2, '0');
        const ss = String(sec % 60).padStart(2, '0');
        const line = `[${mm}:${ss}] ${msg}`;
        txLogs.unshift(line);
        const empty = txListEl.querySelector('.mon-empty');
        if (empty) empty.remove();
        const row = document.createElement('div');
        row.className = 'sig-hx-row';
        row.textContent = `• ${line}`;
        txListEl.prepend(row);
      }

      function renderMonitor() {
        if (!rec) return;
        const isCat = currentCase && currentCase.species === 'cat';
        const hrSt = rec.hr < (isCat ? 100 : 60) ? '서맥' : rec.hr > (isCat ? 200 : 145) ? '빈맥' : '정상';
        document.getElementById('ch5-v-hr').textContent = Math.round(rec.hr);
        const hrStEl = document.getElementById('ch5-v-hrstatus');
        hrStEl.textContent = hrSt;
        hrStEl.style.color = hrSt === '정상' ? '#86efac' : '#fde68a';

        document.getElementById('ch5-v-rr').textContent = Math.round(rec.rr);
        const spo2El = document.getElementById('ch5-v-spo2');
        spo2El.textContent = `${Math.round(rec.spo2)}%`;
        spo2El.style.color = rec.spo2 < 94 ? '#fca5a5' : '#ffffff';

        const btEl = document.getElementById('ch5-v-bt');
        btEl.textContent = `${rec.bt.toFixed(1)}°C`;
        btEl.style.color = rec.bt < 36.5 ? '#fde68a' : '#ffffff';

        document.getElementById('ch5-v-etiso').textContent = `${rec.etIso.toFixed(2)}%`;
        const swEl = document.getElementById('ch5-v-swallow');
        swEl.textContent = rec.swallow ? '회복 (2회+)' : '소실';
        swEl.style.color = rec.swallow ? '#86efac' : '#cbd5e1';

        const behav = rec.extubated
          ? (rec.pain ? '통증 징후' : rec.dysphoria ? '불쾌감(흥분)' : '안정 회복')
          : (rec.swallow ? '발관 적정' : rec.washed ? '가스 세척 중' : '마취 유지');
        const behavEl = document.getElementById('ch5-v-behav');
        behavEl.textContent = behav;
        behavEl.style.color = (rec.pain || rec.dysphoria) && rec.extubated ? '#fde68a' : rec.extubated ? '#86efac' : '#ffffff';

        const st = rec.extubated
          ? (rec.airwayChecked ? '발관·호흡 확인 완료 (퇴원 안내 단계)' : '발관 완료 — 발관 후 기도·호흡 확인 권장')
          : rec.swallow
            ? (rec.cuffDeflated ? '커프 제거 완료 — 지금 발관하세요' : '연하반사 회복 — 커프 제거 후 발관하세요')
            : rec.washed
              ? '100% O₂ 가스 세척 중'
              : '기화기 OFF 및 산소 세척 대기';
        statusLineEl.innerHTML = `<strong>회복 단계:</strong> ${st}`;
      }

      function stepRec() {
        if (!rec || evaluated) return;
        rec.sec += 1;
        if (rec.washed && rec.etIso > 0.08) {
          rec.etIso = Math.max(0.05, rec.etIso - 0.14);
          if (rec.etIso <= 0.35 && !rec.swallow) {
            rec.swallow = true;
            addTx('연하반사 2회 이상 확인 — 커프 제거 후 안전한 발관 시점 도달');
          }
        }
        if (rec.warm) rec.bt = cl(rec.bt + 0.07, 35.0, 38.5);
        else rec.bt = cl(rec.bt - 0.015, 35.2, 39.0);
        if (rec.o2) rec.spo2 = cl(rec.spo2 + 0.8, 90, 100);
        else if (rec.extubated && !rec.o2 && rec.spo2 > 93) rec.spo2 = cl(rec.spo2 - 0.12, 91, 100);
        renderMonitor();
      }

      btnWash.addEventListener('click', () => {
        if (!rec || rec.washed || evaluated) return;
        rec.washed = true;
        btnWash.classList.add('exam-done');
        btnWash.disabled = true;
        addTx('기화기 OFF 및 100% O₂ 가스 세척 시작');
        Settings.playTone(620, 0.05, 0.03);
        renderMonitor();
      });

      btnCuff.addEventListener('click', () => {
        if (!rec || rec.cuffDeflated || evaluated) return;
        rec.cuffDeflated = true;
        btnCuff.classList.add('exam-done');
        btnCuff.disabled = true;
        addTx('기관튜브 커프 공기 완전 제거 확인');
        Settings.playTone(600, 0.05, 0.03);
        renderMonitor();
      });

      btnExtub.addEventListener('click', () => {
        if (!rec || rec.extubated || evaluated) return;
        if (!rec.washed || !rec.swallow) {
          rec.earlyExtubMistake = true;
          addTx('경고: 연하반사 미회복 상태에서 조기 발관 시도 (기도 폐색·흡인 위험)');
          Settings.playTone(320, 0.08, 0.03);
          return;
        }
        if (!rec.cuffDeflated) {
          rec.cuffExtubMistake = true;
          addTx('경고: 커프 공기 미제거 상태로 발관 시도 — 먼저 커프 공기를 제거하세요');
          Settings.playTone(320, 0.08, 0.03);
          return;
        }
        rec.extubated = true;
        btnExtub.classList.add('exam-done');
        btnExtub.disabled = true;
        addTx('안전하게 기관튜브 발관 완료');
        if (rec.pain) {
          rec.hr = Math.min(200, rec.hr + 22);
          addTx('회복 관찰: 수술 부위 통증 징후(빈맥·방어 반응) — 회복 처치 탭에서 진통을 고려하세요');
        } else if (rec.dysphoria) {
          rec.hr = Math.min(190, rec.hr + 12);
          addTx('회복 관찰: 각성 불쾌감(흥분·낑낑거림) — 회복 처치 탭에서 저용량 진정을 고려하세요');
        }
        Settings.playTone(700, 0.07, 0.035);
        renderMonitor();
      });

      btnAirway.addEventListener('click', () => {
        if (!rec || rec.airwayChecked || evaluated) return;
        if (!rec.extubated) {
          addTx('안내: 기관튜브 발관 완료 후 기도 개통성과 호흡 양상을 확인하세요');
          Settings.playTone(420, 0.05, 0.025);
          return;
        }
        rec.airwayChecked = true;
        btnAirway.classList.add('exam-done');
        btnAirway.disabled = true;
        addTx('발관 후 기도 개통성 확인 — 협착음 없음 · 자발 호흡 안정');
        Settings.playTone(640, 0.05, 0.03);
        renderMonitor();
      });

      document.querySelectorAll('[data-care5]').forEach((b) => b.addEventListener('click', () => {
        if (!rec || evaluated) return;
        const k = b.dataset.care5;
        if (rec.cares.has(k)) return;
        rec.cares.add(k);
        b.classList.add('exam-done');
        b.disabled = true;
        if (k === 'o2') { rec.o2 = true; rec.spo2 = 99; addTx('Flow-by 산소 공급 실시 — SpO₂ 안정화'); }
        else if (k === 'warm') { rec.warm = true; addTx('능동 가온(Warm air) 적용 — 체온 회복'); }
        else if (k === 'analg') { rec.pain = false; rec.hr = Math.max(70, rec.hr - 22); addTx('추가 진통제 투여 — 수술 부위 통증 완화'); }
        else if (k === 'sed') { rec.dysphoria = false; rec.hr = Math.max(68, rec.hr - 14); addTx('저용량 진정제 투여 — 각성 불쾌감(흥분) 안정화'); }
        else if (k === 'atipa') { addTx('Atipamezole 투여 — α2 진정 효과 역전'); }
        else if (k === 'fluma') { addTx('Flumazenil 투여 — Benzodiazepine 효과 역전'); }
        else if (k === 'nalox') {
          if (rec.pain) {
            rec.naloxMistake = true;
            rec.hr = Math.min(210, rec.hr + 20);
            addTx('경고: 통증 상태에서 Naloxone 투여 — 진통 소실로 통증·빈맥 악화');
          } else {
            addTx('Naloxone 투여 — 오피오이드 호흡억제 역전');
          }
        }
        Settings.playTone(600, 0.05, 0.03);
        renderMonitor();
      }));

      function typeText(el, full) {
        el.textContent = '';
        let i = 0;
        function step() {
          if (i <= full.length) { el.textContent = full.slice(0, i++); typingTimers.push(setTimeout(step, 20)); }
        }
        step();
      }

      function revealHomeGuide(vetText) {
        const low = String(vetText || '').toLowerCase();
        const hits = [];
        HOME_ITEMS.forEach((it) => {
          if (!revealedHome.has(it.key) && it.kws.some((kw) => low.includes(kw))) {
            revealedHome.add(it.key);
            hits.push(it);
          }
        });
        if (!hits.length) return [];
        setMonCollapsed('ch5-sec-home', false);
        const empty = homeListEl.querySelector('.mon-empty');
        if (empty) empty.remove();
        hits.forEach((it) => {
          const row = document.createElement('div');
          row.className = 'sig-hx-row';
          row.innerHTML = `<span class="sig-hx-k">${it.label}:</span> <span class="sig-hx-v"></span>`;
          homeListEl.appendChild(row);
          typeText(row.querySelector('.sig-hx-v'), '안내 완료');
        });
        Settings.playTone(640, 0.05, 0.025);
        return hits;
      }

      function appendBubble(sender, text, blueHighlight = false) {
        const row = document.createElement('div');
        row.className = `chat-row ${sender}`;
        const b = document.createElement('div');
        b.className = 'chat-bubble';
        b.innerHTML = blueHighlight ? `<span class="chat-sig-blue">${escapeHtml(text)}</span>` : escapeHtml(text);
        row.appendChild(b);
        chatLogEl.appendChild(row);
        chatLogEl.scrollTop = chatLogEl.scrollHeight;
      }

      function setChatLocked(locked) {
        chatInputEl.disabled = Boolean(locked);
        chatSendBtn.disabled = Boolean(locked);
        chatInputEl.placeholder = locked ? '평가가 완료되어 안내가 종료되었습니다' : '안내사항을 입력하세요.';
      }

      chatFormEl.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (evaluated || chatBusy || !currentCase) return;
        const msg = chatInputEl.value.trim();
        if (!msg) return;
        chatInputEl.value = '';
        const newHits = revealHomeGuide(msg);
        appendBubble('vet', msg, newHits.length > 0);
        chatHistory.push({ sender: 'vet', text: msg });
        chatBusy = true;
        chatSendBtn.disabled = true;

        let reply = '';
        try {
          const r = await fetch('/api/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: JSON.stringify({
              task: 'roleplay',
              role: 'owner_recovery',
              species: currentCase.species === 'cat' ? '고양이' : '개',
              caseName: `${currentCase.name} (${currentCase.breed})`,
              asa: `ASA ${currentCase.trueAsa}${currentCase.trueEmergency ? '-E' : ''}`,
              caseDesc: currentCase.chiefComplaint,
              ownerPersonality: currentCase.ownerPersonality || 'neutral',
              knowledgeLevel: currentCase.ownerLevel || 2,
              chatHistory: chatHistory.slice(-10),
              vetAdvice: msg
            })
          });
          if (r.ok) { const d = await r.json(); if (d && d.text) reply = String(d.text).trim(); }
        } catch {}

        if (!reply) {
          reply = revealedHome.size >= HOME_ITEMS.length
            ? '밥·물 먹이는 시간부터 투약, 보온 안정, 응급 증상까지 꼼꼼히 알려주셔서 감사합니다! 집에 가서 잘 돌볼게요.'
            : '알겠습니다 선생님. 혹시 집에서 식이·음수, 약 복용·넥카라, 보온·안정이나 바로 내원해야 하는 응급 증상도 알려주실 수 있나요?';
        }
        const clean = reply.replace(/^\[ABORT\]\s*/i, '');
        appendBubble('owner', clean, false);
        chatHistory.push({ sender: 'owner', text: clean });
        chatBusy = false;
        if (!evaluated) chatSendBtn.disabled = false;
      });

      function setReviewTab(k) {
        document.querySelectorAll('[data-rv-tab]').forEach((b) => b.classList.toggle('active', b.dataset.rvTab === k));
        document.querySelectorAll('[data-rv-pane]').forEach((p) => p.classList.toggle('pane-hidden', p.dataset.rvPane !== k));
        if (k === 'ai' && !aiText) runAiDebrief();
        if (k === 'soap' && !soapText) runSoap();
      }
      document.querySelectorAll('[data-rv-tab]').forEach((b) => b.addEventListener('click', () => { Settings.playTone(520, 0.04, 0.025); setReviewTab(b.dataset.rvTab); }));
      document.getElementById('ch5-review-close').addEventListener('click', () => reviewModalEl.classList.add('hidden'));
      reviewModalEl.addEventListener('click', (e) => { if (e.target === reviewModalEl) reviewModalEl.classList.add('hidden'); });

      document.getElementById('ch5-fail-review').addEventListener('click', () => {
        Settings.playTone(540, 0.05, 0.03);
        setReviewTab('wrong');
        reviewModalEl.classList.remove('hidden');
      });
      document.getElementById('ch5-fail-restart').addEventListener('click', () => {
        Settings.playTone(540, 0.05, 0.03);
        loadStage(currentStageId, { preserveCase: true });
      });
      document.getElementById('ch5-fail-main').addEventListener('click', () => {
        Settings.playTone(520, 0.04, 0.025);
        window.location.href = 'index.html';
      });

      function buildAiPayload(task) {
        const c = lastReport.caseObj;
        return {
          task, phase: 'chapter5', chapterLabel: 'Chapter 5 마취 회복',
          species: c.species === 'cat' ? '고양이' : '개',
          scenario: `${c.name} (${c.breed}, ${c.weight}kg) - ${c.chiefComplaint}`,
          chatSummary: chatHistory.map((m) => `${m.sender === 'vet' ? '수의사' : '보호자'}: ${m.text}`).slice(-8).join(' | '),
          examSummary: `세척(${rec.washed ? '완료' : '미실시'}), 커프제거(${rec.cuffDeflated ? '완료' : '미실시'}), 발관(${rec.extubated ? '완료' : '미실시'}), 처치(${Array.from(rec.cares).join(',') || '없음'}), 최종 BT ${rec.bt.toFixed(1)}°C`,
          studentEval: `점수 ${lastReport.score}점 (${lastReport.grade}), 퇴원안내 ${revealedHome.size}/${HOME_ITEMS.length}`,
          trueEval: '가스 세척 → 연하반사 확인 → 커프 제거 후 발관 → 저체온/통증/불쾌감 교정 → 보호자 퇴원 안내'
        };
      }
      async function runAiDebrief() {
        rvAiEl.innerHTML = '<div class="b-card-soft" style="padding:14px; text-align:center;">AI 로그 분석 중...</div>';
        let t = '';
        try { const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(buildAiPayload('debrief')) }); if (r.ok) { const d = await r.json(); t = (d.analysis || d.text || '').trim(); } } catch {}
        if (!t) {
          const dStr = lastReport.deductions && lastReport.deductions.length
            ? lastReport.deductions.map((d) => `${d.text} (-${d.pts}점)`).join(' / ')
            : '감점 사항 없이 안전하게 마취 회복과 퇴원 안내를 완료했습니다.';
          t = `[오프라인 회복 로그 분석]\n1) 발관 절차: 가스 세척(${rec.washed ? '완료' : '누락'}), 커프 제거(${rec.cuffDeflated ? '완료' : '누락'}), 발관(${rec.extubated ? '완료' : '누락'}).\n2) 퇴원 안내: ${revealedHome.size}/${HOME_ITEMS.length} 항목 전달 완료.\n3) 감점 및 보완 포인트: ${dStr}`;
        }
        aiText = t;
        rvAiEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(t)}</div>`;
      }
      async function runSoap() {
        rvSoapEl.innerHTML = '<div class="b-card-soft" style="padding:14px; text-align:center;">AI SOAP 분석 생성 중...</div>';
        let t = '';
        try { const r = await fetch('/api/ai', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(buildAiPayload('soap_record')) }); if (r.ok) { const d = await r.json(); t = (d.text || d.analysis || '').trim(); } } catch {}
        if (!t) {
          const c = lastReport.caseObj;
          t = `S: ${c.name} (${c.breed}, ${c.weight}kg) 마취 종료 및 회복\nO: 최종 HR ${Math.round(rec.hr)}, RR ${Math.round(rec.rr)}, SpO₂ ${Math.round(rec.spo2)}%, BT ${rec.bt.toFixed(1)}°C, EtIso ${rec.etIso.toFixed(2)}%, 발관 ${rec.extubated ? '완료' : '미완료'}\nA: 마취 회복 평가 ${lastReport.score}점 (${lastReport.grade})\nP: 퇴원 주의사항(식이·투약·보온안정·응급증상) 안내 완료 후 안정 귀가`;
        }
        soapText = t;
        rvSoapEl.innerHTML = `<div class="b-card" style="padding:12px; white-space:pre-line; line-height:1.6;">${escapeHtml(t)}</div>`;
      }

      evalSubmitBtn.addEventListener('click', () => {
        if (!currentCase || !rec) return;
        if (evaluated) { Settings.playTone(540, 0.05, 0.03); setReviewTab('wrong'); reviewModalEl.classList.remove('hidden'); return; }
        evaluated = true;
        setChatLocked(true);
        stopAll();

        const deductions = [];
        if (!rec.washed) deductions.push({ text: '기화기 OFF 및 100% O₂ 가스 세척 누락', pts: 20 });
        if (!rec.extubated) deductions.push({ text: '기관튜브 발관 미완료', pts: 25 });
        if (rec.earlyExtubMistake) deductions.push({ text: '연하반사 회복 전 조기 발관 시도 (기도 폐색·흡인 위험)', pts: 12 });
        if (rec.cuffExtubMistake) deductions.push({ text: '커프 공기 미제거 상태로 발관 시도 (기관 점막 손상 위험)', pts: 10 });
        if (rec.extubated && !rec.airwayChecked) deductions.push({ text: '발관 후 기도 개통성 · 호흡 확인 누락', pts: 6 });
        if (rec.bt < 36.5 && !rec.warm) deductions.push({ text: `회복기 저체온 방치 (최종 BT ${rec.bt.toFixed(1)}°C · 가온 미실시)`, pts: 10 });
        if (rec.spo2 < 94 && !rec.o2) deductions.push({ text: `회복기 저산소혈증 방치 (SpO₂ ${Math.round(rec.spo2)}% · 산소 미공급)`, pts: 10 });
        if (rec.pain) deductions.push({ text: '회복기 수술 통증 미처치 (추가 진통 누락)', pts: 8 });
        if (rec.dysphoria) deductions.push({ text: '회복기 각성 불쾌감(흥분) 미처치', pts: 8 });
        if (rec.naloxMistake) deductions.push({ text: '통증 상태에서 Naloxone 오투여 (진통 소실·통증 악화)', pts: 8 });
        HOME_ITEMS.forEach((it) => {
          if (!revealedHome.has(it.key)) deductions.push({ text: `보호자 퇴원 안내 누락: ${it.label}`, pts: 5 });
        });

        const totalDeduct = deductions.reduce((s, d) => s + d.pts, 0);
        const score = cl(Math.round(100 - totalDeduct), 0, 100);
        const grade = score >= 95 ? 'S' : score >= 90 ? 'A' : score >= 80 ? 'B' : score >= 70 ? 'C' : score >= 50 ? 'D' : 'F';

        lastReport = { caseObj: currentCase, score, grade, deductions };
        aiText = null; soapText = null;
        rvWrongEl.innerHTML = `
          <div class="b-card-soft" style="padding:12px; display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-family:var(--font-display); font-size:15px;">마취 회복 평가</strong>
              <strong style="font-family:var(--font-display); font-size:17px; color:#dc2626;">${score}점 (${grade})</strong>
            </div>
            <div class="modal-row"><span class="muted">가스 세척 / 커프 제거 / 발관</span><strong>${rec.washed ? '완료' : '누락'} / ${rec.cuffDeflated ? '완료' : '누락'} / ${rec.extubated ? '완료' : '누락'}</strong></div>
            <div class="modal-row"><span class="muted">최종 체온 (BT) / SpO₂</span><strong>${rec.bt.toFixed(1)}°C / ${Math.round(rec.spo2)}%</strong></div>
            <div class="modal-row"><span class="muted">보호자 퇴원 안내</span><strong>${revealedHome.size} / ${HOME_ITEMS.length}</strong></div>
          </div>
          <div class="b-card" style="padding:12px; margin-top:8px; line-height:1.55;">
            <div class="b-label"><span>오답노트${totalDeduct ? ` (총 -${totalDeduct}점)` : ''}</span></div>
            ${deductions.length ? deductions.map((d) => `<p style="color:#b91c1c;">• ${escapeHtml(d.text)} <strong>(-${d.pts}점)</strong></p>`).join('') : '<p>• 안전한 가스 세척·발관·회복 처치 및 퇴원 안내를 완료했습니다.</p>'}
          </div>
        `;

        evalSubmitBtn.textContent = '해설 보기';
        Settings.saveStageResult(5, currentStageId, { grade, score });
        if (chapterCtrl) chapterCtrl.refreshStages();

        if (grade === 'F') {
          failDescEl.textContent = `최종 ${score}점 (F)으로 기준 점수(D 이상)에 미달했습니다. 해설 보기를 확인한 뒤 다시 도전하세요.`;
          failModalEl.classList.remove('hidden');
          Settings.playTone(220, 0.25, 0.05);
        } else {
          document.getElementById('ch5-stamp-asa').textContent = rec.extubated ? 'EXTUBATED' : 'PENDING';
          document.getElementById('ch5-stamp-prog').textContent = 'RECOVERY';
          document.getElementById('ch5-stamp-grade').textContent = currentStageId === 'tutorial' ? '완료' : grade;
          stampOverlayEl.classList.remove('hidden');
          Settings.playStampSound();
          Settings.triggerStageGlow();
        }
      });

      async function loadStage(stageId, opts = {}) {
        stopAll();
        const prevCase = currentCase;
        currentStageId = stageId;
        txLogs = [];
        chatHistory = [];
        chatBusy = false;
        revealedHome = new Set();
        evaluated = false;
        lastReport = null;
        aiText = null; soapText = null;

        setChatLocked(false);
        failModalEl.classList.add('hidden');
        reviewModalEl.classList.add('hidden');
        catHelpModalEl.classList.add('hidden');
        detailModalEl.classList.add('hidden');
        stampOverlayEl.classList.add('hidden');
        evalSubmitBtn.textContent = '회복 완료';
        document.querySelectorAll('.exam-main-btn, [data-care5]').forEach((b) => { b.classList.remove('exam-done'); b.disabled = false; });
        ['ch5-sec-vitals', 'ch5-sec-tx', 'ch5-sec-home'].forEach((id) => setMonCollapsed(id, false));
        txListEl.innerHTML = '<div class="mon-empty">회복 대기 중</div>';
        homeListEl.innerHTML = '<div class="mon-empty">퇴원 안내 후 기록</div>';
        chatLogEl.innerHTML = '';
        activateTab('extub');

        if (stageId === 'practice_dog' || stageId === 'practice_cat') {
          if (opts && opts.preserveCase && prevCase) {
            currentCase = prevCase;
          } else {
            sigHeadEl.innerHTML = '<span>환자 생성 중...</span>';
            ccLineEl.innerHTML = '';
            currentCase = await Data.generatePracticeCase(stageId === 'practice_cat' ? 'cat' : 'dog');
          }
        } else {
          currentCase = Data.getFixedCase(stageId);
        }

        sigHeadEl.innerHTML = `<span>${escapeHtml(currentCase.name)}</span><span class="ch1-sig-meta">${escapeHtml(currentCase.breed)} · ${escapeHtml(currentCase.age)} · ${currentCase.weight} kg · ${escapeHtml(currentCase.sex)} · ASA ${currentCase.trueAsa}${currentCase.trueEmergency ? 'E' : ''} (${escapeHtml(currentCase.truePrognosis)})</span>`;
        ccLineEl.innerHTML = `<strong>주호소:</strong> ${escapeHtml(currentCase.chiefComplaint)}`;
        renderFullPreopDetail(currentCase);

        const hasPain = currentCase.trueAsa >= 3;
        const hasDysphoria = !hasPain && currentCase.trueAsa === 2;
        rec = {
          sec: 0,
          hr: currentCase.pe.hr,
          rr: Math.max(10, Math.min(22, currentCase.pe.rr)),
          spo2: currentCase.trueAsa >= 4 ? 93 : 96,
          bt: Math.min(36.4, currentCase.pe.bt - 1.5),
          etIso: 1.2,
          washed: false,
          cuffDeflated: false,
          swallow: false,
          extubated: false,
          airwayChecked: false,
          o2: false,
          warm: false,
          pain: hasPain,
          dysphoria: hasDysphoria,
          earlyExtubMistake: false,
          cuffExtubMistake: false,
          naloxMistake: false,
          cares: new Set()
        };
        const greet = `선생님, ${currentCase.name} 수술 잘 끝났나요? 이제 집에 데려가면 어떻게 관리하면 될까요?`;
        appendBubble('owner', greet, false);
        chatHistory.push({ sender: 'owner', text: greet });
        renderMonitor();
        tickTimer = setInterval(stepRec, 1000);
      }

      const chapterCtrl = Settings.initChapterCommon({
        chapterNum: 5,
        chapterTitle: '마취 회복',
        initialStageId: 'tutorial',
        helpSlides: [
          { mark: '1', label: '마취 가스 세척 · 커프 제거 · 발관', desc: '기화기 OFF 후 100% O₂로 EtIso를 낮추고, 연하반사 회복 시 커프 공기를 제거한 뒤 발관합니다.' },
          { mark: '2', label: '회복기 보조 처치', desc: '저체온 가온, Flow-by 산소, 통증(진통제)과 불쾌감(저용량 진정제)을 구분해 처치합니다.' },
          { mark: '3', label: '보호자 퇴원 안내 및 완료', desc: '식이·음수, 투약·넥카라, 보온·안정, 응급 재내원 증상 4가지를 안내한 뒤 회복 완료를 누릅니다.' }
        ],
        tutorialSteps: [
          { title: '1. 회복기 모니터', sel: '#ch5-monitor', onEnter: () => activateTab('extub'), text: '회복기 생체 수치(HR·RR·SpO₂·BT·EtIso), 연하반사, 처치 로그와 보호자 퇴원 안내 현황을 확인합니다. 상세 버튼으로 마취 전 검사 결과를 볼 수 있습니다.' },
          { title: '2. 가스 세척 · 발관', sel: '#ch5-control', onEnter: () => activateTab('extub'), text: '기화기 OFF·100% O₂ 세척 후 연하반사가 2회 이상 회복되면 커프 공기를 제거하고 발관합니다.' },
          { title: '3. 회복기 보조 처치', sel: '#ch5-control', onEnter: () => activateTab('care'), text: '저체온·저산소·통증·불쾌감 상태에 맞춰 산소, 가온, 진통/진정/길항제를 선택적으로 적용합니다. ? 버튼으로 도움말을 볼 수 있습니다.' },
          { title: '4. 퇴원 안내 및 시작', sel: '#ch5-control', onEnter: () => activateTab('discharge'), text: '보호자에게 식이·투약·보온안정·응급 증상을 안내한 뒤 회복 완료를 누릅니다. 이제 튜토리얼 케이스를 시작합니다.' }
        ],
        onTutorialFinish: () => activateTab('extub'),
        onSelectStage: (stageId, opts) => loadStage(stageId, opts)
      });

      loadStage('tutorial');
    })();
  </script>
</body>
</html>
